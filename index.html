<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Admission & Bulk Report Card Manager</title>
    <style>
        :root {
            --primary-blue: #2563eb;
            --dark-navy: #1e293b;
            --border-color: #000;
            --bg-light: #f8fafc;
            --panel-bg: #ffffff;
        }

        body {
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 0;
            background-color: #e2e8f0;
            color: #000;
        }

        /* --- Admin Layout Container (Hidden on Print) --- */
        #admin-container {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 20px;
            padding: 20px;
            max-width: 1600px;
            margin: 0 auto;
        }

        .admin-header-bar {
            grid-column: 1 / -1;
            background-color: var(--dark-navy);
            color: white;
            padding: 15px 20px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        .admin-header-bar h1 {
            margin: 0;
            font-size: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-panel {
            background-color: #475569;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .admin-card {
            background: var(--panel-bg);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        .admin-card h2 {
            font-size: 14px;
            color: #475569;
            text-transform: uppercase;
            margin-top: 0;
            margin-bottom: 15px;
            letter-spacing: 0.5px;
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 8px;
        }

        .form-control {
            margin-bottom: 15px;
        }

        .form-control label {
            display: block;
            font-size: 11px;
            font-weight: bold;
            color: #64748b;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .form-control input, .form-control select {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }

        .btn-submit {
            width: 100%;
            background-color: var(--primary-blue);
            color: white;
            border: none;
            padding: 10px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
        }

        .db-filters {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
        }

        .db-filters input, .db-filters select {
            padding: 8px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 14px;
        }

        .bulk-actions-bar {
            background-color: #f1f5f9;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 13px;
        }

        .roster-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .roster-table th {
            color: #64748b;
            padding: 10px;
            border-bottom: 1px solid #e2e8f0;
            font-weight: 600;
        }

        .roster-table td {
            padding: 12px 10px;
            border-bottom: 1px solid #f1f5f9;
            color: #1e293b;
        }

        .roster-table tr.active-student {
            background-color: #eff6ff;
            font-weight: bold;
        }

        .roster-table tr:hover {
            background-color: #f8fafc;
            cursor: pointer;
        }

        .badge-stream {
            background-color: #dcfce7;
            color: #15803d;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
        }

        /* --- Input Fields Styles --- */
        .marks-panel-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 12px;
            margin-top: 15px;
        }

        .subject-block {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            padding: 10px;
            border-radius: 6px;
        }

        .subject-block label {
            font-weight: bold;
            font-size: 13px;
            display: block;
            margin-bottom: 6px;
            color: #1e293b;
            border-bottom: 1px solid #cbd5e1;
            padding-bottom: 2px;
        }

        .input-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 5px;
            margin-bottom: 4px;
        }

        .input-row div {
            display: flex;
            flex-direction: column;
        }

        .input-row span {
            font-size: 10px;
            color: #64748b;
            font-weight: bold;
        }

        .input-row input {
            padding: 4px;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            font-size: 11px;
            box-sizing: border-box;
        }

        .workspace-split {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .print-btn-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 15px;
        }

        .btn-print-action {
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-single { background-color: #10b981; }
        .btn-bulk { background-color: #7c3aed; }

        /* --- Report Card Page View (image_baccf3.png) --- */
        #print-output-container {
            display: block;
        }

        .report-card-page {
            background: white;
            width: 210mm;
            min-height: 297mm;
            padding: 15mm 20mm;
            margin: 30px auto;
            box-shadow: 0 0 20px rgba(0,0,0,0.15);
            box-sizing: border-box;
            position: relative;
            page-break-after: always; /* Kila ripoti itakaa ukurasa wake peke yake */
        }

        .report-header {
            text-align: center;
            position: relative;
            margin-bottom: 15px;
        }

        .logo-placeholder {
            position: absolute;
            left: 0;
            top: 0;
            width: 80px;
            height: 80px;
            border: 1px dashed #666;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: bold;
            text-align: center;
        }

        .header-title {
            font-size: 16px;
            font-weight: bold;
            line-height: 1.4;
            margin: 0;
            text-transform: uppercase;
        }

        .report-title {
            margin-top: 15px;
            font-size: 14px;
            font-weight: bold;
            text-decoration: underline;
            text-transform: uppercase;
        }

        .meta-info {
            width: 100%;
            margin-top: 15px;
            margin-bottom: 15px;
            font-size: 13px;
        }

        .meta-info td {
            padding: 4px 0;
        }

        .dotted-line {
            border-bottom: 1px dotted #000;
            display: inline-block;
            font-weight: bold;
            padding-left: 5px;
        }

        table.data-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
            margin-bottom: 10px;
        }

        table.data-table th, table.data-table td {
            border: 1px solid var(--border-color);
            padding: 5px;
            text-align: center;
            text-transform: uppercase;
        }

        table.data-table th {
            font-weight: bold;
            background-color: #f2f2f2;
        }

        table.data-table td.subject-name {
            text-align: left;
            font-weight: bold;
        }

        .summary-row {
            font-size: 13px;
            font-weight: bold;
            margin: 10px 0;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
        }

        .behavior-section {
            margin-top: 15px;
        }

        .section-heading {
            font-size: 13px;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .behavior-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        table.behavior-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 11px;
        }

        table.behavior-table th, table.behavior-table td {
            border: 1px solid var(--border-color);
            padding: 4px;
        }

        table.behavior-table td:nth-child(1) { text-align: left; }
        table.behavior-table td:nth-child(2) { text-align: center; font-weight: bold; width: 60px; }

        .grading-legend {
            font-size: 11px;
            margin-top: 5px;
            font-style: italic;
        }

        .admin-section {
            margin-top: 15px;
            font-size: 12px;
            line-height: 1.8;
        }

        .signature-stamp-space {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .stamp-box {
            border: 2px dashed #0000ff;
            color: #0000ff;
            border-radius: 50%;
            width: 110px;
            height: 110px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 9px;
            font-weight: bold;
            transform: rotate(-5deg);
            margin-top: -10px;
        }

        .parent-slip {
            margin-top: 25px;
            border-top: 1px dashed #000;
            position: relative;
            padding-top: 15px;
            font-size: 12px;
        }

        .scissors-icon {
            position: absolute;
            top: -10px;
            right: 10px;
            font-size: 16px;
            background: white;
            padding: 0 5px;
        }

        .slip-title {
            text-align: center;
            font-weight: bold;
            margin-bottom: 15px;
        }

        /* --- Print Rules --- */
        @media print {
            #admin-container {
                display: none !important;
            }
            body {
                background-color: white;
                padding: 0;
            }
            .report-card-page {
                box-shadow: none;
                margin: 0 auto 0mm auto;
                padding: 10mm 15mm;
                width: 210mm;
                height: 297mm;
                page-break-after: always;
                overflow: hidden;
            }
            /* Ficha ripoti ambazo hazijachaguliwa wakati wa kutoa bulk print */
            .report-card-page.hidden-print {
                display: none !important;
            }
        }
    </style>
</head>
<body>

    <div id="admin-container">
        <div class="admin-header-bar">
            <h1>🎓 Student Admission & Bulk Report Card Manager</h1>
            <button class="btn-panel">← Back to Panel</button>
        </div>

        <div class="admin-card">
            <h2>Enroll New Student</h2>
            <form id="enrollment-form" onsubmit="handleEnrollment(event)">
                <div class="form-control">
                    <label>Student Full Name</label>
                    <input type="text" id="stu-fullname" placeholder="E.G. CHUMA KANYAMA" required>
                </div>
                <div class="form-control">
                    <label>Gender</label>
                    <select id="stu-gender">
                        <option value="F">Female</option>
                        <option value="M">Male</option>
                    </select>
                </div>
                <div class="form-control">
                    <label>Form Level</label>
                    <select id="stu-form">
                        <option value="F1">F1</option>
                        <option value="F2">F2</option>
                        <option value="F3" selected>F3</option>
                        <option value="F4">F4</option>
                    </select>
                </div>
                <div class="form-control">
                    <label>Assigned Stream</label>
                    <select id="stu-stream">
                        <option value="Stream A">Stream A</option>
                        <option value="Stream B">Stream B</option>
                        <option value="Stream C">Stream C</option>
                    </select>
                </div>
                <button type="submit" class="btn-submit">Admit Student</button>
            </form>
        </div>

        <div class="workspace-split">
            <div class="admin-card">
                <h2>Global Enrolled Database</h2>
                <div class="db-filters">
                    <input type="text" id="search-filter" placeholder="🔍 Search student name..." oninput="renderRosterTable()" style="flex: 2;">
                    <select id="form-filter" onchange="renderRosterTable()" style="flex: 1;">
                        <option value="All">All Forms</option>
                        <option value="F1">F1</option>
                        <option value="F2">F2</option>
                        <option value="F3">F3</option>
                        <option value="F4">F4</option>
                    </select>
                    <select id="stream-filter" onchange="renderRosterTable()" style="flex: 1;">
                        <option value="All">All Streams</option>
                        <option value="Stream A">Stream A</option>
                        <option value="Stream B">Stream B</option>
                        <option value="Stream C">Stream C</option>
                    </select>
                </div>

                <div class="bulk-actions-bar">
                    <label><input type="checkbox" id="select-all-box" onchange="toggleSelectAll(this)"> Select All for Bulk Print</label>
                    <span id="selected-count-badge">Selected: 1 student(s)</span>
                </div>

                <table class="roster-table">
                    <thead>
                        <tr>
                            <th style="width: 40px; text-align: center;">Print</th>
                            <th>Student Name</th>
                            <th>Gender</th>
                            <th>Class Room</th>
                            <th>Stream Block</th>
                        </tr>
                    </thead>
                    <tbody id="roster-tbody"></tbody>
                </table>
            </div>

            <div class="admin-card">
                <h2>Edit Term Assessments (T1, T2, Mid, Annual)</h2>
                <div id="active-student-banner" style="font-weight: bold; color: var(--primary-blue); margin-bottom: 10px;">
                    Selected: PAULO THOMAS LOISUJAKU
                </div>
                <div class="marks-panel-grid" id="marks-entry-grid"></div>
                
                <div class="print-btn-group">
                    <button class="btn-print-action btn-single" onclick="printSingleReport()">
                        🖨️ Print Selected Single Report
                    </button>
                    <button class="btn-print-action btn-bulk" onclick="printBulkReports()">
                        📚 Bulk Print All Checked Reports
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div id="print-output-container"></div>

    <script>
        let globalStudents = [
            { id: 1, name: "ZAINAB ALLY", gender: "F", form: "F1", stream: "Stream A", marks: {}, checkedForPrint: true },
            { id: 2, name: "ALPHA MARY", gender: "F", form: "F1", stream: "Stream A", marks: {}, checkedForPrint: true },
            { id: 3, name: "BARAKA JUMA", gender: "M", form: "F1", stream: "Stream A", marks: {}, checkedForPrint: true },
            { id: 4, name: "CHUMA ALLY", gender: "M", form: "F1", stream: "Stream A", marks: {}, checkedForPrint: true },
            { id: 5, name: "FATMA OMARY", gender: "F", form: "F1", stream: "Stream C", marks: {}, checkedForPrint: true },
            { id: 6, name: "PAULO THOMAS LOISUJAKU", gender: "M", form: "F3", stream: "Stream A", checkedForPrint: true, marks: {
                "civ": { t1: 20, t2: 20, mid: 20, ann: 8, rnk: 107 }, 
                "hist": { t1: 30, t2: 30, mid: 30, ann: 24, rnk: 98 }, 
                "geo": { t1: 12, t2: 12, mid: 12, ann: 16, rnk: 117 },
                "kisw": { t1: 0, t2: 0, mid: 0, ann: 45, rnk: 132 }, 
                "eng": { t1: 20, t2: 20, mid: 20, ann: 33, rnk: 115 }, 
                "bio": { t1: 6, t2: 6, mid: 6, ann: 3, rnk: 145 },
                "math": { t1: 7, t2: 7, mid: 7, ann: 0, rnk: 125 }
            }}
        ];

        const subjectSchema = [
            { id: "civ", name: "CIVICS" }, { id: "hist", name: "HISTORY" }, { id: "geo", name: "GEOGRAPHY" },
            { id: "kisw", name: "KISWAHILI" }, { id: "eng", name: "ENGLISH" }, { id: "phy", name: "PHYSICS" },
            { id: "chem", name: "CHEMISTRY" }, { id: "bio", name: "BIOLOGY" }, { id: "math", name: "B/MATHS" },
            { id: "nutr", name: "NUTRITION" }, { id: "lit", name: "LITERATURE" }
        ];

        let selectedStudentId = 6;

        function init() {
            renderRosterTable();
            buildMarksInputs();
            selectStudent(selectedStudentId);
        }

        function handleEnrollment(e) {
            e.preventDefault();
            const name = document.getElementById('stu-fullname').value.toUpperCase();
            const gender = document.getElementById('stu-gender').value;
            const form = document.getElementById('stu-form').value;
            const stream = document.getElementById('stu-stream').value;

            const newStudent = { id: Date.now(), name, gender, form, stream, marks: {}, checkedForPrint: true };
            globalStudents.push(newStudent);
            document.getElementById('enrollment-form').reset();
            renderRosterTable();
            selectStudent(newStudent.id);
        }

        function renderRosterTable() {
            const tbody = document.getElementById('roster-tbody');
            const search = document.getElementById('search-filter').value.toLowerCase();
            const fFilter = document.getElementById('form-filter').value;
            const sFilter = document.getElementById('stream-filter').value;

            tbody.innerHTML = '';
            let checkedCount = 0;

            globalStudents.forEach(stu => {
                if (search && !stu.name.toLowerCase().includes(search)) return;
                if (fFilter !== 'All' && stu.form !== fFilter) return;
                if (sFilter !== 'All' && stu.stream !== sFilter) return;

                if (stu.checkedForPrint) checkedCount++;

                let tr = document.createElement('tr');
                if (stu.id === selectedStudentId) tr.className = 'active-student';
                
                // Mstari ukibonyezwa, chagua mwanafunzi huyu kumuwekea alama zake
                tr.onclick = (e) => {
                    if(e.target.type !== 'checkbox') selectStudent(stu.id);
                };
                
                tr.innerHTML = `
                    <td style="text-align:center;">
                        <input type="checkbox" ${stu.checkedForPrint ? 'checked' : ''} onchange="toggleStudentCheck(${stu.id}, this.checked)">
                    </td>
                    <td><strong>${stu.name}</strong></td>
                    <td>${stu.gender}</td>
                    <td style="color:#2563eb;">${stu.form}</td>
                    <td><span class="badge-stream">${stu.stream}</span></td>
                `;
                tbody.appendChild(tr);
            });

            document.getElementById('selected-count-badge').innerText = `Selected: ${checkedCount} student(s)`;
        }

        function toggleStudentCheck(id, isChecked) {
            const student = globalStudents.find(s => s.id === id);
            if(student) student.checkedForPrint = isChecked;
            document.getElementById('selected-count-badge').innerText = `Selected: ${globalStudents.filter(s=>s.checkedForPrint).length} student(s)`;
            generateAllReportCardsHTML();
        }

        function toggleSelectAll(masterBox) {
            globalStudents.forEach(s => s.checkedForPrint = masterBox.checked);
            renderRosterTable();
            generateAllReportCardsHTML();
        }

        function selectStudent(id) {
            selectedStudentId = id;
            const student = globalStudents.find(s => s.id === id);
            if (!student) return;

            document.getElementById('active-student-banner').innerText = `Selected: ${student.name} (${student.form} - ${student.stream})`;

            subjectSchema.forEach(sub => {
                const sData = student.marks[sub.id] || { t1: "-", t2: "-", mid: "-", ann: "-", rnk: "-" };
                document.getElementById(`in-t1-${sub.id}`).value = sData.t1;
                document.getElementById(`in-t2-${sub.id}`).value = sData.t2;
                document.getElementById(`in-mid-${sub.id}`).value = sData.mid;
                document.getElementById(`in-ann-${sub.id}`).value = sData.ann;
                document.getElementById(`in-rnk-${sub.id}`).value = sData.rnk;
            });

            renderRosterTable();
            generateAllReportCardsHTML();
        }

        function buildMarksInputs() {
            const grid = document.getElementById('marks-entry-grid');
            grid.innerHTML = '';
            subjectSchema.forEach(sub => {
                let div = document.createElement('div');
                div.className = 'subject-block';
                div.innerHTML = `
                    <label>${sub.name}</label>
                    <div class="input-row">
                        <div><span>T1 Marks</span><input type="text" id="in-t1-${sub.id}" oninput="saveMarks('${sub.id}')"></div>
                        <div><span>T2 Marks</span><input type="text" id="in-t2-${sub.id}" oninput="saveMarks('${sub.id}')"></div>
                    </div>
                    <div class="input-row">
                        <div><span>Midterm</span><input type="text" id="in-mid-${sub.id}" oninput="saveMarks('${sub.id}')"></div>
                        <div><span>Annual</span><input type="text" id="in-ann-${sub.id}" oninput="saveMarks('${sub.id}')"></div>
                    </div>
                    <div class="input-row" style="grid-template-columns: 1fr;">
                        <div><span>Subject Rank</span><input type="text" id="in-rnk-${sub.id}" oninput="saveMarks('${sub.id}')"></div>
                    </div>
                `;
                grid.appendChild(div);
            });
        }

        function updateTotalsInfo(totalStudents) {
            globalStudents.forEach(stu => {
                // unaweza kuweka logic ya kuweka idadi ya wanafunzi hapa
            });
        }

        function saveMarks(subId) {
            const student = globalStudents.find(s => s.id === selectedStudentId);
            if (!student) return;

            student.marks[subId] = {
                t1: document.getElementById(`in-t1-${subId}`).value.trim(),
                t2: document.getElementById(`in-t2-${subId}`).value.trim(),
                mid: document.getElementById(`in-mid-${subId}`).value.trim(),
                ann: document.getElementById(`in-ann-${subId}`).value.trim(),
                rnk: document.getElementById(`in-rnk-${subId}`).value.trim()
            };
            generateAllReportCardsHTML();
        }

        // KAZI KUBWA: Inatengeneza muundo wa Ripoti zote na kuziweka tayari kwenye HTML
        function generateAllReportCardsHTML() {
            const container = document.getElementById('print-output-container');
            container.innerHTML = ''; // Safisha kwanza

            globalStudents.forEach(student => {
                // Piga mahesabu ya mwanafunzi huyu maalum
                let tableRowsHTML = '';
                let totalMarksSum = 0;
                let activeSubjectsCount = 0;
                let collectedPoints = [];

                subjectSchema.forEach(sub => {
                    const sData = student.marks[sub.id] || { t1: "-", t2: "-", mid: "-", ann: "-", rnk: "-" };
                    let mazoezi = "-";
                    let mtihani = "-";
                    let jumla = "-";
                    let wastani = "-";
                    let daraja = "-";
                    let maoni = "-";

                    let cAssessList = [];
                    if(sData.t1 !== "-" && sData.t1 !== "") cAssessList.push(parseFloat(sData.t1) || 0);
                    if(sData.t2 !== "-" && sData.t2 !== "") cAssessList.push(parseFloat(sData.t2) || 0);
                    if(sData.mid !== "-" && sData.mid !== "") cAssessList.push(parseFloat(sData.mid) || 0);

                    if(cAssessList.length > 0) {
                        mazoezi = Math.round(cAssessList.reduce((a, b) => a + b, 0) / cAssessList.length);
                    }
                    if(sData.ann !== "-" && sData.ann !== "") {
                        mtihani = parseFloat(sData.ann) || 0;
                    }

                    if(mazoezi !== "-" && mtihani !== "-") {
                        jumla = mazoezi + mtihani;
                        wastani = jumla / 2;

                        if (jumla >= 75) { daraja = "A"; maoni = "VIZURI SANA"; collectedPoints.push(1); }
                        else if (jumla >= 65) { daraja = "B"; maoni = "VIZURI"; collectedPoints.push(2); }
                        else if (jumla >= 45) { daraja = "C"; maoni = "WASTANI"; collectedPoints.push(3); }
                        else if (jumla >= 30) { daraja = "D"; maoni = "INARIDHISHA"; collectedPoints.push(4); }
                        else { daraja = "F"; maoni = "FELI"; collectedPoints.push(5); }

                        totalMarksSum += jumla;
                        activeSubjectsCount++;
                    }

                    tableRowsHTML += `
                        <tr>
                            <td class="subject-name">${sub.name}</td>
                            <td>${mazoezi}</td>
                            <td>${mtihani}</td>
                            <td>${jumla}</td>
                            <td>${wastani}</td>
                            <td>${daraja}</td>
                            <td>${sData.rnk}</td>
                            <td>${maoni}</td>
                            <td><span style="font-size:9px;color:#888;">Sign</span></td>
                        </tr>
                    `;
                });

                // Mahesabu ya jumla ya chini (Summary Row)
                let lblJumla = "-", lblWastani = "-", lblDaraja = "-", lblPoints = "-", lblDivision = "-";
                if (activeSubjectsCount > 0) {
                    let globalAvg = totalMarksSum / activeSubjectsCount;
                    lblJumla = Math.round(totalMarksSum);
                    lblWastani = globalAvg.toFixed(1);
                    
                    let doubleAvg = globalAvg * 2;
                    if (doubleAvg >= 75) lblDaraja = "A";
                    else if (doubleAvg >= 65) lblDaraja = "B";
                    else if (doubleAvg >= 45) lblDaraja = "C";
                    else if (doubleAvg >= 30) lblDaraja = "D";
                    else lblDaraja = "F";

                    collectedPoints.sort((a,b) => a-b);
                    let pointsSum = collectedPoints.slice(0, 7).reduce((a, b) => a + b, 0);
                    lblPoints = pointsSum;

                    if (pointsSum >= 7 && pointsSum <= 17) lblDivision = "I";
                    else if (pointsSum <= 21) lblDivision = "II";
                    else if (pointsSum <= 25) lblDivision = "III";
                    else if (pointsSum <= 34) lblDivision = "IV";
                    else lblDivision = "0";
                }

                // Kizazi cha ukurasa kamili wa ripoti kwa mwanafunzi huyu
                let reportPageDiv = document.createElement('div');
                reportPageDiv.id = `report-card-id-${student.id}`;
                // Ukurasa huu utafichwa wakati wa print ikiwa haujachaguliwa kwenye mfumo wa bulk

                            <td style="width: 15%;">MWAKA: <span class="dotted-line" style="width: 45%;">2025</span></td>
                        </tr>
                    </table>

                    <table class="data-table">

                            <tr>
                                <th style="width: 25%;">SOMO</th>
                                <th style="width: 11%;">MAZOEZI</th>
                                <th style="width: 11%;">MTIHANI</th>
                                <th style="width: 11%;">JUMLA</th>
                                <th style="width: 11%;">WASTANI</th>
                                <th style="width: 10%;">DARAJA</th>
                                <th style="width: 10%;">NAFASI</th>
                                <th style="width: 21%;">MAONI YA MWALIMU</th>
                                <th style="width: 10%;">SAINI</th>
                            </tr>
                        </thead>
                        <tbody>${tableRowsHTML}</tbody>
                    </table>

                    <div class="summary-row">
                        <div>JUMLA: <span class="dotted-line" style="width: 45px; text-align: center;">${lblJumla}</span></div>
                        <div>WASTANI: <span class="dotted-line" style="width: 45px; text-align: center;">${lblWastani}</span></div>
                        <div>DARAJA: <span class="dotted-line" style="width: 35px; text-align: center;">${lblDaraja}</span></div>
                        <div>POINTS: <span class="dotted-line" style="width: 35px; text-align: center;">${lblPoints}</span></div>
                        <div>DIVISION: <span class="dotted-line" style="width: 50px; text-align: center;">${lblDivision}</span></div>
                    </div>
                    
                    <div class="summary-row" style="margin-top: 5px; margin-bottom: 20px;">
                        <div style="width: 100%;">AMEKUWA WA: <span class="dotted-line" style="width: 50px; text-align: center;">135</span> KATI YA: <span class="dotted-line" style="width: 50px; text-align: center;">152</span></div>
                    </div>

                    <div class="behavior-section">
                        <div class="section-heading">TABIA/KAZI/MWENENDO</div>
                        <div class="behavior-container">
                            <table class="behavior-table">
                                <thead><tr><th>UTENDAJI WA KAZI</th><th>DARAJA</th></tr></thead>
                                <tbody>
                                    <tr><td>SHUGHULI ZA KUJENGA TAIFA</td><td><span contenteditable="true">B</span></td></tr>
                                    <tr><td>BIDII NA MAARIFA</td><td><span contenteditable="true">B</span></td></tr>
                                    <tr><td>MWAMINIFU WA MALI YA UMMA</td><td><span contenteditable="true">B</span></td></tr>
                                    <tr><td>UELEWANO NA USHIRIKIANO</td><td><span contenteditable="true">B</span></td></tr>
                                    <tr><td>HESHIMA</td><td><span contenteditable="true">B</span></td></tr>
                                </tbody>
                            </table>
                            <table class="behavior-table">
                                <thead><tr><th>UTENDAJI WA KAZI</th><th>DARAJA</th></tr></thead>

                container.appendChild(reportPageDiv);
            });

        // CHAGUA KUCHAPISHA MWANAFUNZI MMOJA TU
        function printSingleReport() {
            // Weka ripoti zote kuwa hidden isipokuwa ile iliyochaguliwa sasa hivi
            globalStudents.forEach(s => {
                const el = document.getElementById(`report-card-id-${s.id}`);
                if(el) {
                    if(s.id === selectedStudentId) el.classList.remove('hidden-print');
                    else el.classList.add('hidden-print');
                }
            });
            window.print();
        }

        // CHAGUA KUCHAPISHA WANAFUNZI WOTE WALIOCHAGULIWA (BULK)
        function printBulkReports() {
            // Onyesha ripoti zote ambazo zina checkbox ya true, zilizobaki zifichwe
            let anyChecked = false;
            globalStudents.forEach(s => {
                const el = document.getElementById(`report-card-id-${s.id}`);
                if(el) {
                    if(s.checkedForPrint) {
                        el.classList.remove('hidden-print');
                        anyChecked = true;
                    } else {
                        el.classList.add('hidden-print');
                    }
                }
            });

            if(!anyChecked) {
                alert("Tafadhali chagua angalau mwanafunzi mmoja (weka vema kwenye kibox) ili kutoa Bulk Print!");
                return;
            }
            window.print();
        }

        window.onload = init;
    </script>
