<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Admission & Bulk Report Card Manager</title>
    <style>
        :root {
            --primary-blue: #2563eb;
            --dark-navy: #1e293b;
            --border-color: #000;
            --bg-light: #f8fafc;
            --panel-bg: #ffffff;
        }

        body {
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 0;
            background-color: #e2e8f0;
            color: #000;
        }

        /* --- Admin Layout Container (Hidden on Print) --- */
        #admin-container {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 20px;
            padding: 20px;
            max-width: 1600px;
            margin: 0 auto;
        }

        .admin-header-bar {
            grid-column: 1 / -1;
            background-color: var(--dark-navy);
            color: white;
            padding: 15px 20px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        .admin-header-bar h1 {
            margin: 0;
            font-size: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-panel {
            background-color: #475569;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        .btn-panel:hover {
            background-color: #334155;
        }

        .admin-card {
            background: var(--panel-bg);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin-bottom: 20px;
        }

        .admin-card h2 {
            font-size: 14px;
            color: #475569;
            text-transform: uppercase;
            margin-top: 0;
            margin-bottom: 15px;
            letter-spacing: 0.5px;
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 8px;
        }

        .form-control {
            margin-bottom: 12px;
        }

        .form-control label {
            display: block;
            font-size: 11px;
            font-weight: bold;
            color: #64748b;
            margin-bottom: 4px;
            text-transform: uppercase;
        }

        .form-control input, .form-control select {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }

        .btn-submit {
            width: 100%;
            background-color: var(--primary-blue);
            color: white;
            border: none;
            padding: 10px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
        }

        .db-filters {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
        }

        .db-filters input, .db-filters select {
            padding: 8px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 14px;
        }

        .bulk-actions-bar {
            background-color: #f1f5f9;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 13px;
        }

        .roster-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .roster-table th {
            color: #64748b;
            padding: 10px;
            border-bottom: 1px solid #e2e8f0;
            font-weight: 600;
        }

        .roster-table td {
            padding: 12px 10px;
            border-bottom: 1px solid #f1f5f9;
            color: #1e293b;
        }

        .roster-table tr.active-student {
            background-color: #eff6ff;
            font-weight: bold;
        }

        .roster-table tr:hover {
            background-color: #f8fafc;
            cursor: pointer;
        }

        .badge-stream {
            background-color: #dcfce7;
            color: #15803d;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
        }

        /* --- Input Fields Styles --- */
        .marks-panel-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 12px;
            margin-top: 15px;
        }

        .subject-block {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            padding: 10px;
            border-radius: 6px;
        }

        .subject-block label {
            font-weight: bold;
            font-size: 13px;
            display: block;
            margin-bottom: 6px;
            color: #1e293b;
            border-bottom: 1px solid #cbd5e1;
            padding-bottom: 2px;
        }

        .input-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 5px;
            margin-bottom: 4px;
        }

        .input-row div {
            display: flex;
            flex-direction: column;
        }

        .input-row span {
            font-size: 10px;
            color: #64748b;
            font-weight: bold;
        }

        .input-row input {
            padding: 4px;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            font-size: 11px;
            box-sizing: border-box;
        }

        .workspace-split {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .print-btn-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 15px;
        }

        .btn-print-action {
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-single { background-color: #10b981; }
        .btn-bulk { background-color: #7c3aed; }

        /* --- Report Card Page View --- */
        #print-output-container {
            display: block;
        }

        .report-card-page {
            background: white;
            width: 210mm;
            min-height: 297mm;
            padding: 15mm 20mm;
            margin: 30px auto;
            box-shadow: 0 0 20px rgba(0,0,0,0.15);
            box-sizing: border-box;
            position: relative;
            page-break-after: always;
        }

        .report-header {
            text-align: center;
            position: relative;
            margin-bottom: 15px;
        }

        .logo-placeholder {
            position: absolute;
            left: 0;
            top: 0;
            width: 80px;
            height: 80px;
            border: 1px dashed #666;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: bold;
            text-align: center;
        }

        .header-title {
            font-size: 16px;
            font-weight: bold;
            line-height: 1.4;
            margin: 0;
            text-transform: uppercase;
        }

        .report-title {
            margin-top: 15px;
            font-size: 14px;
            font-weight: bold;
            text-decoration: underline;
            text-transform: uppercase;
        }

        .meta-info {
            width: 100%;
            margin-top: 15px;
            margin-bottom: 15px;
            font-size: 13px;
        }

        .meta-info td {
            padding: 4px 0;
        }

        .dotted-line {
            border-bottom: 1px dotted #000;
            display: inline-block;
            font-weight: bold;
            padding-left: 5px;
        }

        table.data-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
            margin-bottom: 10px;
        }

        table.data-table th, table.data-table td {
            border: 1px solid var(--border-color);
            padding: 5px;
            text-align: center;
            text-transform: uppercase;
        }

        table.data-table th {
            font-weight: bold;
            background-color: #f2f2f2;
        }

        table.data-table td.subject-name {
            text-align: left;
            font-weight: bold;
        }

        .summary-row {
            font-size: 13px;
            font-weight: bold;
            margin: 10px 0;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
        }

        .behavior-section {
            margin-top: 15px;
        }

        .section-heading {
            font-size: 13px;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .behavior-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        table.behavior-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 11px;
        }

        table.behavior-table th, table.behavior-table td {
            border: 1px solid var(--border-color);
            padding: 4px;
        }

        table.behavior-table td:nth-child(1) { text-align: left; }
        table.behavior-table td:nth-child(2) { text-align: center; font-weight: bold; width: 60px; }

        .grading-legend {
            font-size: 11px;
            margin-top: 5px;
            font-style: italic;
        }

        .admin-section {
            margin-top: 15px;
            font-size: 12px;
            line-height: 1.8;
        }

        .signature-stamp-space {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .stamp-box {
            border: 2px dashed #0000ff;
            color: #0000ff;
            border-radius: 50%;
            width: 110px;
            height: 110px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 9px;
            font-weight: bold;
            transform: rotate(-5deg);
            margin-top: -10px;
        }

        .parent-slip {
            margin-top: 25px;
            border-top: 1px dashed #000;
            position: relative;
            padding-top: 15px;
            font-size: 12px;
        }

        .scissors-icon {
            position: absolute;
            top: -10px;
            right: 10px;
            font-size: 16px;
            background: white;
            padding: 0 5px;
        }

        .slip-title {
            text-align: center;
            font-weight: bold;
            margin-bottom: 15px;
        }

        /* --- Print Rules --- */
        @media print {
            #admin-container {
                display: none !important;
            }
            body {
                background-color: white;
                padding: 0;
            }
            .report-card-page {
                box-shadow: none;
                margin: 0 auto 0mm auto;
                padding: 10mm 15mm;
                width: 210mm;
                height: 297mm;
                page-break-after: always;
                overflow: hidden;
            }
            .report-card-page.hidden-print {
                display: none !important;
            }
        }
    </style>
</head>
<body>

    <div id="admin-container">
        <div class="admin-header-bar">
            <h1>🎓 Student Admission & Bulk Report Card Manager</h1>
            <button class="btn-panel" onclick="backToPanel()">← Back to Panel</button>
        </div>

        <div style="display: flex; flex-direction: column; gap: 10px;">
            
            <div class="admin-card">
                <h2>⚙️ Report Card Settings</h2>
                <div class="form-control">
                    <label>Muhula (Term)</label>
                    <select id="cfg-term" onchange="updateGlobalSettings()">
                        <option value="I">MUHULA WA I</option>
                        <option value="II" selected>MUHULA WA II</option>
                    </select>
                </div>
                <div class="form-control">
                    <label>Mwaka (Year)</label>
                    <input type="text" id="cfg-year" value="2026" oninput="updateGlobalSettings()">
                </div>
                <div class="form-control">
                    <label>Shule Imefungwa</label>
                    <input type="text" id="cfg-close-date" value="05/12/2026" oninput="updateGlobalSettings()">
                </div>
                <div class="form-control">
                    <label>Itafunguliwa Tarehe</label>
                    <input type="text" id="cfg-open-date" value="12/01/2027" oninput="updateGlobalSettings()">
                </div>
            </div>

            <div class="admin-card">
                <h2>Enroll New Student</h2>
                <form id="enrollment-form" onsubmit="handleEnrollment(event)">
                    <div class="form-control">
                        <label>Student Full Name</label>
                        <input type="text" id="stu-fullname" placeholder="E.G. CHUMA KANYAMA" required>
                    </div>
                    <div class="form-control">
                        <label>Gender</label>
                        <select id="stu-gender">
                            <option value="F">Female</option>
                            <option value="M">Male</option>
                        </select>
                    </div>
                    <div class="form-control">
                        <label>Form Level</label>
                        <select id="stu-form">
                            <option value="F1">F1</option>
                            <option value="F2">F2</option>
                            <option value="F3" selected>F3</option>
                            <option value="F4">F4</option>
                        </select>
                    </div>
                    <div class="form-control">
                        <label>Assigned Stream</label>
                        <select id="stu-stream">
                            <option value="Stream A">Stream A</option>
                            <option value="Stream B">Stream B</option>
                            <option value="Stream C">Stream C</option>
                        </select>
                    </div>
                    <button type="submit" class="btn-submit">Admit Student</button>
                </form>
            </div>
        </div>

        <div class="workspace-split">
            <div class="admin-card">
                <h2>Global Enrolled Database</h2>
                <div class="db-filters">
                    <input type="text" id="search-filter" placeholder="🔍 Search student name..." oninput="renderRosterTable()" style="flex: 2;">
                    <select id="form-filter" onchange="renderRosterTable()" style="flex: 1;">
                        <option value="All">All Forms</option>
                        <option value="F1">F1</option>
                        <option value="F2">F2</option>
                        <option value="F3">F3</option>
                        <option value="F4">F4</option>
                    </select>
                    <select id="stream-filter" onchange="renderRosterTable()" style="flex: 1;">
                        <option value="All">All Streams</option>
                        <option value="Stream A">Stream A</option>
                        <option value="Stream B">Stream B</option>
                        <option value="Stream C">Stream C</option>
                    </select>
                </div>

                <div class="bulk-actions-bar">
                    <label><input type="checkbox" id="select-all-box" onchange="toggleSelectAll(this)"> Select All for Bulk Print</label>
                    <span id="selected-count-badge">Selected: 1 student(s)</span>
                </div>

                <table class="roster-table">
                    <thead>
                        <tr>
                            <th style="width: 40px; text-align: center;">Print</th>
                            <th>Student Name</th>
                            <th>Gender</th>
                            <th>Class Room</th>
                            <th>Stream Block</th>
                        </tr>
                    </thead>
                    <tbody id="roster-tbody"></tbody>
                </table>
            </div>

            <div class="admin-card">
                <h2>Edit Term Assessments (T1, T2, Mid, Annual)</h2>
                <div id="active-student-banner" style="font-weight: bold; color: var(--primary-blue); margin-bottom: 10px;">
                    Selected: PAULO THOMAS LOISUJAKU
                </div>
                <div class="marks-panel-grid" id="marks-entry-grid"></div>
                
                <div class="print-btn-group">
                    <button class="btn-print-action btn-single" onclick="printSingleReport()">
                        🖨️ Print Selected Single Report
                    </button>
                    <button class="btn-print-action btn-bulk" onclick="printBulkReports()">
                        📚 Bulk Print All Checked Reports
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div id="print-output-container"></div>

    <script>
        // Data ya wanafunzi
        let globalStudents = [
            { id: 1, name: "ZAINAB ALLY", gender: "F", form: "F1", stream: "Stream A", checkedForPrint: true, marks: {
                "his_maadili": { t1: 80, t2: 70, mid: 75, ann: 78, rnk: 1 }, "hist": { t1: 60, t2: 65, mid: 70, ann: 68, rnk: 2 },
                "geo": { t1: 50, t2: 55, mid: 45, ann: 52, rnk: 3 }, "kisw": { t1: 85, t2: 90, mid: 88, ann: 86, rnk: 1 },
                "eng": { t1: 70, t2: 75, mid: 72, ann: 74, rnk: 2 }, "phy": { t1: 40, t2: 45, mid: 50, ann: 48, rnk: 4 },
                "chem": { t1: 55, t2: 60, mid: 58, ann: 56, rnk: 3 }, "bio": { t1: 65, t2: 70, mid: 62, ann: 66, rnk: 2 },
                "math": { t1: 30, t2: 35, mid: 40, ann: 38, rnk: 5 }, "bus_studies": { t1: 60, t2: 62, mid: 65, ann: 63, rnk: 3 },
                "book_keeping": { t1: 70, t2: 68, mid: 72, ann: 71, rnk: 2 }
            }},
            { id: 2, name: "ALPHA MARY", gender: "F", form: "F1", stream: "Stream A", checkedForPrint: true, marks: {
                "his_maadili": { t1: 40, t2: 42, mid: 45, ann: 43, rnk: 4 }, "hist": { t1: 30, t2: 35, mid: 32, ann: 34, rnk: 5 }
            }},
            { id: 3, name: "BARAKA JUMA", gender: "M", form: "F2", stream: "Stream B", marks: {}, checkedForPrint: true },
            { id: 4, name: "CHUMA ALLY", gender: "M", form: "F2", stream: "Stream A", marks: {}, checkedForPrint: true },
            { id: 5, name: "FATMA OMARY", gender: "F", form: "F1", stream: "Stream C", marks: {}, checkedForPrint: true },
            { id: 6, name: "PAULO THOMAS LOISUJAKU", gender: "M", form: "F3", stream: "Stream A", checkedForPrint: true, marks: {
                "civ": { t1: 75, t2: 80, mid: 85, ann: 78, rnk: 1 }, "hist": { t1: 70, t2: 72, mid: 68, ann: 71, rnk: 2 }, 
                "geo": { t1: 60, t2: 65, mid: 62, ann: 64, rnk: 3 }, "kisw": { t1: 85, t2: 88, mid: 90, ann: 87, rnk: 1 }, 
                "eng": { t1: 80, t2: 82, mid: 78, ann: 81, rnk: 2 }, "phy": { t1: 50, t2: 55, mid: 52, ann: 54, rnk: 4 },
                "chem": { t1: 65, t2: 68, mid: 62, ann: 66, rnk: 3 }, "bio": { t1: 70, t2: 75, mid: 72, ann: 73, rnk: 2 }, 
                "math": { t1: 45, t2: 50, mid: 48, ann: 49, rnk: 5 }, "nutr": { t1: 60, t2: 62, mid: 58, ann: 61, rnk: 4 }, 
                "lit": { t1: 70, t2: 72, mid: 74, ann: 73, rnk: 3 }
            }}
        ];

        const subjectsF1F2 = [
            { id: "his_maadili", name: "HISTORIA NA MAADILI" }, { id: "hist", name: "HISTORIA" }, { id: "geo", name: "GEOGRAPHY" },
            { id: "kisw", name: "KISWAHILI" }, { id: "eng", name: "ENGLISH" }, { id: "phy", name: "PHYSICS" },
            { id: "chem", name: "CHEMISTRY" }, { id: "bio", name: "BIOLOGY" }, { id: "math", name: "MATHEMATICS" },
            { id: "bus_studies", name: "BUSINESS STUDIES" }, { id: "book_keeping", name: "BOOK KEEPING" }
        ];

        const subjectsF3F4 = [
            { id: "civ", name: "CIVICS" }, { id: "hist", name: "HISTORY" }, { id: "geo", name: "GEOGRAPHY" },
            { id: "kisw", name: "KISWAHILI" }, { id: "eng", name: "ENGLISH" }, { id: "phy", name: "PHYSICS" },
            { id: "chem", name: "CHEMISTRY" }, { id: "bio", name: "BIOLOGY" }, { id: "math", name: "B/MATHS" },
            { id: "nutr", name: "NUTRITION" }, { id: "lit", name: "LITERATURE" }
        ];

        let selectedStudentId = 6;

        // Kitufe cha Back to Panel kufanya kazi
        function backToPanel() {
            // Inarudisha kwenye dashboard yako kuu (Badilisha 'index.html' au weka faili husika kama dashboard.html)
            window.location.href = "dashboard.html"; 
        }

        function init() {
            renderRosterTable();
            buildMarksInputs();
            selectStudent(selectedStudentId);
        }

        // Kazi ya kusasisha ripoti zote mara moja pale mipangilio inapobadilishwa upande wa kushoto
        function updateGlobalSettings() {
            generateAllReportCardsHTML();
        }

        function getSubjectSchemaForStudent(form) {
            return (form === "F1" || form === "F2") ? subjectsF1F2 : subjectsF3F4;
        }

        function handleEnrollment(e) {
            e.preventDefault();
            const name = document.getElementById('stu-fullname').value.toUpperCase();
            const gender = document.getElementById('stu-gender').value;
            const form = document.getElementById('stu-form').value;
            const stream = document.getElementById('stu-stream').value;

            const newStudent = { id: Date.now(), name, gender, form, stream, marks: {}, checkedForPrint: true };
            globalStudents.push(newStudent);
            document.getElementById('enrollment-form').reset();
            renderRosterTable();
            selectStudent(newStudent.id);
        }

        function renderRosterTable() {
            const tbody = document.getElementById('roster-tbody');
            const search = document.getElementById('search-filter').value.toLowerCase();
            const fFilter = document.getElementById('form-filter').value;
            const sFilter = document.getElementById('stream-filter').value;

            tbody.innerHTML = '';
            let checkedCount = 0;

            globalStudents.forEach(stu => {
                if (search && !stu.name.toLowerCase().includes(search)) return;
                if (fFilter !== 'All' && stu.form !== fFilter) return;
                if (sFilter !== 'All' && stu.stream !== sFilter) return;

                if (stu.checkedForPrint) checkedCount++;

                let tr = document.createElement('tr');
                if (stu.id === selectedStudentId) tr.className = 'active-student';
                
                tr.onclick = (e) => {
                    if(e.target.type !== 'checkbox') selectStudent(stu.id);
                };
                
                tr.innerHTML = `
                    <td style="text-align:center;">
                        <input type="checkbox" ${stu.checkedForPrint ? 'checked' : ''} onchange="toggleStudentCheck(${stu.id}, this.checked)">
                    </td>
                    <td><strong>${stu.name}</strong></td>
                    <td>${stu.gender}</td>
                    <td style="color:#2563eb;">${stu.form}</td>
                    <td><span class="badge-stream">${stu.stream}</span></td>
                `;
                tbody.appendChild(tr);
            });

            document.getElementById('selected-count-badge').innerText = `Selected: ${checkedCount} student(s)`;
        }

        function toggleStudentCheck(id, isChecked) {
            const student = globalStudents.find(s => s.id === id);
            if(student) student.checkedForPrint = isChecked;
            document.getElementById('selected-count-badge').innerText = `Selected: ${globalStudents.filter(s=>s.checkedForPrint).length} student(s)`;
            generateAllReportCardsHTML();
        }

        function toggleSelectAll(masterBox) {
            globalStudents.forEach(s => s.checkedForPrint = masterBox.checked);
            renderRosterTable();
            generateAllReportCardsHTML();
        }

        function selectStudent(id) {
            selectedStudentId = id;
            const student = globalStudents.find(s => s.id === id);
            if (!student) return;

            document.getElementById('active-student-banner').innerText = `Selected: ${student.name} (${student.form} - ${student.stream})`;
            buildMarksInputs();

            const currentSchema = getSubjectSchemaForStudent(student.form);
            currentSchema.forEach(sub => {
                const sData = student.marks[sub.id] || { t1: "", t2: "", mid: "", ann: "", rnk: "" };
                document.getElementById(`in-t1-${sub.id}`).value = sData.t1;
                document.getElementById(`in-t2-${sub.id}`).value = sData.t2;
                document.getElementById(`in-mid-${sub.id}`).value = sData.mid;
                document.getElementById(`in-ann-${sub.id}`).value = sData.ann;
                document.getElementById(`in-rnk-${sub.id}`).value = sData.rnk;
            });

            renderRosterTable();
            generateAllReportCardsHTML();
        }

        function buildMarksInputs() {
            const student = globalStudents.find(s => s.id === selectedStudentId);
            const formLevel = student ? student.form : "F3";
            const currentSchema = getSubjectSchemaForStudent(formLevel);

            const grid = document.getElementById('marks-entry-grid');
            grid.innerHTML = '';

            currentSchema.forEach(sub => {
                let div = document.createElement('div');
                div.className = 'subject-block';
                div.innerHTML = `
                    <label>${sub.name}</label>
                    <div class="input-row">
                        <div><span>T1 Marks</span><input type="text" id="in-t1-${sub.id}" oninput="saveMarks('${sub.id}')"></div>
                        <div><span>T2 Marks</span><input type="text" id="in-t2-${sub.id}" oninput="saveMarks('${sub.id}')"></div>
                    </div>
                    <div class="input-row">
                        <div><span>Midterm</span><input type="text" id="in-mid-${sub.id}" oninput="saveMarks('${sub.id}')"></div>
                        <div><span>Annual</span><input type="text" id="in-ann-${sub.id}" oninput="saveMarks('${sub.id}')"></div>
                    </div>
                    <div class="input-row" style="grid-template-columns: 1fr;">
                        <div><span>Subject Rank</span><input type="text" id="in-rnk-${sub.id}" oninput="saveMarks('${sub.id}')"></div>
                    </div>
                `;
                grid.appendChild(div);
            });
        }

        function saveMarks(subId) {
            const student = globalStudents.find(s => s.id === selectedStudentId);
            if (!student) return;

            if (!student.marks) student.marks = {};
            
            student.marks[subId] = {
                t1: document.getElementById(`in-t1-${subId}`).value.trim(),
                t2: document.getElementById(`in-t2-${subId}`).value.trim(),
                mid: document.getElementById(`in-mid-${subId}`).value.trim(),
                ann: document.getElementById(`in-ann-${subId}`).value.trim(),
                rnk: document.getElementById(`in-rnk-${subId}`).value.trim()
            };
            generateAllReportCardsHTML();
        }

        function computeStudentPerformance(student) {
            const currentSchema = getSubjectSchemaForStudent(student.form);
            let subjectAverages = [];
            let gradePoints = [];
            let tableRowsHTML = '';

            currentSchema.forEach(sub => {
                const sData = student.marks[sub.id] || { t1: "", t2: "", mid: "", ann: "", rnk: "" };
                let mazoezi = "-";
                let mtihani = "-";
                let jumla = "-";
                let wastani = "-";
                let daraja = "-";
                let maoni = "-";
                let pts = 5;

                let cAssessList = [];
                if(sData.t1 !== "" && sData.t1 !== undefined) cAssessList.push(parseFloat(sData.t1) || 0);
                if(sData.t2 !== "" && sData.t2 !== undefined) cAssessList.push(parseFloat(sData.t2) || 0);
                if(sData.mid !== "" && sData.mid !== undefined) cAssessList.push(parseFloat(sData.mid) || 0);

                if(cAssessList.length > 0) {
                    mazoezi = cAssessList.reduce((a, b) => a + b, 0) / cAssessList.length;
                }
                if(sData.ann !== "" && sData.ann !== undefined) {
                    mtihani = parseFloat(sData.ann) || 0;
                }

                if(mazoezi !== "-" && mtihani !== "-") {
                    wastani = (mazoezi + mtihani) / 2;
                    jumla = mazoezi + mtihani;

                    if (wastani >= 75) { daraja = "A"; maoni = "VIZURI SANA"; pts = 1; }
                    else if (wastani >= 65) { daraja = "B"; maoni = "VIZURI"; pts = 2; }
                    else if (wastani >= 45) { daraja = "C"; maoni = "WASTANI"; pts = 3; }
                    else if (wastani >= 30) { daraja = "D"; maoni = "INARIDHISHA"; pts = 4; }
                    else { daraja = "F"; maoni = "FELI"; pts = 5; }

                    subjectAverages.push(wastani);
                    gradePoints.push(pts);
                }

                tableRowsHTML += `
                    <tr>
                        <td class="subject-name">${sub.name}</td>
                        <td>${mazoezi !== "-" ? Math.round(mazoezi) : "-"}</td>
                        <td>${mtihani !== "-" ? Math.round(mtihani) : "-"}</td>
                        <td>${jumla !== "-" ? Math.round(jumla) : "-"}</td>
                        <td>${wastani !== "-" ? wastani.toFixed(1) : "-"}</td>
                        <td style="font-weight:bold;">${daraja}</td>
                        <td>${sData.rnk || "-"}</td>
                        <td>${maoni}</td>
                        <td><span style="font-size:9px;color:#888;">Sign</span></td>
                    </tr>
                `;
            });

            let lblJumla = "-", lblWastani = "-", lblDaraja = "-", lblPoints = "-", lblDivision = "-", divValue = 5;
            let avgValue = 0;
            let maoniMwalimu = "Ingiza alama kwanza", maoniMkuu = "Ingiza alama kwanza";

            if (subjectAverages.length > 0) {
                let totalOfAvgs = subjectAverages.reduce((a, b) => a + b, 0);
                lblJumla = totalOfAvgs.toFixed(1);

                avgValue = totalOfAvgs / subjectAverages.length;
                lblWastani = avgValue.toFixed(1);

                if (avgValue >= 75) lblDaraja = "A";
                else if (avgValue >= 65) lblDaraja = "B";
                else if (avgValue >= 45) lblDaraja = "C";
                else if (avgValue >= 30) lblDaraja = "D";
                else lblDaraja = "F";

                gradePoints.sort((a, b) => a - b);
                
                let best7Points = [...gradePoints];
                while (best7Points.length < 7) {
                    best7Points.push(5);
                }
                let pointsSum = best7Points.slice(0, 7).reduce((a, b) => a + b, 0);
                lblPoints = pointsSum;

                if (pointsSum >= 7 && pointsSum <= 17) { lblDivision = "I"; divValue = 1; }
                else if (pointsSum <= 21) { lblDivision = "II"; divValue = 2; }
                else if (pointsSum <= 24) { lblDivision = "III"; divValue = 3; }
                else if (pointsSum <= 33) { lblDivision = "IV"; divValue = 4; }
                else { lblDivision = "0"; divValue = 5; }

                if (lblDivision === "I") maoniMwalimu = "Hongera kwa matokeo mazuri na ongeza bidii zaidi";
                else if (lblDivision === "II") maoniMwalimu = "Vizuri ongeza bidii zaidi upate division I";
                else if (lblDivision === "III") maoniMwalimu = "Wastani soma kwa bidii zaidi upandishe ufaulu wako";
                else if (lblDivision === "IV") maoniMwalimu = "Matokeo dhaifu ongeza juhudi katika masomo yako";
                else if (lblDivision === "0") maoniMwalimu = "Feli ongeza bidii katika masomo ili uweze kufaulu katika mitihani yako";

                if (lblDivision === "I") maoniMkuu = "Vizuri ongeza bidii";
                else if (lblDivision === "II") maoniMkuu = "soma kwa juhudizaidi";
                else if (lblDivision === "III") maoniMkuu = "ongeza bidii zaidi katika masomo";
                else if (lblDivision === "IV" || lblDivision === "0") maoniMkuu = "Matokeo mabaya soma kwa bidii zaidi uweze kuongeza ufaulu wako";
            }

            return {
                tableRowsHTML, lblJumla, lblWastani, lblDaraja, lblPoints, lblDivision,
                divValue, pointsValue: parseFloat(lblPoints) || 99, avgValue, maoniMwalimu, maoniMkuu
            };
        }

                    let resA = studentCalculations[a.id];
                    let resB = studentCalculations[b.id];
                    if (resA.divValue !== resB.divValue) return resA.divValue - resB.divValue;
                    if (resA.pointsValue !== resB.pointsValue) return resA.pointsValue - resB.pointsValue;
                    return resB.avgValue - resA.avgValue;

                    </table>

                    <table class="data-table">

                                <th style="width: 11%;">MAZOEZI</th>

                                <th style="width: 11%;">JUMLA</th>
                                <th style="width: 11%;">WASTANI</th>
                                <th style="width: 10%;">DARAJA</th>
                                <th style="width: 10%;">NAFASI</th>
                                <th style="width: 21%;">MAONI YA MWALIMU</th>
                                <th style="width: 10%;">SAINI</th>
                            </tr>
                        </thead>
                        <tbody>${res.tableRowsHTML}</tbody>
                    </table>

                    <div class="summary-row">
                        <div>JUMLA: <span class="dotted-line" style="width: 65px; text-align: center;">${res.lblJumla}</span></div>
                        <div>WASTANI: <span class="dotted-line" style="width: 55px; text-align: center;">${res.lblWastani}</span></div>
                        <div>DARAJA: <span class="dotted-line" style="width: 35px; text-align: center;">${res.lblDaraja}</span></div>
                        <div>POINTS: <span class="dotted-line" style="width: 35px; text-align: center;">${res.lblPoints}</span></div>
                        <div>DIVISION: <span class="dotted-line" style="width: 50px; text-align: center;">${res.lblDivision}</span></div>
                    </div>
                    
                    <div class="summary-row" style="margin-top: 5px; margin-bottom: 20px;">
                        <div style="width: 100%;">AMEKUWA WA: <span class="dotted-line" style="width: 50px; text-align: center;">${currentRank}</span> KATI YA: <span class="dotted-line" style="width: 50px; text-align: center;">${totalInClass}</span></div>
                    </div>

                    <div class="behavior-section">
                        <div class="section-heading">TABIA/KAZI/MWENENDO</div>
                        <div class="behavior-container">
                            <table class="behavior-table">
                                <thead><tr><th>UTENDAJI WA KAZI</th><th>DARAJA</th></tr></thead>
                                <tbody>
                                    <tr><td>SHUGHULI ZA KUJENGA TAIFA</td><td><span contenteditable="true">B</span></td></tr>
                                    <tr><td>BIDII NA MAARIFA</td><td><span contenteditable="true">B</span></td></tr>
                                    <tr><td>MWAMINIFU WA MALI YA UMMA</td><td><span contenteditable="true">B</span></td></tr>

                                <div>MAONI YA MKUU WA SHULE: <span class="dotted-line" style="width: 63%; font-style: italic;" contenteditable="true">${res.maoniMkuu}</span></div>
                                <div style="margin-top: 5px;">SAINI YA MKUU WA SHULE: <span class="dotted-line" style="width: 40%;">......................................</span></div>
                            </div>
                            <div class="stamp-box">

                                <span style="border-top:1px solid #00f; border-bottom:1px solid #00f; font-size:8px; padding:1px;">DATE: 10/12/2026</span>
                                <span>P.O.BOX 8249</span>

                    </div>

                    <div class="parent-slip">
                        <div class="scissors-icon">✂---</div>

                                <td>TAREHE:...................................</td>
                                <td>SAINI:.....................................</td>

                container.appendChild(reportPageDiv);

        }

        function printSingleReport() {
            globalStudents.forEach(s => {
                const el = document.getElementById(`report-card-id-${s.id}`);
                if(el) {
                    if(s.id === selectedStudentId) el.classList.remove('hidden-print');
                    else el.classList.add('hidden-print');
                }
            });
            window.print();
        }

        function printBulkReports() {
            let anyChecked = false;
            globalStudents.forEach(s => {
                const el = document.getElementById(`report-card-id-${s.id}`);
                if(el) {
                    if(s.checkedForPrint) {
                        el.classList.remove('hidden-print');
                        anyChecked = true;
                    } else {
                        el.classList.add('hidden-print');
                    }
                }
            });

            if(!anyChecked) {
                alert("Tafadhali chagua angalau mwanafunzi mmoja kwenye orodha kutoa Bulk Print!");
                return;
            }
            window.print();
        }

        window.onload = init;
    </script>
