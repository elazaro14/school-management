<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TT-PRO ULTIMATE - Management System</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #3498db;
            --bg-color: #f8f9fa;
            --text-color: #333;
            --border-color: #ddd;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        h1, h2 {
            color: var(--primary-color);
            margin-bottom: 20px;
        }

        .tabs {
            display: flex;
            border-bottom: 2px solid var(--border-color);
            margin-bottom: 20px;
        }

        .tab-btn {
            padding: 10px 20px;
            border: none;
            background: none;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            color: #666;
            transition: 0.3s;
        }

        .tab-btn.active {
            color: var(--secondary-color);
            border-bottom: 3px solid var(--secondary-color);
            margin-bottom: -2px;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* Controls Layout */
        .table-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 15px;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        select, input {
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            outline: none;
            font-size: 14px;
        }

        input:focus, select:focus {
            border-color: var(--secondary-color);
        }

        /* Table Styling */
        .table-responsive {
            overflow-x: auto;
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 12px 15px;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            background-color: var(--primary-color);
            color: white;
            font-weight: 600;
        }

        tr:hover {
            background-color: #f1f1f1;
        }

        /* Pagination Styling */
        .pagination-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 15px;
        }

        .pagination-buttons {
            display: flex;
            gap: 5px;
        }

        .pagination-buttons button {
            padding: 6px 12px;
            border: 1px solid var(--border-color);
            background: white;
            cursor: pointer;
            border-radius: 4px;
            transition: 0.2s;
        }

        .pagination-buttons button:hover:not(:disabled) {
            background-color: var(--secondary-color);
            color: white;
            border-color: var(--secondary-color);
        }

        .pagination-buttons button:disabled {
            background-color: #e9ecef;
            color: #999;
            cursor: not-allowed;
        }

        .info-text {
            font-size: 14px;
            color: #666;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>TT-PRO ULTIMATE Panel</h1>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('students-tab')">View Students</button>
        <button class="tab-btn" onclick="switchTab('reports-tab')">Reports</button>
    </div>

    <div id="students-tab" class="tab-content active">
        <h2>Student Directory</h2>
        <div class="table-controls">
            <div class="control-group">
                <label for="studentEntries">Show </label>
                <select id="studentEntries" onchange="changeEntriesPerPage('student', this.value)">
                    <option value="25" selected>25</option>
                    <option value="50">50</option>
                    <option value="100">100</option>
                    <option value="ALL">All</option>
                </select>
                <span>entries</span>
            </div>
            <div class="control-group">
                <input type="text" id="studentSearch" placeholder="Search students..." oninput="handleSearch('student')">
            </div>
        </div>

        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Student ID</th>
                        <th>Full Name</th>
                        <th>Class/Form</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="studentTableBody">
                    </tbody>
            </table>
        </div>

        <div class="pagination-container">
            <div class="info-text" id="studentPaginationInfo">Showing 0 to 0 of 0 entries</div>
            <div class="pagination-buttons" id="studentPaginationControls"></div>
        </div>
    </div>

    <div id="reports-tab" class="tab-content">
        <h2>Terminal Exam Reports</h2>
        <div class="table-controls">
            <div class="control-group">
                <label for="reportEntries">Show </label>
                <select id="reportEntries" onchange="changeEntriesPerPage('report', this.value)">
                    <option value="25" selected>25</option>
                    <option value="50">50</option>
                    <option value="100">100</option>
                    <option value="ALL">All</option>
                </select>
                <span>entries</span>
            </div>
            <div class="control-group">
                <input type="text" id="reportSearch" placeholder="Search reports..." oninput="handleSearch('report')">
            </div>
        </div>

        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Student ID</th>
                        <th>Full Name</th>
                        <th>Term Score Average</th>
                        <th>Grade</th>
                        <th>Remarks</th>
                    </tr>
                </thead>
                <tbody id="reportTableBody">
                    </tbody>
            </table>
        </div>

        <div class="pagination-container">
            <div class="info-text" id="reportPaginationInfo">Showing 0 to 0 of 0 entries</div>
            <div class="pagination-buttons" id="reportPaginationControls"></div>
        </div>
    </div>
</div>

<script>
    // --- Mock Data Generator for Demonstration (120 Records) ---
    const names = ["John Doe", "Jane Smith", "Mila Kunis", "Juma Hamisi", "Anna Mary", "David Evans", "Robert Green", "Lucy Aoki", "Michael Chang", "Fatma Ally"];
    const classes = ["Form 1", "Form 2", "Form 3", "Form 4"];
    
    function generateMockData(count) {
        let data = [];
        for (let i = 1; i <= count; i++) {
            let name = names[Math.floor(Math.random() * names.length)] + " " + String.fromCharCode(65 + (i % 26));
            let average = Math.floor(Math.random() * 60) + 41; // 41 to 100
            let grade = average >= 80 ? 'A' : average >= 65 ? 'B' : average >= 50 ? 'C' : 'D';
            data.push({
                id: `STU${1000 + i}`,
                name: name,
                class: classes[Math.floor(Math.random() * classes.length)],
                status: i % 15 === 0 ? "Inactive" : "Active",
                average: average,
                grade: grade,
                remarks: grade === 'A' ? 'Excellent' : grade === 'B' ? 'Very Good' : grade === 'C' ? 'Satisfactory' : 'Needs Effort'
            });
        }
        return data;
    }

    const globalMasterData = generateMockData(125); // Dataset pool

    // --- State Configurations ---
    const tableState = {
        student: {
            currentPage: 1,
            rowsPerPage: 25,
            searchQuery: "",
            data: [...globalMasterData]
        },
        report: {
            currentPage: 1,
            rowsPerPage: 25,
            searchQuery: "",
            data: [...globalMasterData]
        }
    };

    // --- Tab Switcher Logic ---
    function switchTab(tabId) {
        document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        
        document.getElementById(tabId).classList.add('active');
        event.currentTarget.classList.add('active');
    }

    // --- Core Pagination & Dropdown Changes ---
    function changeEntriesPerPage(type, value) {
        tableState[type].rowsPerPage = (value === "ALL") ? "ALL" : parseInt(value, 10);
        tableState[type].currentPage = 1; // Reset to page 1 always
        renderTable(type);
    }

    function handleSearch(type) {
        const searchInput = document.getElementById(`${type}Search`).value.toLowerCase();
        tableState[type].searchQuery = searchInput;
        tableState[type].currentPage = 1; // Reset to page 1 on filter query
        renderTable(type);
    }

    function goToPage(type, targetPage) {
        tableState[type].currentPage = targetPage;
        renderTable(type);
    }

    // --- Master Render Engine ---
    function renderTable(type) {
        const state = tableState[type];
        const tbody = document.getElementById(`${type}TableBody`);
        
        // 1. Filter Data based on search string
        const filteredData = globalMasterData.filter(item => {
            return item.id.toLowerCase().includes(state.searchQuery) || 
                   item.name.toLowerCase().includes(state.searchQuery) ||
                   (item.class && item.class.toLowerCase().includes(state.searchQuery));
        });

        const totalEntries = filteredData.length;
        
        // 2. Setup structural bounds based on 'ALL' vs numerical values
        const currentRowsPerPage = (state.rowsPerPage === "ALL") ? totalEntries : state.rowsPerPage;
        const totalPages = Math.ceil(totalEntries / currentRowsPerPage) || 1;
        
        // Safety validation fallback for active empty page margins
        if (state.currentPage > totalPages) state.currentPage = totalPages;

        const startIndex = (state.currentPage - 1) * currentRowsPerPage;
        const endIndex = (state.rowsPerPage === "ALL") ? totalEntries : Math.min(startIndex + currentRowsPerPage, totalEntries);
        
        // Slice targets out of master list arrays
        const pageDataArray = filteredData.slice(startIndex, endIndex);

        // 3. Render raw dataset records straight into table elements
        tbody.innerHTML = "";
        if (pageDataArray.length === 0) {
            tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; color: #999;">No records match your criteria</td></tr>`;
            updateControlsInterface(type, 0, 0, 0, 1);
            return;
        }

        pageDataArray.forEach((rowItem, idx) => {
            let markup = "";
            const rowNumber = startIndex + idx + 1;
            
            if (type === 'student') {
                markup = `<tr>
                    <td>${rowNumber}</td>
                    <td><strong>${rowItem.id}</strong></td>
                    <td>${rowItem.name}</td>
                    <td>${rowItem.class}</td>
                    <td><span style="color: ${rowItem.status === 'Active' ? 'green' : 'red'}; font-weight:600;">${rowItem.status}</span></td>
                </tr>`;
            } else if (type === 'report') {
                markup = `<tr>
                    <td>${rowNumber}</td>
                    <td><strong>${rowItem.id}</strong></td>
                    <td>${rowItem.name}</td>
                    <td>${rowItem.average}%</td>
                    <td><span style="padding:2px 8px; background:#f0f4f8; border-radius:4px; font-weight:bold;">${rowItem.grade}</span></td>
                    <td>${rowItem.remarks}</td>
                </tr>`;
            }
            tbody.insertAdjacentHTML('beforeend', markup);
        });

        // 4. Update operational details and DOM elements at the baseline footer
        updateControlsInterface(type, startIndex, endIndex, totalEntries, totalPages);
    }

    // --- Controls Interface Render Engine ---
    function updateControlsInterface(type, startIndex, endIndex, totalEntries, totalPages) {
        const state = tableState[type];
        const infoEl = document.getElementById(`${type}PaginationInfo`);
        const controlsEl = document.getElementById(`${type}PaginationControls`);

        // Text tracking indicator display
        if (totalEntries === 0) {
            infoEl.textContent = "Showing 0 to 0 of 0 entries";
        } else {
            infoEl.textContent = `Showing ${startIndex + 1} to ${endIndex} of ${totalEntries} entries`;
        }

        // Render tactical navigation layouts
        controlsEl.innerHTML = `
            <button onclick="goToPage('${type}', 1)" ${state.currentPage === 1 ? 'disabled' : ''}>First</button>
            <button onclick="goToPage('${type}', ${state.currentPage - 1})" ${state.currentPage === 1 ? 'disabled' : ''}>Prev</button>
            <button disabled style="background: #f4f6f9; font-weight:bold; color:var(--primary-color)">${state.currentPage} / ${totalPages}</button>
            <button onclick="goToPage('${type}', ${state.currentPage + 1})" ${state.currentPage === totalPages ? 'disabled' : ''}>Next</button>
            <button onclick="goToPage('${type}', ${totalPages})" ${state.currentPage === totalPages ? 'disabled' : ''}>Last</button>
        `;
    }

    // --- Initial System Mount Sequence Execution ---
    window.onload = function() {
        renderTable('student');
        renderTable('report');
    };
</script>
</body>
</html>
