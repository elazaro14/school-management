<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShuleSys Portal & TT-PRO Ultimate Engine</title>
    <!-- Stable Tailwind CSS Stylesheet -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Production-ready React and ReactDOM Core Engines -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <style>
        @media print {
            .no-print { display: none !important; }
            .print-page-break { page-break-before: always !important; break-before: page !important; margin-top: 0 !important; padding-top: 10px !important; }
            body { background-color: #ffffff !important; padding: 0 !important; }
            #output { max-width: 100% !important; width: 100% !important; }
        }
        .mosque-strips {
            background: repeating-linear-gradient(45deg, #fef08a, #fef08a 10px, #fefcbf 10px, #fefcbf 20px);
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800">

    <div id="root">
        <div id="fallback-loader" class="flex flex-col items-center justify-center min-h-screen p-6 text-center">
            <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-blue-600 mb-4"></div>
            <p class="text-sm font-semibold text-slate-600">Initializing ShuleSys Portal Engines...</p>
        </div>
    </div>

    <!-- Diagnostic Script Catch-Block -->
    <script type="text/javascript">
        window.addEventListener('error', function(e) {
            var rootEl = document.getElementById('root');
            if (rootEl) {
                rootEl.innerHTML = `
                    <div class="p-6 max-w-xl mx-auto my-12 bg-white border border-red-200 rounded-lg shadow-sm">
                        <h2 class="text-red-600 font-bold text-base mb-2">System Execution Exception Caught</h2>
                        <p class="text-xs text-slate-600 font-mono bg-slate-50 p-3 rounded border mb-4">${e.message}</p>
                    </div>
                `;
            }
        });
    </script>

    <!-- React Application Logic Engine Script Container -->
    <script type="text/javascript">
        const e = React.createElement;
        const useState = React.useState;
        const useEffect = React.useEffect;

        function Navbar(props) {
            return e('nav', { className: 'flex justify-between items-center bg-[#2c3e50] text-white px-6 py-3 shadow-md no-print' },
                e('h2', { className: 'text-sm sm:text-base font-bold' }, '🏫 ShuleSys Portal System (TT-PRO Engine)'),
                e('div', { className: 'flex gap-4 items-center text-xs' },
                    ['admin', 'teacher', 'student', 'parent'].map(v => 
                        e('button', {
                            key: v,
                            onClick: () => props.setView(v),
                            className: `hover:text-white transition capitalize cursor-pointer ${props.currentView === v || (v === 'manage-teachers' && v === 'admin') ? 'text-white font-black underline underline-offset-4' : 'text-slate-300'}`
                        }, v === 'teacher' ? `Teacher Workspace (${props.activeTeacher.initials})` : v)
                    )
                )
            );
        }

        function DashboardCard(props) {
            return e('div', {
                onClick: props.onClick,
                className: 'bg-white border border-slate-200 rounded-lg p-5 shadow-sm cursor-pointer transition transform hover:-translate-y-0.5 hover:shadow-md hover:border-blue-300'
            },
                e('div', { className: 'text-2xl mb-2' }, props.icon),
                e('h3', { className: 'text-sm font-bold text-slate-800 mb-1' }, props.title),
                e('p', { className: 'text-xs text-slate-500 leading-relaxed' }, props.description)
            );
        }

        function AdminDashboard(props) {
            return e('div', { className: 'p-6 max-w-7xl mx-auto' },
                e('h2', { className: 'text-lg font-bold text-slate-800 mb-5' }, 'Control Panel Overview'),
                e('div', { className: 'grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-5' },
                    e(DashboardCard, { icon: '👨‍🏫', title: 'Manage Teachers', description: 'Add teachers and assign multiple forms/streams.', onClick: () => props.setView('manage-teachers') }),
                    e(DashboardCard, { icon: '🧑‍🎓', title: 'Manage Students', description: 'Enroll students and track global terminal records.', onClick: () => {} }),
                    e(DashboardCard, { icon: '📅', title: 'TT-PRO Timetable', description: 'Configure schedules and manage double period rules.', onClick: () => props.setView('timetable') }),
                    e(DashboardCard, { icon: '📊', title: 'System Settings', description: 'Configure system weights and constraints parameters.', onClick: () => {} })
                )
            );
        }

        function TeacherManagement(props) {
            const [name, setName] = useState('');
            const [initials, setInitials] = useState('');
            const [phone, setPhone] = useState('');
            const [specialization, setSpecialization] = useState('');
            
            // Track multi-selected classes and streams as arrays
            const [selectedClasses, setSelectedClasses] = useState(['F1']);
            const [selectedStreams, setSelectedStreams] = useState(['A']);

            const toggleClass = (cls) => {
                if (selectedClasses.includes(cls)) {
                    setSelectedClasses(selectedClasses.filter(c => c !== cls));
                } else {
                    setSelectedClasses([...selectedClasses, cls]);
                }
            };

            const toggleStream = (strm) => {
                if (selectedStreams.includes(strm)) {
                    setSelectedStreams(selectedStreams.filter(s => s !== strm));
                } else {
                    setSelectedStreams([...selectedStreams, strm]);
                }
            };

            const handleAddTeacher = (event) => {
                event.preventDefault();
                if (!name.trim() || !initials.trim()) return;
                if (selectedClasses.length === 0 || selectedStreams.length === 0) {
                    alert("Please select at least one Class and one Stream for this teacher.");
                    return;
                }

                const newTeacher = {
                    id: Date.now(),
                    name: name.toUpperCase(),
                    initials: initials.toUpperCase().slice(0, 4),
                    phone: phone || '-',
                    specialization: specialization.toUpperCase() || 'GENERAL',
                    targetClasses: selectedClasses, // Array of classes
                    targetStreams: selectedStreams  // Array of streams
                };

                props.setTeachers([...props.teachers, newTeacher]);
                setName(''); setInitials(''); setPhone(''); setSpecialization('');
                setSelectedClasses(['F1']); setSelectedStreams(['A']);
            };

            return e('div', { className: 'p-6 max-w-6xl mx-auto' },
                e('div', { className: 'flex justify-between items-center mb-6' },
                    e('h2', { className: 'text-lg font-bold text-slate-800' }, '👨‍🏫 Teacher Registry & Multi-Stream Allocation'),
                    e('button', { onClick: () => props.setView('admin'), className: 'bg-slate-600 hover:bg-slate-700 text-white font-bold text-xs px-3 py-1.5 rounded cursor-pointer' }, '← Back to Panel')
                ),
                e('div', { className: 'grid grid-cols-1 md:grid-cols-3 gap-6' },
                    e('div', { className: 'bg-white p-5 border border-slate-200 rounded-lg shadow-sm h-fit' },
                        e('h3', { className: 'text-xs font-bold text-slate-700 uppercase tracking-wider mb-4 border-b pb-2' }, 'Register New Teacher'),
                        e('form', { onSubmit: handleAddTeacher, className: 'flex flex-col gap-3' },
                            e('div', null,
                                e('label', { className: 'block text-[10px] font-bold text-slate-500 uppercase mb-1' }, 'Full Name'),
                                e('input', { type: 'text', value: name, onChange: (ev) => setName(ev.target.value), placeholder: 'E.G. MR. JOHN MEMA', className: 'w-full text-xs p-2 border border-slate-200 rounded outline-none focus:border-blue-500', required: true })
                            ),
                            e('div', null,
                                e('label', { className: 'block text-[10px] font-bold text-slate-500 uppercase mb-1' }, 'Staff Initials'),
                                e('input', { type: 'text', value: initials, onChange: (ev) => setInitials(ev.target.value), maxLength: 4, placeholder: 'E.G. JM', className: 'w-full text-xs p-2 border border-slate-200 rounded outline-none focus:border-blue-500', required: true })
                            ),
                            
                            // Multi-Class Checkbox Section
                            e('div', null,
                                e('label', { className: 'block text-[10px] font-bold text-slate-500 uppercase mb-1' }, 'Assigned Classes (Select All That Apply)'),
                                e('div', { className: 'grid grid-cols-4 gap-2 mt-1' },
                                    ['F1', 'F2', 'F3', 'F4'].map(f => e('button', {
                                        type: 'button',
                                        key: f,
                                        onClick: () => toggleClass(f),
                                        className: `p-2 text-xs font-bold rounded border text-center transition cursor-pointer ${selectedClasses.includes(f) ? 'bg-blue-600 border-blue-600 text-white' : 'bg-slate-50 text-slate-700 border-slate-200 hover:bg-slate-100'}`
                                    }, f))
                                )
                            ),

                            // Multi-Stream Checkbox Section
                            e('div', null,
                                e('label', { className: 'block text-[10px] font-bold text-slate-500 uppercase mb-1' }, 'Assigned Streams (Select All That Apply)'),
                                e('div', { className: 'grid grid-cols-3 gap-2 mt-1' },
                                    ['A', 'B', 'C'].map(s => e('button', {
                                        type: 'button',
                                        key: s,
                                        onClick: () => toggleStream(s),
                                        className: `p-2 text-xs font-bold rounded border text-center transition cursor-pointer ${selectedStreams.includes(s) ? 'bg-emerald-600 border-emerald-600 text-white' : 'bg-slate-50 text-slate-700 border-slate-200 hover:bg-slate-100'}`
                                    }, `Stream ${s}`))
                                )
                            ),

                            e('div', null,
                                e('label', { className: 'block text-[10px] font-bold text-slate-500 uppercase mb-1' }, 'Core Subject Focus'),
                                e('input', { type: 'text', value: specialization, onChange: (ev) => setSpecialization(ev.target.value), placeholder: 'E.G. PHYSICS', className: 'w-full text-xs p-2 border border-slate-200 rounded outline-none focus:border-blue-500' })
                            ),
                            e('button', { type: 'submit', className: 'w-full bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs py-2 rounded mt-2 cursor-pointer' }, 'Save Staff Member')
                        )
                    ),
                    e('div', { className: 'bg-white p-5 border border-slate-200 rounded-lg shadow-sm md:col-span-2' },
                        e('h3', { className: 'text-xs font-bold text-slate-700 uppercase tracking-wider mb-4 border-b pb-2' }, `Active Staff Roster (${props.teachers.length})`),
                        e('div', { className: 'overflow-x-auto' },
                            e('table', { className: 'w-full text-left text-xs border-collapse' },
                                e('thead', null,
                                    e('tr', { className: 'bg-slate-50 text-slate-600 border-b border-slate-200' },
                                        e('th', { className: 'p-3 font-bold' }, 'Initials'),
                                        e('th', { className: 'p-3 font-bold' }, 'Full Name'),
                                        e('th', { className: 'p-3 font-bold' }, 'Assigned Forms'),
                                        e('th', { className: 'p-3 font-bold' }, 'Assigned Streams'),
                                        e('th', { className: 'p-3 font-bold text-center' }, 'Switch Profile')
                                    )
                                ),
                                e('tbody', null,
                                    props.teachers.map(t => 
                                        e('tr', { key: t.id, className: 'border-b border-slate-100 last:border-none hover:bg-slate-50/50' },
                                            e('td', { className: 'p-3' }, e('span', { className: 'bg-blue-50 text-blue-700 px-2 py-0.5 rounded font-black' }, t.initials)),
                                            e('td', { className: 'p-3 font-bold text-slate-800' }, t.name),
                                            e('td', { className: 'p-3' }, 
                                                e('div', { className: 'flex flex-wrap gap-1' },
                                                    t.targetClasses.map(c => e('span', { key: c, className: 'bg-blue-50 text-blue-700 font-bold px-1.5 py-0.5 rounded text-[10px]' }, c))
                                                )
                                            ),
                                            e('td', { className: 'p-3' }, 
                                                e('div', { className: 'flex flex-wrap gap-1' },
                                                    t.targetStreams.map(s => e('span', { key: s, className: 'bg-emerald-50 text-emerald-700 font-bold px-1.5 py-0.5 rounded text-[10px]' }, `Str ${s}`))
                                                )
                                            ),
                                            e('td', { className: 'p-3 text-center' }, 
                                                e('button', { onClick: () => { props.setActiveTeacher(t); alert(`Switched workspace to view as: ${t.name}`); }, className: 'text-blue-600 hover:underline font-bold cursor-pointer' }, 'Login as Teacher')
                                            )
                                        )
                                    )
                                )
                            )
                        )
                    )
                )
            );
        }

        function TeacherDashboard(props) {
            return e('div', { className: 'p-6 max-w-7xl mx-auto' },
                e('div', { className: 'bg-blue-50 border border-blue-200 p-4 rounded-lg mb-6 flex justify-between items-center' },
                    e('div', null,
                        e('p', { className: 'text-xs font-bold text-blue-800 uppercase' }, 'Logged-In Workspace'),
                        e('h2', { className: 'text-base font-black text-slate-900' }, props.activeTeacher.name),
                        e('div', { className: 'text-xs text-slate-600 mt-1 flex flex-wrap items-center gap-1' }, 
                            'Authorized Areas:',
                            props.activeTeacher.targetClasses.map(c => 
                                props.activeTeacher.targetStreams.map(s => 
                                    e('span', { key: `${c}-${s}`, className: 'bg-slate-200 px-1.5 py-0.5 rounded text-[10px] font-bold text-slate-700' }, `${c}-${s}`)
                                )
                            )
                        )
                    ),
                    e('button', { onClick: () => props.setView('manage-teachers'), className: 'bg-white border text-xs font-bold px-3 py-1.5 rounded text-slate-700 hover:bg-slate-50 cursor-pointer shadow-sm' }, 'Change Teacher')
                ),
                e('div', { className: 'grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-5' },
                    e(DashboardCard, { icon: '📋', title: 'Stream Attendance', description: `Mark attendance records across assigned streams.`, onClick: () => {} }),
                    e(DashboardCard, { icon: '📚', title: 'Lesson Blueprints', description: 'Submit structural schemas to administration.', onClick: () => {} }),
                    e(DashboardCard, { icon: '🖋️', title: 'Enter Grades (T1-T4)', description: `Directly input marks for all your allocated streams.`, onClick: () => props.setView('grading') }),
                    e(DashboardCard, { icon: '📊', title: 'Performance Diagnostics', description: 'Analyze term pass ratios.', onClick: () => {} })
                )
            );
        }

        function GradingSystem(props) {
            // Master sample database of students across multiple layout tiers
            const [students, setStudents] = useState([
                { id: 1, name: "ELAZARO JOHN", class: "F1", stream: "A", t1: 78, t2: 85, t3: 72, t4: 88 },
                { id: 2, name: "ALPHA MARY", class: "F1", stream: "B", t1: 62, t2: 65, t3: 58, t4: 70 },
                { id: 3, name: "BARAKA JUMA", class: "F2", stream: "A", t1: 89, t2: 91, t3: 84, t4: 95 },
                { id: 4, name: "KASSIM SAID", class: "F1", stream: "A", t1: 55, t2: 60, t3: 62, t4: 58 },
                { id: 5, name: "SOPHIA OMAR", class: "F2", stream: "B", t1: 74, t2: 80, t3: 79, t4: 83 }
            ]);

            // Track active filters within the teacher's authorized matrix
            const [filterClass, setFilterClass] = useState(props.activeTeacher.targetClasses[0] || 'F1');
            const [filterStream, setFilterStream] = useState(props.activeTeacher.targetStreams[0] || 'A');

            // Secure cross-matching logic: Filter list to match intersection array logic
            const filteredStudents = students.filter(s => 
                s.class === filterClass && 
                s.stream === filterStream &&
                props.activeTeacher.targetClasses.includes(s.class) &&
                props.activeTeacher.targetStreams.includes(s.stream)
            );

            const calculateAverage = (s) => ((s.t1 + s.t2 + s.t3 + s.t4) / 4).toFixed(1);
            const getGradeMetric = (avg) => {
                if (avg >= 80) return { letter: "A", color: "text-green-600 font-bold" };
                if (avg >= 70) return { letter: "B", color: "text-blue-600 font-bold" };
                if (avg >= 50) return { letter: "C", color: "text-amber-600 font-bold" };
                return { letter: "F", color: "text-red-600 font-bold" };
            };

            const updateScore = (id, field, value) => {
                setStudents(students.map(s => s.id === id ? Object.assign({}, s, { [field]: Math.min(100, Math.max(0, Number(value) || 0)) }) : s));
            };

            return e('div', { className: 'p-6 max-w-6xl mx-auto' },
                e('div', { className: 'flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6' },
                    e('div', null,
                        e('h3', { className: 'text-lg font-bold text-slate-800' }, `Continuous Assessments Worksheet (T1 - T4)`),
                        e('p', { className: 'text-xs text-slate-500 font-semibold' }, `Logged inside multi-access workbook for: ${props.activeTeacher.name}`)
                    ),
                    e('button', { onClick: () => props.setView('teacher'), className: 'bg-slate-600 text-white font-bold text-xs px-3 py-1.5 rounded cursor-pointer self-end sm:self-auto' }, '← Back to Desk')
                ),

                // Multi-Class Switching Workspace Toggles
                e('div', { className: 'bg-white border border-slate-200 p-4 rounded-lg shadow-sm mb-6 flex flex-col gap-3' },
                    e('p', { className: 'text-[10px] font-bold text-slate-400 uppercase tracking-wider' }, 'Select Active Stream Workspace to Edit:'),
                    e('div', { className: 'flex flex-wrap gap-4' },
                        e('div', null,
                            e('span', { className: 'text-xs font-semibold text-slate-600 block mb-1' }, 'Form:'),
                            e('div', { className: 'flex gap-1' },
                                props.activeTeacher.targetClasses.map(c => e('button', {
                                    key: c,
                                    onClick: () => setFilterClass(c),
                                    className: `px-3 py-1 text-xs font-bold rounded border cursor-pointer ${filterClass === c ? 'bg-blue-600 text-white border-blue-600' : 'bg-slate-50 text-slate-700 border-slate-200 hover:bg-slate-100'}`
                                }, c))
                            )
                        ),
                        e('div', null,
                            e('span', { className: 'text-xs font-semibold text-slate-600 block mb-1' }, 'Stream:'),
                            e('div', { className: 'flex gap-1' },
                                props.activeTeacher.targetStreams.map(s => e('button', {
                                    key: s,
                                    onClick: () => setFilterStream(s),
                                    className: `px-3 py-1 text-xs font-bold rounded border cursor-pointer ${filterStream === s ? 'bg-emerald-600 text-white border-emerald-600' : 'bg-slate-50 text-slate-700 border-slate-200 hover:bg-slate-100'}`
                                }, `Stream ${s}`))
                            )
                        )
                    )
                ),

                filteredStudents.length === 0 ? e('div', { className: 'bg-white border border-dashed text-center p-12 rounded-lg text-slate-400 text-sm font-medium' }, `No students matched inside your allocated container filter for ${filterClass}-${filterStream}.`) :
                e('div', { className: 'overflow-x-auto bg-white rounded-lg border border-slate-200 shadow-sm' },
                    e('table', { className: 'w-full border-collapse text-left text-xs sm:text-sm' },
                        e('thead', null,
                            e('tr', { className: 'bg-slate-50 text-slate-600 border-b border-slate-200' },
                                e('th', { className: 'p-4 font-bold' }, 'Student Full Name'),
                                e('th', { className: 'p-4 font-bold text-center' }, 'Stream Block'),
                                ['T1', 'T2', 'T3', 'T4'].map(t => e('th', { key: t, className: 'p-4 font-bold text-center w-24' }, t)),
                                e('th', { className: 'p-4 font-bold text-center w-28' }, 'Average'),
                                e('th', { className: 'p-4 font-bold text-center w-24' }, 'Grade Mapping')
                            )
                        ),
                        e('tbody', null,
                            filteredStudents.map(s => {
                                const avg = calculateAverage(s);
                                const metric = getGradeMetric(parseFloat(avg));
                                return e('tr', { key: s.id, className: 'border-b border-slate-100 last:border-none hover:bg-slate-50/50' },
                                    e('td', { className: 'p-4 font-bold text-slate-700' }, s.name),
                                    e('td', { className: 'p-4 text-center' }, e('span', { className: 'bg-slate-100 text-slate-600 text-[10px] font-bold px-2 py-0.5 rounded' }, `${s.class}-${s.stream}`)),
                                    ['t1', 't2', 't3', 't4'].map(f => 
                                        e('td', { key: f, className: 'p-4 text-center' },
                                            e('input', {
                                                type: 'number',
                                                value: s[f],
                                                min: 0, max: 100,
                                                onChange: (ev) => updateScore(s.id, f, ev.target.value),
                                                className: 'w-16 p-1 border border-slate-200 rounded text-center font-semibold focus:outline-none focus:border-blue-500'
                                            })
                                        )
                                    ),
                                    e('td', { className: 'p-4 text-center font-bold text-slate-800' }, `${avg}%`),
                                    e('td', { className: `p-4 text-center ${metric.color}` }, metric.letter)
                                );
                            })
                        )
                    )
                )
            );
        }

        function TimetableConfig(props) {
            return e('div', { className: 'p-6 text-center text-slate-500 text-xs font-semibold' },
                e('p', null, 'TT-PRO Master Schedule Engine is ready for background structural compilation processing.'),
                e('button', { onClick: () => props.setView('admin'), className: 'mt-4 bg-slate-700 text-white px-3 py-1.5 rounded cursor-pointer' }, 'Return to Control Panel')
            );
        }

        function StudentDashboard() { return e('div', { className: 'p-6' }, 'Student Desk View Component.'); }
        function ParentDashboard() { return e('div', { className: 'p-6' }, 'Parent Desk View Component.'); }

        function App() {
            const [view, setView] = useState('manage-teachers');
            const [teachers, setTeachers] = useState([
                { id: 1, name: "MWAALIMU KIPIMO", initials: "KP", phone: "0763112233", specialization: "GEOGRAPHY", targetClasses: ["F1", "F2"], targetStreams: ["A", "C"] },
                { id: 2, name: "MADAM REHEMA", initials: "RM", phone: "0754998877", specialization: "KISWAHILI", targetClasses: ["F1"], targetStreams: ["B"] }
            ]);
            const [activeTeacher, setActiveTeacher] = useState({ id: 1, name: "MWAALIMU KIPIMO", initials: "KP", targetClasses: ["F1", "F2"], targetStreams: ["A", "C"] });

            return e('div', { className: 'min-h-screen bg-slate-50 flex flex-col' },
                e(Navbar, { currentView: view, setView: setView, activeTeacher: activeTeacher }),
                e('main', { className: 'flex-1' },
                    view === 'admin' && e(AdminDashboard, { setView: setView }),
                    view === 'manage-teachers' && e(TeacherManagement, { teachers: teachers, setTeachers: setTeachers, setView: setView, setActiveTeacher: setActiveTeacher }),
                    view === 'teacher' && e(TeacherDashboard, { setView: setView, activeTeacher: activeTeacher }),
                    view === 'student' && e(StudentDashboard, null),
                    view === 'parent' && e(ParentDashboard, null),
                    view === 'grading' && e(GradingSystem, { activeTeacher: activeTeacher, setView: setView }),
                    view === 'timetable' && e(TimetableConfig, { setView: setView })
                )
            );
        }

        const rootElement = document.getElementById('root');
        const appRoot = ReactDOM.createRoot(rootElement);
        appRoot.render(e(App));
    </script>
</body>
</html>                        <h2 class="text-red-600 font-bold text-base mb-2">System Execution Exception Caught</h2>

                    </div>
                `;
            }
        });
    </script>

    <script type="text/javascript">
        const e = React.createElement;
        const useState = React.useState;
        const useEffect = React.useEffect;

        function Navbar(props) {
            return e('nav', { className: 'flex justify-between items-center bg-[#2c3e50] text-white px-6 py-3 shadow-md no-print' },
                e('h2', { className: 'text-sm sm:text-base font-bold' }, '🏫 ShuleSys Portal System (TT-PRO Engine)'),
                e('div', { className: 'flex gap-4 items-center text-xs' },
                    ['admin', 'teacher', 'student', 'parent'].map(v => 
                        e('button', {
                            key: v,
                            onClick: () => props.setView(v),
                            className: `hover:text-white transition capitalize cursor-pointer ${props.currentView === v || (v === 'manage-teachers' && v === 'admin') ? 'text-white font-black underline underline-offset-4' : 'text-slate-300'}`
                        }, v === 'teacher' ? `Teacher (${props.activeTeacher.initials})` : v)
                    )
                )
            );
        }

        function DashboardCard(props) {
            return e('div', {
                onClick: props.onClick,
                className: 'bg-white border border-slate-200 rounded-lg p-5 shadow-sm cursor-pointer transition transform hover:-translate-y-0.5 hover:shadow-md hover:border-blue-300'
            },
                e('div', { className: 'text-2xl mb-2' }, props.icon),
                e('h3', { className: 'text-sm font-bold text-slate-800 mb-1' }, props.title),
                e('p', { className: 'text-xs text-slate-500 leading-relaxed' }, props.description)
            );
        }

        function AdminDashboard(props) {
            return e('div', { className: 'p-6 max-w-7xl mx-auto' },
                e('h2', { className: 'text-lg font-bold text-slate-800 mb-5' }, 'Control Panel Overview'),
                e('div', { className: 'grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-5' },
                    e(DashboardCard, { icon: '👨‍🏫', title: 'Manage Teachers', description: 'Add, edit, and assign teachers to core blocks.', onClick: () => props.setView('manage-teachers') }),
                    e(DashboardCard, { icon: '🧑‍🎓', title: 'Manage Students', description: 'Enroll students and track global terminal records.', onClick: () => {} }),
                    e(DashboardCard, { icon: '📅', title: 'TT-PRO Timetable', description: 'Configure schedules and manage double period rules.', onClick: () => props.setView('timetable') }),
                    e(DashboardCard, { icon: '📊', title: 'System Settings', description: 'Configure system weights and constraints parameters.', onClick: () => {} })
                )
            );
        }

        function TeacherManagement(props) {
            const [name, setName] = useState('');
            const [initials, setInitials] = useState('');
            const [phone, setPhone] = useState('');
            const [specialization, setSpecialization] = useState('');
            const [assignedClass, setAssignedClass] = useState('F1');
            const [assignedStream, setAssignedStream] = useState('A');

            const handleAddTeacher = (event) => {
                event.preventDefault();
                if (!name.trim() || !initials.trim()) return;

                const newTeacher = {
                    id: Date.now(),
                    name: name.toUpperCase(),
                    initials: initials.toUpperCase().slice(0, 4),
                    phone: phone || '-',
                    specialization: specialization.toUpperCase() || 'GENERAL',
                    targetClass: assignedClass,
                    targetStream: assignedStream
                };

                props.setTeachers([...props.teachers, newTeacher]);
                setName(''); setInitials(''); setPhone(''); setSpecialization('');
            };

            return e('div', { className: 'p-6 max-w-6xl mx-auto' },
                e('div', { className: 'flex justify-between items-center mb-6' },
                    e('h2', { className: 'text-lg font-bold text-slate-800' }, '👨‍🏫 Teacher Registry & Stream Allocation'),
                    e('button', { onClick: () => props.setView('admin'), className: 'bg-slate-600 hover:bg-slate-700 text-white font-bold text-xs px-3 py-1.5 rounded cursor-pointer' }, '← Back to Panel')
                ),
                e('div', { className: 'grid grid-cols-1 md:grid-cols-3 gap-6' },
                    e('div', { className: 'bg-white p-5 border border-slate-200 rounded-lg shadow-sm h-fit' },
                        e('h3', { className: 'text-xs font-bold text-slate-700 uppercase tracking-wider mb-4 border-b pb-2' }, 'Register New Teacher'),
                        e('form', { onSubmit: handleAddTeacher, className: 'flex flex-col gap-3' },
                            e('div', null,
                                e('label', { className: 'block text-[10px] font-bold text-slate-500 uppercase mb-1' }, 'Full Name'),
                                e('input', { type: 'text', value: name, onChange: (ev) => setName(ev.target.value), placeholder: 'E.G. MR. JOHN MEMA', className: 'w-full text-xs p-2 border border-slate-200 rounded outline-none focus:border-blue-500', required: true })
                            ),
                            e('div', null,
                                e('label', { className: 'block text-[10px] font-bold text-slate-500 uppercase mb-1' }, 'Staff Initials'),
                                e('input', { type: 'text', value: initials, onChange: (ev) => setInitials(ev.target.value), maxLength: 4, placeholder: 'E.G. JM', className: 'w-full text-xs p-2 border border-slate-200 rounded outline-none focus:border-blue-500', required: true })
                            ),
                            e('div', { className: 'grid grid-cols-2 gap-2' },
                                e('div', null,
                                    e('label', { className: 'block text-[10px] font-bold text-slate-500 uppercase mb-1' }, 'Teaches Class'),
                                    e('select', { value: assignedClass, onChange: (ev) => setAssignedClass(ev.target.value), className: 'w-full text-xs p-2 border border-slate-200 rounded bg-white outline-none focus:border-blue-500' },
                                        ['F1', 'F2', 'F3', 'F4'].map(f => e('option', { key: f, value: f }, f))
                                    )
                                ),
                                e('div', null,
                                    e('label', { className: 'block text-[10px] font-bold text-slate-500 uppercase mb-1' }, 'Teaches Stream'),
                                    e('select', { value: assignedStream, onChange: (ev) => setAssignedStream(ev.target.value), className: 'w-full text-xs p-2 border border-slate-200 rounded bg-white outline-none focus:border-blue-500' },
                                        ['A', 'B', 'C'].map(s => e('option', { key: s, value: s }, `Stream ${s}`))
                                    )
                                )
                            ),
                            e('div', null,
                                e('label', { className: 'block text-[10px] font-bold text-slate-500 uppercase mb-1' }, 'Core Subject Focus'),
                                e('input', { type: 'text', value: specialization, onChange: (ev) => setSpecialization(ev.target.value), placeholder: 'E.G. PHYSICS', className: 'w-full text-xs p-2 border border-slate-200 rounded outline-none focus:border-blue-500' })
                            ),
                            e('button', { type: 'submit', className: 'w-full bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs py-2 rounded mt-2 cursor-pointer' }, 'Save Staff Member')
                        )
                    ),
                    e('div', { className: 'bg-white p-5 border border-slate-200 rounded-lg shadow-sm md:col-span-2' },
                        e('h3', { className: 'text-xs font-bold text-slate-700 uppercase tracking-wider mb-4 border-b pb-2' }, `Active Staff Roster (${props.teachers.length})`),
                        e('div', { className: 'overflow-x-auto' },
                            e('table', { className: 'w-full text-left text-xs border-collapse' },
                                e('thead', null,
                                    e('tr', { className: 'bg-slate-50 text-slate-600 border-b border-slate-200' },
                                        e('th', { className: 'p-3 font-bold' }, 'Initials'),
                                        e('th', { className: 'p-3 font-bold' }, 'Full Name'),
                                        e('th', { className: 'p-3 font-bold' }, 'Assigned Stream Location'),
                                        e('th', { className: 'p-3 font-bold' }, 'Specialties'),
                                        e('th', { className: 'p-3 font-bold text-center' }, 'Switch Profile')
                                    )
                                ),
                                e('tbody', null,
                                    props.teachers.map(t => 
                                        e('tr', { key: t.id, className: 'border-b border-slate-100 last:border-none' },
                                            e('td', { className: 'p-3' }, e('span', { className: 'bg-blue-50 text-blue-700 px-2 py-0.5 rounded font-black' }, t.initials)),
                                            e('td', { className: 'p-3 font-bold text-slate-800' }, t.name),
                                            e('td', { className: 'p-3' }, e('span', { className: 'bg-emerald-50 text-emerald-700 font-bold px-2 py-0.5 rounded' }, `${t.targetClass} - Stream ${t.targetStream}`)),
                                            e('td', { className: 'p-3 text-slate-600' }, t.specialization),
                                            e('td', { className: 'p-3 text-center' }, 
                                                e('button', { onClick: () => { props.setActiveTeacher(t); alert(`Switched Workspace to view as: ${t.name}`); }, className: 'text-blue-600 hover:underline font-bold cursor-pointer' }, 'Login as Teacher')
                                            )
                                        )
                                    )
                                )
                            )
                        )
                    )
                )
            );
        }

        function TeacherDashboard(props) {
            return e('div', { className: 'p-6 max-w-7xl mx-auto' },
                e('div', { className: 'bg-blue-50 border border-blue-200 p-4 rounded-lg mb-6 flex justify-between items-center' },
                    e('div', null,
                        e('p', { className: 'text-xs font-bold text-blue-800 uppercase' }, 'Logged-In Workspace'),
                        e('h2', { className: 'text-base font-black text-slate-900' }, props.activeTeacher.name),
                        e('p', { className: 'text-xs text-slate-600' }, `Exclusively restricted to managing: ${props.activeTeacher.targetClass} (Stream ${props.activeTeacher.targetStream})`)
                    ),
                    e('button', { onClick: () => props.setView('manage-teachers'), className: 'bg-white border text-xs font-bold px-3 py-1.5 rounded text-slate-700 hover:bg-slate-50 cursor-pointer shadow-sm' }, 'Change Teacher Account')
                ),
                e('div', { className: 'grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-5' },
                    e(DashboardCard, { icon: '📋', title: 'Stream Attendance', description: `Mark daily metrics for Form ${props.activeTeacher.targetClass}.`, onClick: () => {} }),
                    e(DashboardCard, { icon: '📚', title: 'Lesson Blueprints', description: 'Submit structural schemas to management.', onClick: () => {} }),
                    e(DashboardCard, { icon: '🖋️', title: 'Enter Grades (T1-T4)', description: `Directly input marks for Stream ${props.activeTeacher.targetStream} students.`, onClick: () => props.setView('grading') }),
                    e(DashboardCard, { icon: '📊', title: 'Performance Diagnostics', description: 'Analyze term pass ratios.', onClick: () => {} })
                )
            );
        }

        function GradingSystem(props) {
            // Master student list with descriptive class tracking parameters
            const [students, setStudents] = useState([
                { id: 1, name: "ELAZARO JOHN", class: "F1", stream: "A", t1: 78, t2: 85, t3: 72, t4: 88 },
                { id: 2, name: "ALPHA MARY", class: "F1", stream: "B", t1: 62, t2: 65, t3: 58, t4: 70 },
                { id: 3, name: "BARAKA JUMA", class: "F2", stream: "A", t1: 89, t2: 91, t3: 84, t4: 95 },
                { id: 4, name: "KASSIM SAID", class: "F1", stream: "A", t1: 55, t2: 60, t3: 62, t4: 58 }
            ]);

            // Filter students matching the active teacher's specific Class and Stream allocations
            const filteredStudents = students.filter(s => s.class === props.activeTeacher.targetClass && s.stream === props.activeTeacher.targetStream);

            const calculateAverage = (s) => ((s.t1 + s.t2 + s.t3 + s.t4) / 4).toFixed(1);
            const getGradeMetric = (avg) => {
                if (avg >= 80) return { letter: "A", color: "text-green-600 font-bold" };
                if (avg >= 70) return { letter: "B", color: "text-blue-600 font-bold" };
                if (avg >= 50) return { letter: "C", color: "text-amber-600 font-bold" };
                return { letter: "F", color: "text-red-600 font-bold" };
            };

            const updateScore = (id, field, value) => {
                setStudents(students.map(s => s.id === id ? Object.assign({}, s, { [field]: Math.min(100, Math.max(0, Number(value) || 0)) }) : s));
            };

            return e('div', { className: 'p-6 max-w-6xl mx-auto' },
                e('div', { className: 'flex justify-between items-center mb-6' },
                    e('div', null,
                        e('h3', { className: 'text-lg font-bold text-slate-800' }, `Continuous Assessments Module (T1 - T4)`),
                        e('p', { className: 'text-xs text-slate-500 font-semibold' }, `Showing filtered records for: Form ${props.activeTeacher.targetClass} — Stream ${props.activeTeacher.targetStream}`)
                    ),
                    e('button', { onClick: () => props.setView('teacher'), className: 'bg-slate-600 text-white font-bold text-xs px-3 py-1.5 rounded cursor-pointer' }, '← Back to Desk')
                ),
                filteredStudents.length === 0 ? e('div', { className: 'bg-white border border-dashed text-center p-12 rounded-lg text-slate-400 text-sm font-medium' }, `No students are registered inside Form ${props.activeTeacher.targetClass} Stream ${props.activeTeacher.targetStream} yet. Go to Admin Panel to register students into this cluster block.`) :
                e('div', { className: 'overflow-x-auto bg-white rounded-lg border border-slate-200 shadow-sm' },
                    e('table', { className: 'w-full border-collapse text-left text-xs sm:text-sm' },
                        e('thead', null,
                            e('tr', { className: 'bg-slate-50 text-slate-600 border-b border-slate-200' },
                                e('th', { className: 'p-4 font-bold' }, 'Student Full Name'),
                                e('th', { className: 'p-4 font-bold text-center' }, 'Assigned Stream Location'),
                                ['T1', 'T2', 'T3', 'T4'].map(t => e('th', { key: t, className: 'p-4 font-bold text-center w-24' }, t)),
                                e('th', { className: 'p-4 font-bold text-center w-28' }, 'Average'),
                                e('th', { className: 'p-4 font-bold text-center w-24' }, 'Grade Mapping')
                            )
                        ),
                        e('tbody', null,
                            filteredStudents.map(s => {
                                const avg = calculateAverage(s);
                                const metric = getGradeMetric(parseFloat(avg));
                                return e('tr', { key: s.id, className: 'border-b border-slate-100 last:border-none hover:bg-slate-50/50' },
                                    e('td', { className: 'p-4 font-bold text-slate-700' }, s.name),
                                    e('td', { className: 'p-4 text-center' }, e('span', { className: 'bg-slate-100 text-slate-600 text-[10px] font-bold px-2 py-0.5 rounded' }, `${s.class}-${s.stream}`)),
                                    ['t1', 't2', 't3', 't4'].map(f => 
                                        e('td', { key: f, className: 'p-4 text-center' },
                                            e('input', {
                                                type: 'number',
                                                value: s[f],
                                                min: 0, max: 100,
                                                onChange: (ev) => updateScore(s.id, f, ev.target.value),
                                                className: 'w-16 p-1 border border-slate-200 rounded text-center font-semibold focus:outline-none focus:border-blue-500'
                                            })
                                        )
                                    ),
                                    e('td', { className: 'p-4 text-center font-bold text-slate-800' }, `${avg}%`),
                                    e('td', { className: `p-4 text-center ${metric.color}` }, metric.letter)
                                );
                            })
                        )
                    )
                )
            );
        }

        // --- TT-PRO ADVANCED TIMETABLE COMPONENT ---
        function TimetableConfig(props) {
            return e('div', { className: 'p-6 text-center text-slate-500 text-xs font-semibold' },
                e('p', null, 'TT-PRO Master Schedule Engine is ready for background structural compilation processing.'),
                e('button', { onClick: () => props.setView('admin'), className: 'mt-4 bg-slate-700 text-white px-3 py-1.5 rounded cursor-pointer' }, 'Return to Control Panel')
            );
        }

        function StudentDashboard() { return e('div', { className: 'p-6' }, 'Student Desk View Component.'); }
        function ParentDashboard() { return e('div', { className: 'p-6' }, 'Parent Desk View Component.'); }

        function App() {
            const [view, setView] = useState('manage-teachers');
            const [teachers, setTeachers] = useState([
                { id: 1, name: "MWAALIMU KIPIMO", initials: "KP", phone: "0763112233", specialization: "GEOGRAPHY", targetClass: "F1", targetStream: "A" },
                { id: 2, name: "MADAM REHEMA", initials: "RM", phone: "0754998877", specialization: "KISWAHILI", targetClass: "F1", targetStream: "B" }
            ]);
            const [activeTeacher, setActiveTeacher] = useState({ id: 1, name: "MWAALIMU KIPIMO", initials: "KP", targetClass: "F1", targetStream: "A" });

            return e('div', { className: 'min-h-screen bg-slate-50 flex flex-col' },
                e(Navbar, { currentView: view, setView: setView, activeTeacher: activeTeacher }),
                e('main', { className: 'flex-1' },
                    view === 'admin' && e(AdminDashboard, { setView: setView }),
                    view === 'manage-teachers' && e(TeacherManagement, { teachers: teachers, setTeachers: setTeachers, setView: setView, setActiveTeacher: setActiveTeacher }),
                    view === 'teacher' && e(TeacherDashboard, { setView: setView, activeTeacher: activeTeacher }),
                    view === 'student' && e(StudentDashboard, null),
                    view === 'parent' && e(ParentDashboard, null),
                    view === 'grading' && e(GradingSystem, { activeTeacher: activeTeacher, setView: setView }),
                    view === 'timetable' && e(TimetableConfig, { setView: setView })
                )
            );
        }

        const rootElement = document.getElementById('root');
        const appRoot = ReactDOM.createRoot(rootElement);
        appRoot.render(e(App));
    </script>
</body>
</html>
