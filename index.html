<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShuleSys Portal & TT-PRO Ultimate Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <style>
        @media print {
            .no-print { display: none !important; }
            .print-page-break { page-break-before: always !important; break-before: page !important; margin-top: 0 !important; padding-top: 10px !important; }
            body { background-color: #ffffff !important; padding: 0 !important; }
            #output { max-width: 100% !important; width: 100% !important; }
        }
        .mosque-strips {
            background: repeating-linear-gradient(45deg, #fef08a, #fef08a 10px, #fefcbf 10px, #fefcbf 20px);
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800">

    <div id="root">
        <div id="fallback-loader" class="flex flex-col items-center justify-center min-h-screen p-6 text-center">
            <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-blue-600 mb-4"></div>
            <p class="text-sm font-semibold text-slate-600">Initializing ShuleSys Portal Engines...</p>
        </div>
    </div>

    <script type="text/javascript">
        window.addEventListener('error', function(e) {
            var rootEl = document.getElementById('root');
            if (rootEl) {
                rootEl.innerHTML = `
                    <div class="p-6 max-w-xl mx-auto my-12 bg-white border border-red-200 rounded-lg shadow-sm">
                        <h2 class="text-red-600 font-bold text-base mb-2">System Execution Exception Caught</h2>
                        <p class="text-xs text-slate-600 font-mono bg-slate-50 p-3 rounded border mb-4">${e.message}</p>
                    </div>
                `;
            }
        });
    </script>

    <script type="text/javascript">
        const e = React.createElement;
        const useState = React.useState;
        const useEffect = React.useEffect;

        const AVAILABLE_STREAMS = ['A', 'B', 'C', 'D', 'E', 'F'];
        const AVAILABLE_CLASSES = ['F1', 'F2', 'F3', 'F4'];
        const MONTHS = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];

        function Navbar(props) {
            return e('nav', { className: 'flex justify-between items-center bg-[#2c3e50] text-white px-6 py-3 shadow-md no-print' },
                e('h2', { className: 'text-sm sm:text-base font-bold' }, `🏫 ${props.settings.schoolName || 'ShuleSys Portal'}`),
                e('div', { className: 'flex gap-4 items-center text-xs' },
                    ['admin', 'teacher', 'student', 'parent'].map(v => 
                        e('button', {
                            key: v,
                            onClick: () => props.setView(v),
                            className: `hover:text-white transition capitalize cursor-pointer ${props.currentView === v || ['manage-teachers', 'manage-students', 'timetable', 'settings', 'grading', 'attendance', 'calendar', 'blueprints'].includes(props.currentView) && v === 'admin' ? 'text-white font-black underline underline-offset-4' : 'text-slate-300'}`
                        }, v === 'teacher' ? `Teacher Workspace (${props.activeTeacher.initials})` : v)
                    )
                )
            );
        }

        function DashboardCard(props) {
            return e('div', {
                onClick: props.onClick,
                className: 'bg-white border border-slate-200 rounded-lg p-5 shadow-sm cursor-pointer transition transform hover:-translate-y-0.5 hover:shadow-md hover:border-blue-300'
            },
                e('div', { className: 'text-2xl mb-2' }, props.icon),
                e('h3', { className: 'text-sm font-bold text-slate-800 mb-1' }, props.title),
                e('p', { className: 'text-xs text-slate-500 leading-relaxed' }, props.description)
            );
        }

        // Admin, Teacher Management, Student Management, Blueprints, Calendar, Attendance modules remain structurally sound
        function AdminDashboard(props) {
            return e('div', { className: 'p-6 max-w-7xl mx-auto' },
                e('h2', { className: 'text-lg font-bold text-slate-800 mb-5' }, 'Control Panel Overview'),
                e('div', { className: 'grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-5' },
                    e(DashboardCard, { icon: '👨‍🏫', title: 'Manage Teachers', description: 'Add teachers and assign multiple forms/streams (A-F).', onClick: () => props.setView('manage-teachers') }),
                    e(DashboardCard, { icon: '🧑‍🎓', title: 'Manage Students', description: 'Enroll students, assign streams, and track global terminal rosters.', onClick: () => props.setView('manage-students') }),
                    e(DashboardCard, { icon: '📅', title: 'TT-PRO Timetable', description: 'Configure schedules and manage double period rules.', onClick: () => props.setView('timetable') }),
                    e(DashboardCard, { icon: '🗓️', title: 'Academic Calendar', description: 'Schedule and map multi-month key institutional milestones.', onClick: () => props.setView('calendar') }),
                    e(DashboardCard, { icon: '📊', title: 'System Settings', description: 'Configure system names, active streams, and grading scales.', onClick: () => props.setView('settings') })
                )
            );
        }

        function TeacherManagement(props) {
            const [name, setName] = useState('');
            const [initials, setInitials] = useState('');
            const [phone, setPhone] = useState('');
            const [specialization, setSpecialization] = useState('');
            const [selectedClasses, setSelectedClasses] = useState(['F1']);
            const [selectedStreams, setSelectedStreams] = useState(['A']);

            const toggleClass = (cls) => {
                if (selectedClasses.includes(cls)) {
                    setSelectedClasses(selectedClasses.filter(c => c !== cls));
                } else {
                    setSelectedClasses([...selectedClasses, cls]);
                }
            };

            const toggleStream = (strm) => {
                if (selectedStreams.includes(strm)) {
                    setSelectedStreams(selectedStreams.filter(s => s !== strm));
                } else {
                    setSelectedStreams([...selectedStreams, strm]);
                }
            };

            const handleAddTeacher = (event) => {
                event.preventDefault();
                if (!name.trim() || !initials.trim()) return;
                if (selectedClasses.length === 0 || selectedStreams.length === 0) {
                    alert("Please select at least one Class and one Stream for this teacher.");
                    return;
                }

                const newTeacher = {
                    id: Date.now(),
                    name: name.toUpperCase(),
                    initials: initials.toUpperCase().slice(0, 4),
                    phone: phone || '-',
                    specialization: specialization.toUpperCase() || 'GENERAL',
                    targetClasses: selectedClasses,
                    targetStreams: selectedStreams
                };

                props.setTeachers([...props.teachers, newTeacher]);
                setName(''); setInitials(''); setPhone(''); setSpecialization('');
                setSelectedClasses(['F1']); setSelectedStreams(['A']);
            };

            return e('div', { className: 'p-6 max-w-6xl mx-auto' },
                e('div', { className: 'flex justify-between items-center mb-6' },
                    e('h2', { className: 'text-lg font-bold text-slate-800' }, '👨‍🏫 Teacher Registry & Multi-Stream Allocation'),
                    e('button', { onClick: () => props.setView('admin'), className: 'bg-slate-600 text-white font-bold text-xs px-3 py-1.5 rounded cursor-pointer' }, '← Back to Panel')
                ),
                e('div', { className: 'grid grid-cols-1 md:grid-cols-3 gap-6' },
                    e('div', { className: 'bg-white p-5 border border-slate-200 rounded-lg shadow-sm h-fit' },
                        e('h3', { className: 'text-xs font-bold text-slate-700 uppercase tracking-wider mb-4 border-b pb-2' }, 'Register New Teacher'),
                        e('form', { onSubmit: handleAddTeacher, className: 'flex flex-col gap-3' },
                            e('div', null,
                                e('label', { className: 'block text-[10px] font-bold text-slate-500 uppercase mb-1' }, 'Full Name'),
                                e('input', { type: 'text', value: name, onChange: (ev) => setName(ev.target.value), placeholder: 'E.G. MR. JOHN MEMA', className: 'w-full text-xs p-2 border border-slate-200 rounded outline-none focus:border-blue-500', required: true })
                            ),
                            e('div', null,
                                e('label', { className: 'block text-[10px] font-bold text-slate-500 uppercase mb-1' }, 'Staff Initials'),
                                e('input', { type: 'text', value: initials, onChange: (ev) => setInitials(ev.target.value), maxLength: 4, placeholder: 'E.G. JM', className: 'w-full text-xs p-2 border border-slate-200 rounded outline-none focus:border-blue-500', required: true })
                            ),
                            e('div', null,
                                e('label', { className: 'block text-[10px] font-bold text-slate-500 uppercase mb-1' }, 'Assigned Classes'),
                                e('div', { className: 'grid grid-cols-4 gap-2 mt-1' },
                                    AVAILABLE_CLASSES.map(f => e('button', {
                                        type: 'button',
                                        key: f,
                                        onClick: () => toggleClass(f),
                                        className: `p-2 text-xs font-bold rounded border text-center transition cursor-pointer ${selectedClasses.includes(f) ? 'bg-blue-600 border-blue-600 text-white' : 'bg-slate-50 text-slate-700 border-slate-200 hover:bg-slate-100'}`
                                    }, f))
                                )
                            ),
                            e('div', null,
                                e('label', { className: 'block text-[10px] font-bold text-slate-500 uppercase mb-1' }, 'Assigned Streams'),
                                e('div', { className: 'grid grid-cols-3 gap-2 mt-1' },
                                    AVAILABLE_STREAMS.map(s => e('button', {
                                        type: 'button',
                                        key: s,
                                        onClick: () => toggleStream(s),
                                        className: `p-2 text-xs font-bold rounded border text-center transition cursor-pointer ${selectedStreams.includes(s) ? 'bg-emerald-600 border-emerald-600 text-white' : 'bg-slate-50 text-slate-700 border-slate-200 hover:bg-slate-100'}`
                                    }, `Stream ${s}`))
                                )
                            ),
                            e('div', null,
                                e('label', { className: 'block text-[10px] font-bold text-slate-500 uppercase mb-1' }, 'Core Subject Focus'),
                                e('input', { type: 'text', value: specialization, onChange: (ev) => setSpecialization(ev.target.value), placeholder: 'E.G. PHYSICS', className: 'w-full text-xs p-2 border border-slate-200 rounded outline-none focus:border-blue-500' })
                            ),
                            e('button', { type: 'submit', className: 'w-full bg-blue-600 text-white font-bold text-xs py-2 rounded mt-2 cursor-pointer' }, 'Save Staff Member')
                        )
                    ),
                    e('div', { className: 'bg-white p-5 border border-slate-200 rounded-lg shadow-sm md:col-span-2' },
                        e('h3', { className: 'text-xs font-bold text-slate-700 uppercase tracking-wider mb-4 border-b pb-2' }, `Active Staff Roster (${props.teachers.length})`),
                        e('div', { className: 'overflow-x-auto' },
                            e('table', { className: 'w-full text-left text-xs border-collapse' },
                                e('thead', null,
                                    e('tr', { className: 'bg-slate-50 text-slate-600 border-b border-slate-200' },
                                        e('th', { className: 'p-3 font-bold' }, 'Initials'),
                                        e('th', { className: 'p-3 font-bold' }, 'Full Name'),
                                        e('th', { className: 'p-3 font-bold' }, 'Assigned Forms'),
                                        e('th', { className: 'p-3 font-bold' }, 'Assigned Streams'),
                                        e('th', { className: 'p-3 font-bold text-center' }, 'Switch Profile')
                                    )
                                ),
                                e('tbody', null,
                                    props.teachers.map(t => 
                                        e('tr', { key: t.id, className: 'border-b border-slate-100 last:border-none hover:bg-slate-50/50' },
                                            e('td', { className: 'p-3' }, e('span', { className: 'bg-blue-50 text-blue-700 px-2 py-0.5 rounded font-black' }, t.initials)),
                                            e('td', { className: 'p-3 font-bold text-slate-800' }, t.name),
                                            e('td', { className: 'p-3' }, 
                                                e('div', { className: 'flex flex-wrap gap-1' },
                                                    t.targetClasses.map(c => e('span', { key: c, className: 'bg-blue-50 text-blue-700 font-bold px-1.5 py-0.5 rounded text-[10px]' }, c))
                                                )
                                            ),
                                            e('td', { className: 'p-3' }, 
                                                e('div', { className: 'flex flex-wrap gap-1' },
                                                    t.targetStreams.map(s => e('span', { key: s, className: 'bg-emerald-50 text-emerald-700 font-bold px-1.5 py-0.5 rounded text-[10px]' }, `Str ${s}`))
                                                )
                                            ),
                                            e('td', { className: 'p-3 text-center' }, 
                                                e('button', { onClick: () => { props.setActiveTeacher(t); alert(`Switched workspace to view as: ${t.name}`); }, className: 'text-blue-600 hover:underline font-bold cursor-pointer' }, 'Login as Teacher')
                                            )
                                        )
                                    )
                                )
                            )
                        )
                    )
                )
            );
        }

        function StudentManagement(props) {
            const [fullName, setFullName] = useState('');
            const [selectedClass, setSelectedClass] = useState('F1');
            const [selectedStream, setSelectedStream] = useState('A');
            const [searchQuery, setSearchQuery] = useState('');
            const [filterClass, setFilterClass] = useState('ALL');
            const [filterStream, setFilterStream] = useState('ALL');

            const handleDownloadTemplate = () => {
                const headers = "Full Name,Class (F1-F4),Stream (A-F)\n";
                const sampleRows = ["JOHN LUKAS,F1,A", "REHEMA JUMA,F2,B", "AMANI ALLY,F3,C"].join("\n");
                const blob = new Blob([headers + sampleRows], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement("a");
                link.setAttribute("href", url);
                link.setAttribute("download", "shulesys_student_template.csv");
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

            const handleBulkUploadCSV = (event) => {
                const file = event.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = function(e) {
                    const text = e.target.result;
                    const lines = text.split(/\r?\n/);
                    if (lines.length <= 1) { alert("The file selected appears to be empty."); return; }
                    const loadedStudents = [];
                    let skippedCount = 0; let successCount = 0;
                    for (let i = 1; i < lines.length; i++) {
                        const line = lines[i].trim(); if (!line) continue;
                        const columns = line.split(','); if (columns.length < 3) { skippedCount++; continue; }
                        const nameParsed = columns[0].trim().toUpperCase();
                        const classParsed = columns[1].trim().toUpperCase();
                        const streamParsed = columns[2].trim().toUpperCase();
                        if (nameParsed && AVAILABLE_CLASSES.includes(classParsed) && AVAILABLE_STREAMS.includes(streamParsed)) {
                            loadedStudents.push({
                                id: Date.now() + i, name: nameParsed, class: classParsed, stream: streamParsed,
                                t1: "", midterm: "", t2: "", exam: "", totalDays: 0, presentDays: 0, permittedDays: 0
                            });
                            successCount++;
                        } else { skippedCount++; }
                    }
                    if (loadedStudents.length > 0) {
                        props.setStudents(prev => [...prev, ...loadedStudents]);
                        alert(`Bulk ingestion complete!\nSuccessfully enrolled: ${successCount} entries.\nSkipped/Invalid items: ${skippedCount}.`);
                    } else { alert("Error: No valid rows detected."); }
                    event.target.value = "";
                };
                reader.readAsText(file);
            };

            const handleEnrollStudent = (event) => {
                event.preventDefault();
                if (!fullName.trim()) return;
                props.setStudents([...props.students, {
                    id: Date.now(), name: fullName.toUpperCase(), class: selectedClass, stream: selectedStream,
                    t1: "", midterm: "", t2: "", exam: "", totalDays: 0, presentDays: 0, permittedDays: 0
                }]);
                setFullName('');
            };

            const filteredRoster = props.students.filter(s => {
                return s.name.toLowerCase().includes(searchQuery.toLowerCase()) &&
                       (filterClass === 'ALL' || s.class === filterClass) &&
                       (filterStream === 'ALL' || s.stream === filterStream);
            });

            return e('div', { className: 'p-6 max-w-6xl mx-auto' },
                e('div', { className: 'flex justify-between items-center mb-6' },
                    e('h2', { className: 'text-lg font-bold text-slate-800' }, '🧑‍🎓 Student Admission & Roster Manager'),
                    e('button', { onClick: () => props.setView('admin'), className: 'bg-slate-600 text-white font-bold text-xs px-3 py-1.5 rounded' }, '← Back to Panel')
                ),
                e('div', { className: 'grid grid-cols-1 md:grid-cols-3 gap-6' },
                    e('div', { className: 'flex flex-col gap-6' },
                        e('div', { className: 'bg-white p-5 border border-slate-200 rounded-lg shadow-sm' },
                            e('h3', { className: 'text-xs font-bold text-slate-700 uppercase tracking-wider mb-4 border-b pb-2' }, 'Enroll New Student'),
                            e('form', { onSubmit: handleEnrollStudent, className: 'flex flex-col gap-3' },
                                e('div', null,
                                    e('label', { className: 'block text-[10px] font-bold text-slate-500 uppercase mb-1' }, 'Student Full Name'),
                                    e('input', { type: 'text', value: fullName, onChange: (ev) => setFullName(ev.target.value), placeholder: 'E.G. CHUMA KANYAMA', className: 'w-full text-xs p-2 border rounded outline-none focus:border-blue-500', required: true })
                                ),
                                e('div', null,
                                    e('label', { className: 'block text-[10px] font-bold text-slate-500 uppercase mb-1' }, 'Form Level'),
                                    e('select', { value: selectedClass, onChange: (ev) => setSelectedClass(ev.target.value), className: 'w-full text-xs p-2 border rounded bg-white' }, AVAILABLE_CLASSES.map(c => e('option', { key: c, value: c }, c)))
                                ),
                                e('div', null,
                                    e('label', { className: 'block text-[10px] font-bold text-slate-500 uppercase mb-1' }, 'Assigned Stream'),
                                    e('select', { value: selectedStream, onChange: (ev) => setSelectedStream(ev.target.value), className: 'w-full text-xs p-2 border rounded bg-white' }, AVAILABLE_STREAMS.map(s => e('option', { key: s, value: s }, `Stream ${s}`)))
                                ),
                                e('button', { type: 'submit', className: 'w-full bg-blue-600 text-white font-bold text-xs py-2 rounded mt-2' }, 'Admit Student')
                            )
                        ),
                        e('div', { className: 'bg-white p-5 border border-slate-200 rounded-lg shadow-sm' },
                            e('h3', { className: 'text-xs font-bold text-slate-700 uppercase tracking-wider mb-3 border-b pb-2' }, 'Mass Import Tools'),
                            e('button', { type: 'button', onClick: handleDownloadTemplate, className: 'w-full border text-blue-700 bg-blue-50/50 hover:bg-blue-50 font-bold text-xs py-2 rounded mb-3 text-center' }, '📥 Download CSV Template'),
                            e('input', { type: 'file', accept: '.csv', onChange: handleBulkUploadCSV, className: 'w-full text-xs text-slate-500 border rounded p-1' })
                        )
                    ),
                    e('div', { className: 'bg-white p-5 border border-slate-200 rounded-lg shadow-sm md:col-span-2' },
                        e('h3', { className: 'text-xs font-bold text-slate-700 uppercase tracking-wider mb-4 border-b pb-2' }, 'Global Enrolled Database'),
                        e('div', { className: 'grid grid-cols-1 sm:grid-cols-3 gap-3 mb-4' },
                            e('input', { type: 'text', value: searchQuery, onChange: (ev) => setSearchQuery(ev.target.value), placeholder: '🔍 Search student name...', className: 'text-xs p-2 border rounded outline-none' }),
                            e('select', { value: filterClass, onChange: (ev) => setFilterClass(ev.target.value), className: 'text-xs p-2 border rounded bg-white' }, e('option', { value: 'ALL' }, 'All Forms'), AVAILABLE_CLASSES.map(c => e('option', { key: c, value: c }, c))),
                            e('select', { value: filterStream, onChange: (ev) => setFilterStream(ev.target.value), className: 'text-xs p-2 border rounded bg-white' }, e('option', { value: 'ALL' }, 'All Streams'), AVAILABLE_STREAMS.map(s => e('option', { key: s, value: s }, `Stream ${s}`)))
                        ),
                        e('div', { className: 'overflow-x-auto' },
                            e('table', { className: 'w-full text-left text-xs border-collapse' },
                                e('thead', null, e('tr', { className: 'bg-slate-50 text-slate-600 border-b' }, e('th', { className: 'p-3 font-bold' }, 'Student Name'), e('th', { className: 'p-3 font-bold text-center' }, 'Class Room'), e('th', { className: 'p-3 font-bold text-center' }, 'Stream Block'))),
                                e('tbody', null, filteredRoster.map(s => e('tr', { key: s.id, className: 'border-b border-slate-100' }, e('td', { className: 'p-3 font-bold text-slate-800' }, s.name), e('td', { className: 'p-3 text-center font-semibold text-blue-600' }, s.class), e('td', { className: 'p-3 text-center' }, e('span', { className: 'bg-emerald-50 text-emerald-700 px-2 py-0.5 font-bold rounded' }, `Stream ${s.stream}`)))))
                            )
                        )
                    )
                )
            );
        }

        function TeacherDashboard(props) {
            return e('div', { className: 'p-6 max-w-7xl mx-auto' },
                e('div', { className: 'bg-blue-50 border border-blue-200 p-4 rounded-lg mb-6 flex justify-between items-center' },
                    e('div', null,
                        e('p', { className: 'text-xs font-bold text-blue-800 uppercase' }, 'Logged-In Workspace'),
                        e('h2', { className: 'text-base font-black text-slate-900' }, props.activeTeacher.name),
                        e('div', { className: 'text-xs text-slate-600 mt-1 flex flex-wrap items-center gap-1' }, 'Authorized Streams:', props.activeTeacher.targetClasses.map(c => props.activeTeacher.targetStreams.map(s => e('span', { key: `${c}-${s}`, className: 'bg-slate-200 px-1.5 py-0.5 rounded text-[10px] font-bold text-slate-700' }, `${c}-${s}`))))
                    ),
                    e('button', { onClick: () => props.setView('manage-teachers'), className: 'bg-white border text-xs font-bold px-3 py-1.5 rounded text-slate-700 hover:bg-slate-50 shadow-sm' }, 'Change Teacher')
                ),
                e('div', { className: 'grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-5' },
                    e(DashboardCard, { icon: '📋', title: 'Stream Attendance', description: 'Mark attendance records across assigned streams.', onClick: () => props.setView('attendance') }),
                    e(DashboardCard, { icon: '📚', title: 'Lesson Blueprints', description: 'Submit structural schemas to administration.', onClick: () => props.setView('blueprints') }),
                    e(DashboardCard, { icon: '🖋️', title: 'Enter Grades (Term & Exams)', description: 'Directly input marks for all your allocated streams.', onClick: () => props.setView('grading') }),
                    e(DashboardCard, { icon: '📊', title: 'Performance Diagnostics', description: 'Analyze term pass ratios.', onClick: () => {} })
                )
            );
        }

        function LessonBlueprintsSystem(props) {
            const [selectedClass, setSelectedClass] = useState(props.activeTeacher.targetClasses[0] || 'F1');
            const [selectedStream, setSelectedStream] = useState(props.activeTeacher.targetStreams[0] || 'A');
            const [topicTitle, setTopicTitle] = useState('');
            const [weeksCount, setWeeksCount] = useState(1);
            const [schemaText, setSchemaText] = useState('');

            const handleAddBlueprint = (event) => {
                event.preventDefault();
                if (!topicTitle.trim() || !schemaText.trim()) return;
                props.setBlueprints([...props.blueprints, {
                    id: Date.now(), teacherInitials: props.activeTeacher.initials, className: selectedClass, streamName: selectedStream,
                    topic: topicTitle.toUpperCase(), durationWeeks: Number(weeksCount), description: schemaText, timestamp: new Date().toLocaleDateString()
                }]);
                setTopicTitle(''); setWeeksCount(1); setSchemaText('');
                alert("Blueprint submitted to administration clearance logs.");
            };

            return e('div', { className: 'p-6 max-w-6xl mx-auto' },
                e('div', { className: 'flex justify-between items-center mb-6' }, e('h2', { className: 'text-lg font-bold text-slate-800' }, '📚 Lesson Blueprints Workspace'), e('button', { onClick: () => props.setView('teacher'), className: 'bg-slate-600 text-white font-bold text-xs px-3 py-1.5 rounded' }, '← Back to Desk')),
                e('div', { className: 'grid grid-cols-1 md:grid-cols-3 gap-6' },
                    e('div', { className: 'bg-white p-5 border rounded-lg shadow-sm h-fit' },
                        e('form', { onSubmit: handleAddBlueprint, className: 'flex flex-col gap-3' },

        function GradingSystem(props) {
            const calculateCalculatedTotal = (s) => {
                // 1. Gather all continuous assessments that contain data
                const validContinuousScores = [];
                if (s.t1 !== "" && s.t1 !== undefined && s.t1 !== null) validContinuousScores.push(Number(s.t1));
                if (s.midterm !== "" && s.midterm !== undefined && s.midterm !== null) validContinuousScores.push(Number(s.midterm));
                if (s.t2 !== "" && s.t2 !== undefined && s.t2 !== null) validContinuousScores.push(Number(s.t2));

                // 2. Compute the exact average of available assessments (or fallback to 0)
                const caAverage = validContinuousScores.length > 0 
                    ? validContinuousScores.reduce((sum, val) => sum + val, 0) / validContinuousScores.length 
                    : 0;

                // 3. Capture the terminal/annual exam score
                const finalExamScore = (s.exam !== "" && s.exam !== undefined && s.exam !== null) ? Number(s.exam) : 0;
                
                // 4. Mathematical Formula Execution: (Average of CA + Terminal score) / 2
                const compositeCalculation = (caAverage + finalExamScore) / 2;
                
                return compositeCalculation.toFixed(1);
            };

            const getGradeMetric = (totalScore) => {
                if (totalScore >= props.settings.gradeA) return { letter: "A", color: "text-green-600 font-bold" };
                if (totalScore >= props.settings.gradeB) return { letter: "B", color: "text-blue-600 font-bold" };
                if (totalScore >= props.settings.gradeC) return { letter: "C", color: "text-indigo-600 font-bold" };
                if (totalScore >= props.settings.gradeD) return { letter: "D", color: "text-amber-600 font-bold" };
                return { letter: "F", color: "text-red-600 font-bold" };
            };

            const [filterClass, setFilterClass] = useState(props.activeTeacher.targetClasses[0] || 'F1');
            const [filterStream, setFilterStream] = useState(props.activeTeacher.targetStreams[0] || 'A');

            const filteredStudents = props.students.filter(s => 
                s.class === filterClass && 
                s.stream === filterStream &&
                props.activeTeacher.targetClasses.includes(s.class) &&
                props.activeTeacher.targetStreams.includes(s.stream)
            );

            const updateScore = (id, field, value) => {
                const sanitizedValue = value === "" ? "" : Math.min(100, Math.max(0, Number(value) || 0));
                props.setStudents(props.students.map(s => s.id === id ? Object.assign({}, s, { [field]: sanitizedValue }) : s));
            };

                                }, c))
                            )
                        ),
                        e('div', null,
                            e('span', { className: 'text-xs font-semibold text-slate-600 block mb-1' }, 'Stream:'),
                            e('div', { className: 'flex flex-wrap gap-1' },
                                props.activeTeacher.targetStreams.map(s => e('button', {
                                    key: s,
                                    onClick: () => setFilterStream(s),
                                    className: `px-3 py-1 text-xs font-bold rounded border cursor-pointer ${filterStream === s ? 'bg-emerald-600 text-white border-emerald-600' : 'bg-slate-50 text-slate-700 border-slate-200 hover:bg-slate-100'}`
                                }, `Stream ${s}`))
                            )

                filteredStudents.length === 0 ? e('div', { className: 'bg-white border border-dashed text-center p-12 rounded-lg text-slate-400 text-sm font-medium' }, `No students matched inside your allocated container filter for ${filterClass}-${filterStream}.`) :

                        e('thead', null,

                                        e('input', {
