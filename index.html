<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Admission & Bulk Report Card Manager</title>
    <style>
        :root {
            --primary-blue: #2563eb;
            --dark-navy: #1e293b;
            --border-color: #000;
            --bg-light: #f8fafc;
            --panel-bg: #ffffff;
            --accent-green: #10b981;
        }

        body {
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 0;
            background-color: #e2e8f0;
            color: #000;
        }

        /* --- CONTROL PANEL NAVIGATION BAR --- */
        .main-control-panel {
            background-color: #0f172a;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid var(--primary-blue);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        .panel-brand {
            color: #fff;
            font-weight: bold;
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .panel-links {
            display: flex;
            gap: 12px;
        }

        .panel-btn {
            background-color: #334155;
            color: #f8fafc;
            border: none;
            padding: 8px 14px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s ease;
            text-decoration: none;
        }

        .panel-btn:hover {
            background-color: var(--primary-blue);
            color: white;
        }

        .panel-btn.active {
            background-color: var(--primary-blue);
            font-weight: bold;
            box-shadow: 0 0 8px rgba(37, 99, 235, 0.5);
        }

        /* --- Admin Layout Container (Hidden on Print) --- */
        #admin-container {
            display: grid;
            grid-template-columns: 340px 1fr;
            gap: 20px;
            padding: 20px;
            max-width: 1600px;
            margin: 0 auto;
        }

        .admin-header-bar {
            grid-column: 1 / -1;
            background-color: var(--dark-navy);
            color: white;
            padding: 15px 20px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        .admin-header-bar h1 {
            margin: 0;
            font-size: 18px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .admin-card {
            background: var(--panel-bg);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin-bottom: 20px;
        }

        .admin-card h2 {
            font-size: 14px;
            color: #475569;
            text-transform: uppercase;
            margin-top: 0;
            margin-bottom: 15px;
            letter-spacing: 0.5px;
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 8px;
        }

        .form-control {
            margin-bottom: 12px;
        }

        .form-control label {
            display: block;
            font-size: 11px;
            font-weight: bold;
            color: #64748b;
            margin-bottom: 4px;
            text-transform: uppercase;
        }

        .form-control input, .form-control select {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }

        .btn-submit {
            width: 100%;
            background-color: var(--primary-blue);
            color: white;
            border: none;
            padding: 10px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
            margin-bottom: 5px;
        }

        .btn-secondary {
            width: 100%;
            background-color: #64748b;
            color: white;
            border: none;
            padding: 8px;
            border-radius: 6px;
            font-weight: normal;
            cursor: pointer;
            font-size: 12px;
            text-align: center;
            text-decoration: none;
            display: block;
            box-sizing: border-box;
            margin-bottom: 5px;
        }

        .db-filters {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
        }

        .db-filters input, .db-filters select {
            padding: 8px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 14px;
        }

        .bulk-actions-bar {
            background-color: #f1f5f9;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 13px;
        }

        .roster-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .roster-table th {
            color: #64748b;

        }

        }

            padding: 2px 8px;
            border-radius: 4px;

        }

        .marks-panel-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 12px;
            margin-top: 15px;
        }

        .subject-block {
            background: #f8fafc;

            padding: 10px;

        }

        .subject-block label {

        .input-row {

        }

        .input-row div {

        }

        .input-row span {

        }

        .workspace-split {

        }

        }

        .behavior-section {
            margin-top: 15px;

        .section-heading {

            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 5px;

        .behavior-container {
            display: grid;

        table.behavior-table {
            width: 100%;

            font-size: 11px;

        table.behavior-table td:nth-child(2) { text-align: center; font-weight: bold; width: 60px; }

        .grading-legend {
            font-size: 11px;
            margin-top: 5px;
            font-style: italic;
        }

        .admin-section {
            margin-top: 15px;
            font-size: 12px;
            line-height: 1.8;
        }

        .signature-stamp-space {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .stamp-box {
            border: 2px dashed #0000ff;
            color: #0000ff;
            border-radius: 50%;
            width: 110px;
            height: 110px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 9px;
            font-weight: bold;
            transform: rotate(-5deg);
            margin-top: -10px;
        }

        .parent-slip {
            margin-top: 25px;
            border-top: 1px dashed #000;
            position: relative;
            padding-top: 15px;
            font-size: 12px;
        }

        .scissors-icon {
            position: absolute;
            top: -10px;
            right: 10px;
            font-size: 16px;
            background: white;
            padding: 0 5px;
        }

        .slip-title {
            text-align: center;
            font-weight: bold;
            margin-bottom: 15px;
        }

        /* --- Print Rules --- */
        @media print {
            .main-control-panel, #admin-container {
                display: none !important;
            }
            body {
                background-color: white;
                padding: 0;
            }
            .report-card-page {
                box-shadow: none;
                margin: 0 auto 0mm auto;
                padding: 10mm 15mm;
                width: 210mm;
                height: 297mm;
                page-break-after: always;
                overflow: hidden;
            }
            .report-card-page.hidden-print {
                display: none !important;
            }
        }
    </style>
</head>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    // 1. Initial State Definition 
    let students = [
        { id: "s1", name: "Zaria Smith", gender: "Female", stream: "Form A", scores: { mat: { t1: 85, t2: 90, mid: 88, term: 92 }, eng: { t1: 70, t2: 75, mid: 80, term: 78 }, sci: { t1: 92, t2: 95, mid: 91, term: 96 } } },
        { id: "s2", name: "Aaron Burr", gender: "Male", stream: "Form A", scores: { mat: { t1: 60, t2: 65, mid: 70, term: 68 }, eng: { t1: 85, t2: 88, mid: 90, term: 92 }, sci: { t1: 75, t2: 80, mid: 78, term: 82 } } },
        { id: "s3", name: "Amara Jones", gender: "Female", stream: "Form A", scores: { mat: { t1: 85, t2: 90, mid: 88, term: 92 }, eng: { t1: 90, t2: 92, mid: 94, term: 95 }, sci: { t1: 88, t2: 89, mid: 85, term: 90 } } }, // Tied with Zaria in Math
        { id: "s4", name: "Charles Vance", gender: "Male", stream: "Form A", scores: { mat: { t1: 50, t2: 55, mid: 52, term: 58 }, eng: { t1: 60, t2: 62, mid: 65, term: 64 }, sci: { t1: 70, t2: 72, mid: 75, term: 74 } } }
    ];

    const subjects = [
        { id: 'mat', name: 'Mathematics' },
        { id: 'eng', name: 'English Language' },
        { id: 'sci', name: 'General Science' }
    ];

    // Initialize Bootstrap Modal Instance
    let scoreModal;
    document.addEventListener("DOMContentLoaded", () => {
        scoreModal = new bootstrap.Modal(document.getElementById('scoreModal'));
        renderRoster();
    });

    // 2. Sorting Logic Implementation: Females Alpha First, then Males Alpha
    function sortStudents(studentArray) {
        return [...studentArray].sort((a, b) => {
            if (a.gender !== b.gender) {
                return a.gender === 'Female' ? -1 : 1; 
            }
            return a.name.localeCompare(b.name);
        });
    }

    // 3. Helper to Compute Arithmetic Mean Average
    function getSubjectAverage(student, subId) {
        if (!student.scores || !student.scores[subId]) return null;
        const s = student.scores[subId];
        const marks = [s.t1, s.t2, s.mid, s.term].filter(v => v !== null && v !== undefined && v !== '');
        if (marks.length === 0) return null;
        const sum = marks.reduce((acc, curr) => acc + parseFloat(curr), 0);
        return parseFloat((sum / marks.length).toFixed(2));
    }

    // 4. AUTOMATIC SUBJECT RANK ENGINE (COMPETITION RANKING 1, 1, 3...)
    function calculateSubjectRankMap() {
        const rankMap = {}; // Format: { subjectId: { studentId: rankValue } }

        subjects.forEach(sub => {
            rankMap[sub.id] = {};
            
            // Extract all student records with valid scores for this subject
            let scoreList = students.map(student => ({
                studentId: student.id,
                average: getSubjectAverage(student, sub.id)
            })).filter(item => item.average !== null);

            // Sort score array descending
            scoreList.sort((a, b) => b.average - a.average);

            // Set ranks handling perfect score ties
            let currentRank = 1;
            for (let i = 0; i < scoreList.length; i++) {
                if (i > 0 && scoreList[i].average < scoreList[i - 1].average) {
                    currentRank = i + 1; // Skips positions based on duplicate occurrences
                }
                rankMap[sub.id][scoreList[i].studentId] = currentRank;
            }
        });

        return rankMap;
    }

    // Determine Dynamic Grading & Remarks Architecture 
    function assignGrade(avg) {
        if (avg === null) return '-';
        if (avg >= 80) return 'A';
        if (avg >= 70) return 'B';
        if (avg >= 60) return 'C';
        if (avg >= 50) return 'D';
        return 'F';
    }

    function assignRemarks(grade) {
        switch(grade) {
            case 'A': return 'Excellent Work';
            case 'B': return 'Very Good';
            case 'C': return 'Good Credit';
            case 'D': return 'Fair Effort';
            case 'F': return 'Needs Remedial Help';
            default: return '-';
        }
    }

    // 5. Render Administrative Dashboard Grid Table View
    function renderRoster() {
        const sortedData = sortStudents(students);
        const tbody = document.getElementById('studentRosterRows');
        tbody.innerHTML = '';

        sortedData.forEach(student => {
            const tr = document.createElement('tr');
            
            let subjectCells = '';
            subjects.forEach(sub => {
                const avg = getSubjectAverage(student, sub.id);
                subjectCells += `<td>${avg !== null ? avg.toFixed(1) : '<span class="text-muted">Unset</span>'}</td>`;
            });

            tr.innerHTML = `
                <td class="fw-bold">${student.name}</td>
                <td><span class="badge ${student.gender === 'Female' ? 'bg-danger' : 'bg-primary'}">${student.gender}</span></td>
                <td>${student.stream}</td>
                ${subjectCells}
                <td class="text-center">
                    <button class="btn btn-sm btn-outline-secondary me-1" onclick="openScoreModal('${student.id}')">✏️ Scores</button>
                    <button class="btn btn-sm btn-dark" onclick="generateReportCard('${student.id}')">📄 Report</button>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    // 6. Handle New Student Intake Submissions
    document.getElementById('studentForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const name = document.getElementById('studentName').value.trim();
        const gender = document.getElementById('studentGender').value;
        const stream = document.getElementById('studentStream').value.trim();
        const id = 's_' + Date.now();

        students.push({ id, name, gender, stream, scores: {} });
        this.reset();
        renderRoster();
    });

    // 7. Initialize and Open Score Entry Matrix Form View
    function openScoreModal(studentId) {
        const student = students.find(s => s.id === studentId);
        document.getElementById('modalStudentId').value = studentId;
        document.getElementById('scoreModalLabel').innerText = `Manage Performance: ${student.name}`;

        const container = document.getElementById('subjectInputContainer');
        container.innerHTML = '';

        subjects.forEach(sub => {
            const s = (student.scores && student.scores[sub.id]) ? student.scores[sub.id] : { t1:'', t2:'', mid:'', term:'' };
            
            const fieldset = document.createElement('div');
            fieldset.className = 'border rounded p-3 mb-3 bg-light';
            fieldset.innerHTML = `
                <h6 class="fw-bold text-primary mb-2">${sub.name}</h6>
                <div class="row g-2">
                    <div class="col-3">
                        <label class="small text-muted">Test 1</label>
                        <input type="number" step="any" min="0" max="100" class="form-control form-control-sm" name="${sub.id}_t1" value="${s.t1}">
                    </div>
                    <div class="col-3">
                        <label class="small text-muted">Test 2</label>
                        <input type="number" step="any" min="0" max="100" class="form-control form-control-sm" name="${sub.id}_t2" value="${s.t2}">
                    </div>
                    <div class="col-3">
                        <label class="small text-muted">Midterm</label>
                        <input type="number" step="any" min="0" max="100" class="form-control form-control-sm" name="${sub.id}_mid" value="${s.mid}">
                    </div>
                    <div class="col-3">
                        <label class="small text-muted">Terminal</label>
                        <input type="number" step="any" min="0" max="100" class="form-control form-control-sm" name="${sub.id}_term" value="${s.term}">
                    </div>
                </div>
            `;
            container.appendChild(fieldset);
        });

        scoreModal.show();
    }

    // 8. Capture and Persist Input Scores
    document.getElementById('scoreForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const studentId = document.getElementById('modalStudentId').value;
        const student = students.find(s => s.id === studentId);

        subjects.forEach(sub => {
            const t1 = document.querySelector(`[name="${sub.id}_t1"]`).value;
            const t2 = document.querySelector(`[name="${sub.id}_t2"]`).value;
            const mid = document.querySelector(`[name="${sub.id}_mid"]`).value;
            const term = document.querySelector(`[name="${sub.id}_term"]`).value;

            if(!student.scores) student.scores = {};
            student.scores[sub.id] = {
                t1: t1 !== '' ? parseFloat(t1) : null,
                t2: t2 !== '' ? parseFloat(t2) : null,
                mid: mid !== '' ? parseFloat(mid) : null,
                term: term !== '' ? parseFloat(term) : null
            };
        });

        scoreModal.hide();
        renderRoster();
        // Automatically refresh visible report card if active
        const viewer = document.getElementById('reportCardViewer');
        if(viewer.innerHTML !== '') {
            generateReportCard(studentId);
        }
    });

    // 9. DYNAMIC REPORT CARD COMPILER WITH DYNAMIC RANK CALCULATION
    function generateReportCard(studentId) {
        const student = students.find(s => s.id === studentId);
        const viewer = document.getElementById('reportCardViewer');
        
        // Dynamic Subject Ranking values execution pass
        const rankMap = calculateSubjectRankMap();

        let tableRowsHTML = '';
        
        subjects.forEach(sub => {
            const data = (student.scores && student.scores[sub.id]) ? student.scores[sub.id] : {};
            const t1 = data.t1 !== undefined && data.t1 !== null ? data.t1 : '-';
            const t2 = data.t2 !== undefined && data.t2 !== null ? data.t2 : '-';
            const mid = data.mid !== undefined && data.mid !== null ? data.mid : '-';
            const term = data.term !== undefined && data.term !== null ? data.term : '-';

            const avg = getSubjectAverage(student, sub.id);
            const displayAvg = avg !== null ? avg.toFixed(1) : '-';
            const grade = assignGrade(avg);
            const remarks = assignRemarks(grade);

            // Fetch Auto-calculated Subject Rank
            const subjectRank = (rankMap[sub.id] && rankMap[sub.id][student.id]) ? rankMap[sub.id][student.id] : '-';
            
            // Calculate total matching participant volume for validation
            const totalStudentsInSubject = students.filter(s => getSubjectAverage(s, sub.id) !== null).length;
            const displayRank = subjectRank !== '-' ? `${subjectRank} / ${totalStudentsInSubject}` : '-';

            tableRowsHTML += `
                <tr>
                    <td class="fw-bold">${sub.name}</td>
                    <td>${t1}</td>
                    <td>${t2}</td>
                    <td>${mid}</td>
                    <td>${term}</td>
                    <td class="fw-bold text-primary">${displayAvg}</td>
                    <td class="fw-bold text-center">${grade}</td>
                    <td class="text-center fw-bold bg-light text-dark">${displayRank}</td>
                    <td class="small text-muted">${remarks}</td>
                </tr>
            `;
        });

        viewer.innerHTML = `
            <div id="printArea" class="card report-card-print">
                <div class="report-header">
                    <h2 class="fw-bold text-uppercase mb-1">EXCELLENCE ACADEMY HIGH SCHOOL</h2>
                    <p class="text-muted mb-0">Official Student Performance Transcript / Report Card</p>
                </div>
                <div class="row mb-4">
                    <div class="col-md-6">
                        <table class="table table-sm table-borderless">
                            <tr><th width="35%">Student Name:</th><td>${student.name}</td></tr>
                            <tr><th>Gender Identity:</th><td>${student.gender}</td></tr>
                        </table>
                    </div>
                    <div class="col-md-6">
                        <table class="table table-sm table-borderless">
                            <tr><th width="35%">Academic Stream:</th><td>${student.stream}</td></tr>
                            <tr><th>Assessment Date:</th><td>${new Date().toLocaleDateString()}</td></tr>
                        </table>
                    </div>
                </div>

                <table class="table table-bordered align-middle">
                    <thead class="table-dark text-center">
                        <tr>
                            <th align="left">Subject Title</th>
                            <th>T1</th>
                            <th>T2</th>
                            <th>Midterm</th>
                            <th>Terminal</th>
                            <th>Average</th>
                            <th>Grade</th>
                            <th>Subject Rank</th>
                            <th>Instructor Remarks</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${tableRowsHTML}
                    </tbody>
                </table>

                <div class="mt-5 d-flex justify-content-between text-center no-print-flex">
                    <div style="width: 200px; border-top: 1px solid #333; padding-top: 5px;" class="small text-muted">Class Teacher Signature</div>
                    <button class="btn btn-outline-dark fw-bold no-print" onclick="window.print()">🖨️ Print Report Transcript</button>
                    <div style="width: 200px; border-top: 1px solid #333; padding-top: 5px;" class="small text-muted">Principal Endorsement Stamp</div>
                </div>
            </div>
        `;

        // Smooth scroll view position focus downward directly onto report element view
        viewer.scrollIntoView({ behavior: 'smooth' });
    }
</script>
</body>
</html>
