<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TT-PRO | Student Admission & Bulk Report Card Manager</title>
<style>
/* --- keep all your existing styles here (unchanged) --- */
</style>
</head>
<body>

<!-- MAIN CONTROL PANEL NAVIGATION BAR -->
<div class="main-control-panel">
  <div class="panel-brand">🏫 <span>TT-PRO MANAGEMENT SYSTEM</span></div>
  <div class="panel-links">
    <a href="index.html" class="panel-btn">🎛️ Main Dashboard</a>
    <a href="#admin-section" class="panel-btn active" onclick="switchView('admin')">👑 Admin Panel</a>
    <a href="#students-section" class="panel-btn" onclick="switchView('students')">🧑‍🎓 Roster</a>
    <a href="#teachers-section" class="panel-btn" onclick="switchView('teachers')">👩‍🏫 Teachers</a>
    <a href="#subjects-section" class="panel-btn" onclick="switchView('subjects')">📚 Subjects</a>
  </div>
</div>

<!-- ADMINISTRATIVE WORKSPACE -->
<div id="admin-container">
  <div class="admin-header-bar">
    <h1>📊 Student Admission & Bulk Report Card Module</h1>
    <button class="panel-btn" onclick="backToPanel()">← Back to Panel</button>
  </div>

  <!-- LEFT SIDEBAR preserved (config, enrollment, bulk upload, etc.) -->

  <!-- RIGHT WORKSPACE SECTION -->
  <div class="workspace-split">
    <!-- MASTER ROSTER GRID -->
    <div class="admin-card">
      <h2>Active Student Database Roster</h2>

      <div class="db-filters">
        <input type="text" id="search-filter" placeholder="🔍 Search student name..." 
               oninput="renderRosterTable()" style="flex: 2;">
        <select id="form-filter" onchange="renderRosterTable()" style="flex: 1;">
          <option value="All">All Forms</option>
          <option value="F1">F1</option>
          <option value="F2">F2</option>
          <option value="F3">F3</option>
          <option value="F4">F4</option>
        </select>
        <select id="stream-filter" onchange="renderRosterTable()" style="flex: 1;">
          <option value="All">All Streams</option>
          <option value="Stream A">Stream A</option>
          <option value="Stream B">Stream B</option>
          <option value="Stream C">Stream C</option>
          <option value="Stream D">Stream D</option>
          <option value="Stream E">Stream E</option>
        </select>
        <select id="roster-range" onchange="renderRosterTable()" style="flex:1;">
          <option value="25">Show 25</option>
          <option value="50">Show 50</option>
          <option value="100">Show 100</option>
          <option value="All" selected>Show All</option>
        </select>
      </div>

      <div class="bulk-actions-bar">
        <label><input type="checkbox" id="select-all-box" onchange="toggleSelectAll(this)"> 
          Select All For Batch Printing</label>
        <span id="selected-count-badge">Selected: 0 student(s)</span>
        <div style="margin-left:auto; display:flex; gap:8px;">
          <button class="btn-secondary" onclick="printClassReports('F1')">Print F1 Reports</button>
          <button class="btn-secondary" onclick="printClassReports('F2')">Print F2 Reports</button>
          <button class="btn-secondary" onclick="printClassReports('F3')">Print F3 Reports</button>
          <button class="btn-secondary" onclick="printClassReports('F4')">Print F4 Reports</button>
        </div>
      </div>

      <table class="roster-table">
        <thead>
          <tr>
            <th style="width: 50px; text-align: center;">Print</th>
            <th>Student Full Name</th>
            <th>Gender</th>
            <th>Form</th>
            <th>Stream</th>
            <th style="width: 150px; text-align: center;">Actions</th>
          </tr>
        </thead>
        <tbody id="roster-tbody"></tbody>
      </table>
    </div>

    <!-- DETAIL MARKS INTERACTIVE GRIDS preserved -->
  </div>
</div>

<!-- MAIN EXPORT LIVE PREVIEW CONTAINER -->
<div id="print-output-container"></div>

<script>
let globalStudents = []; // your student dataset

function renderRosterTable() {
  const tbody = document.getElementById("roster-tbody");
  tbody.innerHTML = "";

  // Group students by Form
  const grouped = {};
  globalStudents.forEach(stu => {
    if (!grouped[stu.form]) grouped[stu.form] = [];
    grouped[stu.form].push(stu);
  });

  // Render each Form separately
  Object.keys(grouped).forEach(form => {
    const headerRow = document.createElement("tr");
    headerRow.innerHTML = `<td colspan="6" style="font-weight:bold; background:#f1f5f9;">${form} CLASS LIST</td>`;
    tbody.appendChild(headerRow);

    grouped[form].forEach(stu => {
      const row = document.createElement("tr");
      row.innerHTML = `
        <td><input type="checkbox" data-id="${stu.id}" onchange="toggleStudentSelection(this)"></td>
        <td>${stu.fullname}</td>
        <td>${stu.gender}</td>
        <td>${stu.form}</td>
        <td>${stu.stream}</td>
        <td>
          <button class="btn-action-small btn-edit" onclick="editStudent('${stu.id}')">Edit</button>
          <button class="btn-action-small btn-delete" onclick="deleteStudent('${stu.id}')">Delete</button>
        </td>
      `;
      tbody.appendChild(row);
    });
  });
}

function printClassReports(formLevel) {
  const classStudents = globalStudents.filter(stu => stu.form === formLevel);
  if (classStudents.length === 0) {
    alert(`No students found in ${formLevel}`);
    return;
  }
  generateReportsForStudents(classStudents);
}

// Hook into your existing report generation logic
function generateReportsForStudents(students) {
  console.log("Generating reports for:", students);
  // integrate with generateAllReportCardsHTML or your print logic
}
</script>
</body>
</html>
