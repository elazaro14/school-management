<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TT-PRO | Student Admission & Bulk Report Card Manager</title>
<style>
:root {
  --primary-blue: #2563eb;
  --dark-navy: #1e293b;
  --border-color: #000000;
  --bg-light: #f8fafc;
  --panel-bg: #ffffff;
  --accent-green: #10b981;
  --accent-purple: #7c3aed;
  --text-dark: #0f172a;
  --text-muted: #64748b;

  /* Good color design */
  --goo-orange: #ff9800;
  --goo-teal: #009688;
  --goo-pink: #e91e63;
  --goo-gray: #f5f5f5;
}

/* Control panel */
.main-control-panel {
  background-color: var(--dark-navy);
  padding: 12px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 3px solid var(--primary-blue);
}

.panel-btn.goo {
  background-color: var(--goo-orange);
  color: #fff;
  font-weight: 700;
}
.panel-btn.goo:hover {
  background-color: #fb8c00;
}

.admin-header-bar {
  background: linear-gradient(90deg, var(--goo-teal), var(--primary-blue));
  color: #fff;
  padding: 15px 20px;
  border-radius: 8px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
</style>
</head>
<body>

<!-- Navigation -->
<div class="main-control-panel">
  <div class="panel-brand">🏫 <span>TT-PRO MANAGEMENT SYSTEM</span></div>
  <div class="panel-links">
    <a href="index.html" class="panel-btn">🎛️ Main Dashboard</a>
    <a href="#admin-section" class="panel-btn active">👑 Admin Panel</a>
    <a href="#students-section" class="panel-btn">🧑‍🎓 Roster</a>
    <a href="#teachers-section" class="panel-btn">👩‍🏫 Teachers</a>
    <a href="#subjects-section" class="panel-btn">📚 Subjects</a>
    <a href="#goo-section" class="panel-btn goo">🟠 Goo Display</a>
  </div>
</div>

<!-- Student roster -->
<div class="admin-card">
  <h2>Active Student Database Roster</h2>
  <div class="db-filters">
    <input type="text" id="search-filter" placeholder="🔍 Search student name..." oninput="renderRosterTable()" style="flex: 2;">
    <select id="form-filter" onchange="renderRosterTable()" style="flex: 1;">
      <option value="All">All Forms</option>
      <option value="F1">F1</option>
      <option value="F2">F2</option>
      <option value="F3">F3</option>
      <option value="F4">F4</option>
    </select>
    <select id="stream-filter" onchange="renderRosterTable()" style="flex: 1;">
      <option value="All">All Streams</option>
      <option value="Stream A">Stream A</option>
      <option value="Stream B">Stream B</option>
      <option value="Stream C">Stream C</option>
    </select>
    <!-- New range filter -->
    <select id="range-filter" onchange="renderRosterTable()" style="flex: 1;">
      <option value="25">25</option>
      <option value="50">50</option>
      <option value="100">100</option>
      <option value="All">All</option>
    </select>
  </div>

  <div class="bulk-actions-bar">
    <label><input type="checkbox" id="select-all-box" onchange="toggleSelectAll(this)"> Select All For Batch Printing</label>
    <span id="selected-count-badge">Selected: 0 student(s)</span>
  </div>

  <table class="roster-table">
    <thead>
      <tr>
        <th style="width: 50px; text-align: center;">Print</th>
        <th>Student Full Name</th>
        <th>Gender</th>
        <th>Form</th>
        <th>Stream</th>
      </tr>
    </thead>
    <tbody id="roster-tbody"></tbody>
  </table>
</div>

<script>
function renderRosterTable() {
  const tbody = document.getElementById('roster-tbody');
  const search = document.getElementById('search-filter').value.toLowerCase();
  const fFilter = document.getElementById('form-filter').value;
  const sFilter = document.getElementById('stream-filter').value;
  const range = document.getElementById('range-filter').value;

  tbody.innerHTML = '';
  let checkedCount = 0;

  let filteredStudents = globalStudents.filter(stu => {
    if (search && !stu.name.toLowerCase().includes(search)) return false;
    if (fFilter !== 'All' && stu.form !== fFilter) return false;
    if (sFilter !== 'All' && stu.stream !== sFilter) return false;
    return true;
  });

  if (range !== 'All') {
    filteredStudents = filteredStudents.slice(0, parseInt(range));
  }

  if (filteredStudents.length === 0) {
    tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; color:var(--text-muted); padding:20px;">No students currently active in local storage context.</td></tr>';
    document.getElementById('selected-count-badge').innerText = `Selected: 0 student(s)`;
    return;
  }

  filteredStudents.forEach(stu => {
    if (stu.checkedForPrint) checkedCount++;
    let tr = document.createElement('tr');
    if (stu.id === selectedStudentId) tr.className = 'active-student';
    tr.onclick = (e) => { if(e.target.type !== 'checkbox') selectStudent(stu.id); };
    tr.innerHTML = `
      <td style="text-align:center;">
        <input type="checkbox" ${stu.checkedForPrint ? 'checked' : ''} onchange="toggleStudentCheck(${stu.id}, this.checked)">
      </td>
      <td><strong>${stu.name}</strong></td>
      <td>${stu.gender}</td>
      <td style="color:var(--primary-blue); font-weight: 700;">${stu.form}</td>
      <td><span class="badge-stream">${stu.stream}</span></td>
    `;
    tbody.appendChild(tr);
  });

  document.getElementById('selected-count-badge').innerText = `Selected: ${checkedCount} student(s)`;
}
</script>
</body>
</html>
