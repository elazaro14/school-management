<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ShuleSys Management Portal</title>
  
  <!-- Loads Tailwind CSS for layout styling structures natively -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Loads React, ReactDOM, and Babel compilers straight into the mobile browser -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    :root {
      --primary-color: #007bff;
      --primary-hover: #0056b3;
      --bg-color: #f4f6f9;
      --card-bg: #f9f9f9;
      --text-main: #212529;
      --text-muted: #6c757d;
      --border-color: #dee2e6;
    }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- Links directly to your main setup script file below -->
  <script type="text/babel" src="src/App.js"></script>
</body>
</html>
