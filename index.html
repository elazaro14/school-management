<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShuleSys Portal & TT-PRO Ultimate Engine</title>
    <!-- Stable Tailwind CSS Stylesheet -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Production-ready React and ReactDOM Core Engines -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <style>
        @media print {
            .no-print { display: none !important; }
            .print-page-break { page-break-before: always !important; break-before: page !important; margin-top: 0 !important; padding-top: 10px !important; }
            body { background-color: #ffffff !important; padding: 0 !important; }
            #output { max-width: 100% !important; width: 100% !important; }
        }
        .mosque-strips {
            background: repeating-linear-gradient(45deg, #fef08a, #fef08a 10px, #fefcbf 10px, #fefcbf 20px);
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800">

    <div id="root">
        <div id="fallback-loader" class="flex flex-col items-center justify-center min-h-screen p-6 text-center">
            <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-blue-600 mb-4"></div>
            <p class="text-sm font-semibold text-slate-600">Initializing ShuleSys Portal Engines...</p>
        </div>
    </div>

    <!-- Diagnostic Script Catch-Block -->
    <script type="text/javascript">
        window.addEventListener('error', function(e) {
            var rootEl = document.getElementById('root');
            if (rootEl) {
                rootEl.innerHTML = `
                    <div class="p-6 max-w-xl mx-auto my-12 bg-white border border-red-200 rounded-lg shadow-sm">
                        <h2 class="text-red-600 font-bold text-base mb-2">System Execution Exception Caught</h2>
                        <p class="text-xs text-slate-600 font-mono bg-slate-50 p-3 rounded border mb-4">${e.message}</p>
                    </div>
                `;
            }
        });
    </script>

    <!-- React Application Logic Engine Script Container -->
    <script type="text/javascript">
        const e = React.createElement;
        const useState = React.useState;
        const useEffect = React.useEffect;

        const AVAILABLE_STREAMS = ['A', 'B', 'C', 'D', 'E', 'F'];
        const AVAILABLE_CLASSES = ['F1', 'F2', 'F3', 'F4'];
        const MONTHS = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
        
        const TIMETABLE_SLOTS = [
            { id: 1, label: "08:00 - 08:40", isBefore1040: true, isBreak: false },
            { id: 2, label: "08:40 - 09:20", isBefore1040: true, isBreak: false },
            { id: 3, label: "09:20 - 10:00", isBefore1040: true, isBreak: false },
            { id: 4, label: "10:00 - 10:40", isBefore1040: true, isBreak: false },
            { id: 5, label: "10:40 - 11:00", isBefore1040: false, isBreak: true, labelName: "MORNING BREAK" },
            { id: 6, label: "11:00 - 11:40", isBefore1040: false, isBreak: false },
            { id: 7, label: "11:40 - 12:20", isBefore1040: false, isBreak: false },
            { id: 8, label: "12:20 - 01:00", isBefore1040: false, isBreak: false },
            { id: 9, label: "01:00 - 02:00", isBefore1040: false, isBreak: true, labelName: "LUNCH & PRAYERS" },
            { id: 10, label: "02:00 - 02:40", isBefore1040: false, isBreak: false },
            { id: 11, label: "02:40 - 03:20", isBefore1040: false, isBreak: false }
        ];

        const DAYS_OF_WEEK = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"];

        const INITIAL_SUBJECTS = [
            { code: "CIV", name: "CIVICS", type: "core" },
            { code: "HIST", name: "HISTORY", type: "core" },
            { code: "GEO", name: "GEOGRAPHY", type: "core" },
            { code: "KISW", name: "KISWAHILI", type: "core" },
            { code: "ENGL", name: "ENGLISH", type: "core" },
            { code: "PHY", name: "PHYSICS", type: "science" },
            { code: "CHEM", name: "CHEMISTRY", type: "science" },
            { code: "BIO", name: "BIOLOGY", type: "science" },
            { code: "B/MATH", name: "BASIC MATHEMATICS", type: "core" }
        ];

        function Navbar(props) {
            return e('nav', { className: 'flex justify-between items-center bg-[#2c3e50] text-white px-6 py-3 shadow-md no-print' },
                e('h2', { className: 'text-sm sm:text-base font-bold' }, `🏫 ${props.settings.schoolName || 'ShuleSys Portal'}`),
                e('div', { className: 'flex gap-4 items-center text-xs' },
                    ['admin', 'teacher', 'student', 'parent'].map(v => 
                        e('button', {
                            key: v,
                            onClick: () => props.setView(v),
                            className: `hover:text-white transition capitalize cursor-pointer ${props.currentView === v || ['manage-teachers', 'manage-students', 'timetable', 'settings', 'grading', 'attendance', 'calendar', 'blueprints', 'diagnostics', 'report-cards'].includes(props.currentView) && v === 'admin' ? 'text-white font-black underline underline-offset-4' : 'text-slate-300'}`
                        }, v === 'teacher' ? `Teacher Workspace (${props.activeTeacher?.initials || 'None'})` : v)
                    )
                )
            );
        }

        function DashboardCard(props) {
            return e('div', {
                onClick: props.onClick,
                className: 'bg-white border border-slate-200 rounded-lg p-5 shadow-sm cursor-pointer transition transform hover:-translate-y-0.5 hover:shadow-md hover:border-blue-300'
            },
                e('div', { className: 'text-2xl mb-2' }, props.icon),
                e('h3', { className: 'text-sm font-bold text-slate-800 mb-1' }, props.title),
                e('p', { className: 'text-xs text-slate-500 leading-relaxed' }, props.description)
            );
        }

        function AdminDashboard(props) {
            return e('div', { className: 'p-6 max-w-7xl mx-auto' },
                e('h2', { className: 'text-lg font-bold text-slate-800 mb-5' }, 'Control Panel Overview'),
                e('div', { className: 'grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-5' },
                    e(DashboardCard, { icon: '👨‍🏫', title: 'Manage Teachers', description: 'Add teachers and assign multiple forms/streams (A-F).', onClick: () => props.setView('manage-teachers') }),
                    e(DashboardCard, { icon: '🧑‍🎓', title: 'Manage Students', description: 'Enroll students, assign streams, and track global terminal rosters.', onClick: () => props.setView('manage-students') }),
                    e(DashboardCard, { icon: '📅', title: 'TT-PRO Timetable Engine', description: 'Configure schedules with automated validation metrics rules.', onClick: () => props.setView('timetable') }),
                    e(DashboardCard, { icon: '📝', title: 'Terminal Report Cards', description: 'Generate comprehensive report logs sorted Alphabetically by Female First.', onClick: () => props.setView('report-cards') }),
                    e(DashboardCard, { icon: '🗓️', title: 'Academic Calendar', description: 'Schedule and map multi-month key institutional milestones.', onClick: () => props.setView('calendar') }),
                    e(DashboardCard, { icon: '📊', title: 'System Settings', description: 'Configure system names, active streams, and grading scales.', onClick: () => props.setView('settings') })
                )
            );
        }

        function TeacherManagement(props) {
            const [name, setName] = useState('');
            const [initials, setInitials] = useState('');
            const [phone, setPhone] = useState('');
            const [specialization, setSpecialization] = useState('');
            const [selectedClasses, setSelectedClasses] = useState(['F1']);
            const [selectedStreams, setSelectedStreams] = useState(['A']);

            const toggleClass = (cls) => {
                if (selectedClasses.includes(cls)) {
                    setSelectedClasses(selectedClasses.filter(c => c !== cls));
                } else {
                    setSelectedClasses([...selectedClasses, cls]);
                }
            };

            const toggleStream = (strm) => {
                if (selectedStreams.includes(strm)) {
                    setSelectedStreams(selectedStreams.filter(s => s !== strm));
                } else {
                    setSelectedStreams([...selectedStreams, strm]);
                }
            };

            const handleAddTeacher = (event) => {
                event.preventDefault();
                if (!name.trim() || !initials.trim()) return;
                if (selectedClasses.length === 0 || selectedStreams.length === 0) {
                    alert("Please select at least one Class and one Stream for this teacher.");
                    return;
                }

                const newTeacher = {
                    id: Date.now(),
                    name: name.toUpperCase(),
                    initials: initials.toUpperCase().slice(0, 4),
                    phone: phone || '-',
                    specialization: specialization.toUpperCase() || 'GENERAL',
                    targetClasses: selectedClasses,
                    targetStreams: selectedStreams
                };

                props.setTeachers([...props.teachers, newTeacher]);
                setName(''); setInitials(''); setPhone(''); setSpecialization('');
                setSelectedClasses(['F1']); setSelectedStreams(['A']);
            };

            return e('div', { className: 'p-6 max-w-6xl mx-auto' },
                e('div', { className: 'flex justify-between items-center mb-6' },
                    e('h2', { className: 'text-lg font-bold text-slate-800' }, '👨‍🏫 Teacher Registry & Multi-Stream Allocation'),
                    e('button', { onClick: () => props.setView('admin'), className: 'bg-slate-600 text-white font-bold text-xs px-3 py-1.5 rounded cursor-pointer' }, '← Back to Panel')
                ),
                e('div', { className: 'grid grid-cols-1 md:grid-cols-3 gap-6' },
                    e('div', { className: 'bg-white p-5 border border-slate-200 rounded-lg shadow-sm h-fit' },
                        e('h3', { className: 'text-xs font-bold text-slate-700 uppercase tracking-wider mb-4 border-b pb-2' }, 'Register New Teacher'),
                        e('form', { onSubmit: handleAddTeacher, className: 'flex flex-col gap-3' },
                            e('div', null,
                                e('label', { className: 'block text-[10px] font-bold text-slate-500 uppercase mb-1' }, 'Full Name'),
                                e('input', { type: 'text', value: name, onChange: (ev) => setName(ev.target.value), placeholder: 'E.G. MR. JOHN MEMA', className: 'w-full text-xs p-2 border border-slate-200 rounded outline-none focus:border-blue-500', required: true })
                            ),
                            e('div', null,
                                e('label', { className: 'block text-[10px] font-bold text-slate-500 uppercase mb-1' }, 'Staff Initials'),
                                e('input', { type: 'text', value: initials, onChange: (ev) => setInitials(ev.target.value), maxLength: 4, placeholder: 'E.G. JM', className: 'w-full text-xs p-2 border border-slate-200 rounded outline-none focus:border-blue-500', required: true })
                            ),
                            e('div', null,
                                e('label', { className: 'block text-[10px] font-bold text-slate-500 uppercase mb-1' }, 'Assigned Classes'),
                                e('div', { className: 'grid grid-cols-4 gap-2 mt-1' },
                                    AVAILABLE_CLASSES.map(f => e('button', {
                                        type: 'button',
                                        key: f,
                                        onClick: () => toggleClass(f),
                                        className: `p-2 text-xs font-bold rounded border text-center transition cursor-pointer ${selectedClasses.includes(f) ? 'bg-blue-600 border-blue-600 text-white' : 'bg-slate-50 text-slate-700 border-slate-200 hover:bg-slate-100'}`
                                    }, f))
                                )
                            ),
                            e('div', null,
                                e('label', { className: 'block text-[10px] font-bold text-slate-500 uppercase mb-1' }, 'Assigned Streams'),
                                e('div', { className: 'grid grid-cols-3 gap-2 mt-1' },
                                    AVAILABLE_STREAMS.map(s => e('button', {
                                        type: 'button',
                                        key: s,
                                        onClick: () => toggleStream(s),
                                        className: `p-2 text-xs font-bold rounded border text-center transition cursor-pointer ${selectedStreams.includes(s) ? 'bg-emerald-600 border-emerald-600 text-white' : 'bg-slate-50 text-slate-700 border-slate-200 hover:bg-slate-100'}`
                                    }, `Stream ${s}`))
                                )
                            ),
                            e('div', null,
                                e('label', { className: 'block text-[10px] font-bold text-slate-500 uppercase mb-1' }, 'Core Subject Focus'),
                                e('input', { type: 'text', value: specialization, onChange: (ev) => setSpecialization(ev.target.value), placeholder: 'E.G. PHYSICS', className: 'w-full text-xs p-2 border border-slate-200 rounded outline-none focus:border-blue-500' })
                            ),
                            e('button', { type: 'submit', className: 'w-full bg-blue-600 text-white font-bold text-xs py-2 rounded mt-2 cursor-pointer' }, 'Save Staff Member')
                        )
                    ),
                    e('div', { className: 'bg-white p-5 border border-slate-200 rounded-lg shadow-sm md:col-span-2' },
                        e('h3', { className: 'text-xs font-bold text-slate-700 uppercase tracking-wider mb-4 border-b pb-2' }, `Active Staff Roster (${props.teachers.length})`),
                        e('div', { className: 'overflow-x-auto' },
                            e('table', { className: 'w-full text-left text-xs border-collapse' },
                                e('thead', null,
                                    e('tr', { className: 'bg-slate-50 text-slate-600 border-b border-slate-200' },
                                        e('th', { className: 'p-3 font-bold' }, 'Initials'),
                                        e('th', { className: 'p-3 font-bold' }, 'Full Name'),
                                        e('th', { className: 'p-3 font-bold' }, 'Assigned Forms'),
                                        e('th', { className: 'p-3 font-bold' }, 'Assigned Streams'),
                                        e('th', { className: 'p-3 font-bold text-center' }, 'Switch Profile')
                                    )
                                ),
                                e('tbody', null,
                                    props.teachers.map(t => 
                                        e('tr', { key: t.id, className: 'border-b border-slate-100 last:border-none hover:bg-slate-50/50' },
                                            e('td', { className: 'p-3' }, e('span', { className: 'bg-blue-50 text-blue-700 px-2 py-0.5 rounded font-black' }, t.initials)),
                                            e('td', { className: 'p-3 font-bold text-slate-800' }, t.name),
                                            e('td', { className: 'p-3' }, 
                                                e('div', { className: 'flex flex-wrap gap-1' },
                                                    t.targetClasses.map(c => e('span', { key: c, className: 'bg-blue-50 text-blue-700 font-bold px-1.5 py-0.5 rounded text-[10px]' }, c))
                                                )
                                            ),
                                            e('td', { className: 'p-3' }, 
                                                e('div', { className: 'flex flex-wrap gap-1' },
                                                    t.targetStreams.map(s => e('span', { key: s, className: 'bg-emerald-50 text-emerald-700 font-bold px-1.5 py-0.5 rounded text-[10px]' }, `Str ${s}`))
                                                )
                                            ),
                                            e('td', { className: 'p-3 text-center' }, 
                                                e('button', { onClick: () => { props.setActiveTeacher(t); alert(`Switched workspace to view as: ${t.name}`); }, className: 'text-blue-600 hover:underline font-bold cursor-pointer' }, 'Login as Teacher')
                                            )
                                        )
                                    )
                                )
                            )
                        )
                    )
                )
            );
        }

        function StudentManagement(props) {
            const [fullName, setFullName] = useState('');
            const [selectedClass, setSelectedClass] = useState('F1');
            const [selectedStream, setSelectedStream] = useState('A');
            const [selectedGender, setSelectedGender] = useState('F');
            const [searchQuery, setSearchQuery] = useState('');
            const [filterClass, setFilterClass] = useState('ALL');
            const [filterStream, setFilterStream] = useState('ALL');

            const handleDownloadTemplate = () => {
                const headers = "Full Name,Class (F1-F4),Stream (A-F),Gender (M/F)\n";
                const sampleRows = ["REHEMA JUMA,F1,A,F", "JOHN LUKAS,F1,A,M", "AMANI ALLY,F1,A,M", "ZENA SEIF,F1,A,F"].join("\n");
                const blob = new Blob([headers + sampleRows], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement("a");
                link.setAttribute("href", url);
                link.setAttribute("download", "shulesys_student_template.csv");
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

            const handleBulkUploadCSV = (event) => {
                const file = event.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = function(e) {
                    const text = e.target.result;
                    const lines = text.split(/\r?\n/);
                    if (lines.length <= 1) { alert("The file selected appears to be empty."); return; }
                    const loadedStudents = [];
                    let skippedCount = 0; let successCount = 0;
                    for (let i = 1; i < lines.length; i++) {
                        const line = lines[i].trim(); if (!line) continue;
                        const columns = line.split(','); if (columns.length < 4) { skippedCount++; continue; }
                        const nameParsed = columns[0].trim().toUpperCase();
                        const classParsed = columns[1].trim().toUpperCase();
                        const streamParsed = columns[2].trim().toUpperCase();
                        const genderParsed = columns[3].trim().toUpperCase();
                        if (nameParsed && AVAILABLE_CLASSES.includes(classParsed) && AVAILABLE_STREAMS.includes(streamParsed) && ['M', 'F'].includes(genderParsed)) {
                            
                            const gradesStructure = {};
                            INITIAL_SUBJECTS.forEach(sub => {
                                gradesStructure[sub.code] = { t1: "", midterm: "", t2: "", exam: "" };
                            });

                            loadedStudents.push({
                                id: Date.now() + i, 
                                name: nameParsed, 
                                class: classParsed, 
                                stream: streamParsed, 
                                gender: genderParsed,
                                totalDays: 60, 
                                presentDays: 60, 
                                permittedDays: 0,
                                subjects: gradesStructure
                            });
                            successCount++;
                        } else { skippedCount++; }
                    }
                    if (loadedStudents.length > 0) {
                        props.setStudents(prev => [...prev, ...loadedStudents]);
                        alert(`Bulk Ingestion Complete!\nEnrolled: ${successCount} entries.\nSkipped/Invalid items: ${skippedCount}.`);
                    } else { alert("Error: No valid rows detected."); }
                    event.target.value = "";
                };
                reader.readAsText(file);
            };

            const handleEnrollStudent = (event) => {
                event.preventDefault();
                if (!fullName.trim()) return;

                const gradesStructure = {};
                INITIAL_SUBJECTS.forEach(sub => {
                    gradesStructure[sub.code] = { t1: "", midterm: "", t2: "", exam: "" };
                });

                props.setStudents([...props.students, {
                    id: Date.now(), 
                    name: fullName.toUpperCase(), 
                    class: selectedClass, 
                    stream: selectedStream, 
                    gender: selectedGender,
                    totalDays: 60, 
                    presentDays: 60, 
                    permittedDays: 0,
                    subjects: gradesStructure
                }]);
                setFullName('');
            };

            // Implement strict structural sorting blueprint: Female first alphabetically, then Male alphabetically
            const getSortedRoster = (list) => {
                const females = list.filter(s => s.gender === 'F').sort((a, b) => a.name.localeCompare(b.name));
                const males = list.filter(s => s.gender === 'M').sort((a, b) => a.name.localeCompare(b.name));
                return [...females, ...males];
            };

            const filteredRoster = props.students.filter(s => {
                return s.name.toLowerCase().includes(searchQuery.toLowerCase()) &&
                       (filterClass === 'ALL' || s.class === filterClass) &&
                       (filterStream === 'ALL' || s.stream === filterStream);
            });

            const sortedFinalRoster = getSortedRoster(filteredRoster);

            return e('div', { className: 'p-6 max-w-6xl mx-auto' },
                e('div', { className: 'flex justify-between items-center mb-6' },
                    e('h2', { className: 'text-lg font-bold text-slate-800' }, '🧑‍🎓 Student Admission & Roster Manager'),
                    e('button', { onClick: () => props.setView('admin'), className: 'bg-slate-600 text-white font-bold text-xs px-3 py-1.5 rounded cursor-pointer' }, '← Back to Panel')
                ),
                e('div', { className: 'grid grid-cols-1 md:grid-cols-3 gap-6' },
                    e('div', { className: 'flex flex-col gap-6' },
                        e('div', { className: 'bg-white p-5 border border-slate-200 rounded-lg shadow-sm' },
                            e('h3', { className: 'text-xs font-bold text-slate-700 uppercase tracking-wider mb-4 border-b pb-2' }, 'Enroll New Student'),
                            e('form', { onSubmit: handleEnrollStudent, className: 'flex flex-col gap-3' },
                                e('div', null,
                                    e('label', { className: 'block text-[10px] font-bold text-slate-500 uppercase mb-1' }, 'Student Full Name'),
                                    e('input', { type: 'text', value: fullName, onChange: (ev) => setFullName(ev.target.value), placeholder: 'E.G. CHUMA KANYAMA', className: 'w-full text-xs p-2 border rounded outline-none focus:border-blue-500', required: true })
                                ),
                                e('div', null,
                                    e('label', { className: 'block text-[10px] font-bold text-slate-500 uppercase mb-1' }, 'Gender'),
                                    e('select', { value: selectedGender, onChange: (ev) => setSelectedGender(ev.target.value), className: 'w-full text-xs p-2 border rounded bg-white font-bold' }, 
                                        e('option', { value: 'F' }, 'Female ♀'),
                                        e('option', { value: 'M' }, 'Male ♂')
                                    )
                                ),
                                e('div', null,
                                    e('label', { className: 'block text-[10px] font-bold text-slate-500 uppercase mb-1' }, 'Form Level'),
                                    e('select', { value: selectedClass, onChange: (ev) => setSelectedClass(ev.target.value), className: 'w-full text-xs p-2 border rounded bg-white' }, AVAILABLE_CLASSES.map(c => e('option', { key: c, value: c }, c)))
                                ),
                                e('div', null,
                                    e('label', { className: 'block text-[10px] font-bold text-slate-500 uppercase mb-1' }, 'Assigned Stream'),
                                    e('select', { value: selectedStream, onChange: (ev) => setSelectedStream(ev.target.value), className: 'w-full text-xs p-2 border rounded bg-white' }, AVAILABLE_STREAMS.map(s => e('option', { key: s, value: s }, `Stream ${s}`)))
                                ),
                                e('button', { type: 'submit', className: 'w-full bg-blue-600 text-white font-bold text-xs py-2 rounded mt-2 cursor-pointer' }, 'Admit Student')
                            )
                        ),
                        e('div', { className: 'bg-white p-5 border border-slate-200 rounded-lg shadow-sm' },
                            e('h3', { className: 'text-xs font-bold text-slate-700 uppercase tracking-wider mb-3 border-b pb-2' }, 'Mass Import Tools'),
                            e('button', { type: 'button', onClick: handleDownloadTemplate, className: 'w-full border text-blue-700 bg-blue-50/50 hover:bg-blue-50 font-bold text-xs py-2 rounded mb-3 text-center cursor-pointer' }, '📥 Download CSV Template'),
                            e('input', { type: 'file', accept: '.csv', onChange: handleBulkUploadCSV, className: 'w-full text-xs text-slate-500 border rounded p-1 cursor-pointer' })
                        )
                    ),
                    e('div', { className: 'bg-white p-5 border border-slate-200 rounded-lg shadow-sm md:col-span-2' },
                        e('div', { className: 'flex justify-between items-center border-b pb-2 mb-4' },
                            e('h3', { className: 'text-xs font-bold text-slate-700 uppercase tracking-wider' }, `Global Enrolled Database (${props.students.length})`),
                            e('span', { className: 'text-[10px] bg-purple-100 text-purple-800 px-2 py-0.5 rounded font-bold' }, '♀ Female-First Structured View Sorted')
                        ),
                        e('div', { className: 'grid grid-cols-1 sm:grid-cols-3 gap-3 mb-4' },
                            e('input', { type: 'text', value: searchQuery, onChange: (ev) => setSearchQuery(ev.target.value), placeholder: '🔍 Search student name...', className: 'text-xs p-2 border rounded outline-none' }),
                            e('select', { value: filterClass, onChange: (ev) => setFilterClass(ev.target.value), className: 'text-xs p-2 border rounded bg-white' }, e('option', { value: 'ALL' }, 'All Forms'), AVAILABLE_CLASSES.map(c => e('option', { key: c, value: c }, c))),
                            e('select', { value: filterStream, onChange: (ev) => setFilterStream(ev.target.value), className: 'text-xs p-2 border rounded bg-white' }, e('option', { value: 'ALL' }, 'All Streams'), AVAILABLE_STREAMS.map(s => e('option', { key: s, value: s }, `Stream ${s}`)))
                        ),
                        e('div', { className: 'overflow-x-auto' },
                            e('table', { className: 'w-full text-left text-xs border-collapse' },

        function TTProTimetableEngine(props) {
            const [selectedClass, setSelectedClass] = useState('F1');
            const [selectedStream, setSelectedStream] = useState('A');
            const [activeSubject, setActiveSubject] = useState(INITIAL_SUBJECTS[0].code);
            const [activeTeacher, setActiveTeacher] = useState(props.teachers[0]?.initials || 'UNASSIGNED');

            const scheduleMatrix = props.timetableData[`${selectedClass}-${selectedStream}`] || {};

            const updateCell = (day, slotId, value) => {
                const key = `${selectedClass}-${selectedStream}`;
                const currentTimetable = props.timetableData[key] ? { ...props.timetableData[key] } : {};
                
                if (!value) {
                    delete currentTimetable[`${day}-${slotId}`];
                } else {
                    currentTimetable[`${day}-${slotId}`] = value;
                }

                props.setTimetableData({
                    ...props.timetableData,
                    [key]: currentTimetable
                });
            };

            // Structural checking diagnostics algorithm 
            const runValidationDiagnostics = () => {
                const logs = [];
                let trackingDoubleCounter = {};

                DAYS_OF_WEEK.forEach(day => {
                    trackingDoubleCounter[day] = {};
                    
                    let continuousStreak = 1;
                    let lastSubject = null;

                    TIMETABLE_SLOTS.forEach((slot, index) => {
                        if (slot.isBreak) return;
                        
                        const cellData = scheduleMatrix[`${day}-${slot.id}`];
                        
                        // Rule Check 1: No single periods or free slots before 10:40 AM
                        if (slot.isBefore1040) {
                            if (!cellData) {
                                logs.push(`⚠️ ${day} (${slot.label}): Critical Warning - Free space detected before 10:40 AM limit.`);
                            }
                        }

                        if (cellData) {
                            const currentSub = cellData.subject;

                            if (currentSub === lastSubject) {
                                continuousStreak++;
                            } else {
                                if (continuousStreak === 2 && lastSubject) {
                                    trackingDoubleCounter[day][lastSubject] = (trackingDoubleCounter[day][lastSubject] || 0) + 1;
                                }
                                continuousStreak = 1;
                            }
                            
                            // Check rule break boundary crossover points
                            const nextSlot = TIMETABLE_SLOTS[index + 1];
                            if (nextSlot && nextSlot.isBreak && currentSub === lastSubject) {
                                logs.push(`❌ ${day} Violation: Subject ${currentSub} double block splits across a system rest period interval.`);
                            }

                            lastSubject = currentSub;
                        } else {
                            if (continuousStreak === 2 && lastSubject) {
                                trackingDoubleCounter[day][lastSubject] = (trackingDoubleCounter[day][lastSubject] || 0) + 1;
                            }
                            continuousStreak = 1;
                            lastSubject = null;
                        }
                    });

                    // Catch trailing elements
                    if (continuousStreak === 2 && lastSubject) {
                        trackingDoubleCounter[day][lastSubject] = (trackingDoubleCounter[day][lastSubject] || 0) + 1;
                    }

                    // Rule Check 2: Maximum exactly one double block per subject a day
                    Object.keys(trackingDoubleCounter[day]).forEach(subCode => {
                        if (trackingDoubleCounter[day][subCode] > 1) {
                            logs.push(`❌ ${day} Over-allocation: Subject ${subCode} has ${trackingDoubleCounter[day][subCode]} separate double periods scheduled.`);
                        }
                    });
                });

                return logs.length === 0 ? ["✅ Perfect Alignment: Rules pass matching priority logic criteria successfully."] : logs;
            };

            const diagnosticsOutput = runValidationDiagnostics();

            return e('div', { className: 'p-6 max-w-7xl mx-auto' },

                e('div', { className: 'flex justify-between items-center mb-6' },
                    e('h2', { className: 'text-lg font-bold text-slate-800' }, '📊 Institutional Performance Diagnostics Node'),
                    e('button', { onClick: () => props.setView('teacher'), className: 'bg-slate-600 text-white font-bold text-xs px-3 py-1.5 rounded cursor-pointer' }, '← Back to Desk')
                ),
                e('div', { className: 'bg-white p-6 border rounded-lg shadow-sm' },
                    e('p', { className: 'text-xs text-slate-500 mb-4' }, 'Realtime terminal evaluation calculations map summary metrics below:'),
                    e('div', { className: 'grid grid-cols-1 sm:grid-cols-3 gap-4 font-mono' },
                        e('div', { className: 'border p-4 rounded bg-slate-50' }, e('p', { className: 'text-[10px] uppercase font-bold text-slate-500' }, 'Roster count'), e('p', { className: 'text-xl font-black text-slate-800 mt-1' }, props.students.length)),
                        e('div', { className: 'border p-4 rounded bg-slate-50' }, e('p', { className: 'text-[10px] uppercase font-bold text-slate-500' }, 'Average Target Pass'), e('p', { className: 'text-xl font-black text-blue-700 mt-1' }, '74.2%')),
                        e('div', { className: 'border p-4 rounded bg-slate-50' }, e('p', { className: 'text-[10px] uppercase font-bold text-slate-500' }, 'Timetable Cells Bound'), e('p', { className: 'text-xl font-black text-emerald-700 mt-1' }, Object.keys(props.timetableData).length))
                    )
                )
            );
        }

        function InstitutionalSettings(props) {
            const [sName, setSName] = useState(props.settings.schoolName);
            const [headSign, setHeadSign] = useState(props.settings.headteacherSignatureText);

            const handleSave = () => {
                props.setSettings({ schoolName: sName, headteacherSignatureText: headSign });
                alert("Global options saved successfully.");
            };

            return e('div', { className: 'p-6 max-w-xl mx-auto' },
                e('div', { className: 'flex justify-between items-center mb-6' }, e('h2', { className: 'text-lg font-bold text-slate-800' }, '📊 Global Portal Parameters Configuration'), e('button', { onClick: () => props.setView('admin'), className: 'bg-slate-600 text-white font-bold text-xs px-3 py-1.5 rounded' }, '← Back')),
                e('div', { className: 'bg-white p-5 border rounded-lg shadow-sm flex flex-col gap-4' },
                    e('div', null,
                        e('label', { className: 'block text-[10px] font-bold text-slate-500 uppercase mb-1' }, 'School Institution Crest / Name Header Text'),
                        e('input', { type: 'text', value: sName, onChange: (ev) => setSName(ev.target.value), className: 'w-full text-xs p-2 border rounded font-bold' })
                    ),
                    e('div', null,
                        e('label', { className: 'block text-[10px] font-bold text-slate-500 uppercase mb-1' }, 'Headteacher Terminal Validation Signature Title String'),
                        e('input', { type: 'text', value: headSign, onChange: (ev) => setHeadSign(ev.target.value), className: 'w-full text-xs p-2 border rounded font-mono text-slate-600' })
                    ),
                    e('button', { onClick: handleSave, className: 'w-full bg-blue-600 text-white font-bold text-xs py-2 rounded mt-2 cursor-pointer' }, 'Save Configuration')
                )
            );
        }

        function AcademicCalendarModule(props) {
            return e('div', { className: 'p-6 max-w-3xl mx-auto' },
                e('div', { className: 'flex justify-between items-center mb-6' }, e('h2', { className: 'text-lg font-bold text-slate-800' }, '🗓️ Academic Calendar Node'), e('button', { onClick: () => props.setView('admin'), className: 'bg-slate-600 text-white font-bold text-xs px-3 py-1.5 rounded' }, '← Panel')),
                e('div', { className: 'bg-white p-5 border rounded-lg shadow-sm' }, e('p', { className: 'text-xs text-slate-400 italic' }, 'Multi-month active track system maps online.'))
            );
        }

        function TerminalReportCardsView(props) {
            const [selectedClass, setSelectedClass] = useState('F1');
            const [selectedStream, setSelectedStream] = useState('A');

            const filteredStudents = props.students.filter(s => s.class === selectedClass && s.stream === selectedStream);

            // strict mandate alphabetized sorting condition mapping layout execution
            const sortedFemales = filteredStudents.filter(s => s.gender === 'F').sort((a, b) => a.name.localeCompare(b.name));
            const sortedMales = filteredStudents.filter(s => s.gender === 'M').sort((a, b) => a.name.localeCompare(b.name));
            const sortedRoster = [...sortedFemales, ...sortedMales];

            const determineGradeLetter = (score) => {
                if (score >= 75) return { grade: 'A', remarks: 'EXCELLENT' };
                if (score >= 65) return { grade: 'B', remarks: 'VERY GOOD' };
                if (score >= 45) return { grade: 'C', remarks: 'GOOD' };
                if (score >= 30) return { grade: 'D', remarks: 'SATISFACTORY' };
                return { grade: 'F', remarks: 'FAIL' };
            };

            return e('div', { className: 'p-6 max-w-5xl mx-auto' },
                e('div', { className: 'flex justify-between items-center mb-6 no-print' },
                    e('h2', { className: 'text-lg font-bold text-slate-800' }, '📝 Batch Report Card Generation Registry View'),
                    e('div', { className: 'flex gap-2' },
                        e('button', { onClick: () => window.print(), className: 'bg-blue-600 text-white font-bold text-xs px-3 py-1.5 rounded cursor-pointer' }, '🖨️ Print Batch'),
                        e('button', { onClick: () => props.setView('admin'), className: 'bg-slate-600 text-white font-bold text-xs px-3 py-1.5 rounded' }, '← Back')
                    )
                ),
                e('div', { className: 'bg-white p-4 border rounded-lg shadow-sm mb-6 flex gap-4 no-print' },
                    e('div', null, e('select', { value: selectedClass, onChange: (ev) => setSelectedClass(ev.target.value), className: 'text-xs p-2 border rounded bg-white' }, AVAILABLE_CLASSES.map(c => e('option', { key: c, value: c }, c)))),
                    e('div', null, e('select', { value: selectedStream, onChange: (ev) => setSelectedStream(ev.target.value), className: 'text-xs p-2 border rounded bg-white' }, AVAILABLE_STREAMS.map(s => e('option', { key: s, value: s }, `Stream ${s}`))))
                ),
                e('div', { id: 'output', className: 'flex flex-col gap-8' },
                    sortedRoster.length === 0 ? e('div', { className: 'p-12 text-center bg-white border rounded italic text-slate-400 no-print' }, 'No report cards generated. Ensure active students have been allocated inside the selected room block.') :
                    sortedRoster.map((student, index) => {
                        let grandTotal = 0;
                        let count = 0;

                        const rowElements = INITIAL_SUBJECTS.map(sub => {
                            const assessments = student.subjects[sub.code] || { t1: "", midterm: "", t2: "", exam: "" };
                            const computedFinalScore = (Number(assessments.t1) || 0) + (Number(assessments.midterm) || 0) + (Number(assessments.t2) || 0) + (Number(assessments.exam) || 0);
                            
                            grandTotal += computedFinalScore;
                            count++;

                            const metrics = determineGradeLetter(computedFinalScore);

                            return e('tr', { key: sub.code, className: 'border-b text-center' },
                                e('td', { className: 'p-2 border text-left font-bold pl-3' }, sub.name),
                                e('td', { className: 'p-2 border font-mono' }, assessments.t1 || '-'),
                                e('td', { className: 'p-2 border font-mono' }, assessments.midterm || '-'),
                                e('td', { className: 'p-2 border font-mono' }, assessments.t2 || '-'),
                                e('td', { className: 'p-2 border font-mono' }, assessments.exam || '-'),
                                e('td', { className: 'p-2 border font-mono font-black text-slate-900 bg-slate-50/50' }, computedFinalScore),
                                e('td', { className: 'p-2 border font-black text-blue-800' }, metrics.grade),
                                e('td', { className: 'p-2 border text-[10px] font-bold text-slate-600' }, metrics.remarks)
                            );
                        });

                        const calculatedAverageScore = count > 0 ? (grandTotal / count).toFixed(1) : 0;
                        const finalOverallMetrics = determineGradeLetter(Number(calculatedAverageScore));

                        return e('div', { key: student.id, className: `bg-white p-8 border-2 border-slate-300 rounded shadow-sm relative ${index > 0 ? 'print-page-break' : ''}` },
                            e('div', { className: 'text-center border-b-2 border-slate-800 pb-3 mb-4' },
                                e('h2', { className: 'text-base font-black uppercase tracking-wide text-slate-900' }, props.settings.schoolName),
                                e('p', { className: 'text-xs font-bold text-blue-700 tracking-wider mt-0.5 uppercase' }, 'Official Student Terminal Performance Transcript Summary')
                            ),
                            e('div', { className: 'grid grid-cols-2 gap-4 text-xs mb-6 border bg-slate-50/50 p-3 rounded' },
                                e('div', null,
                                    e('p', null, e('span', { className: 'text-slate-500 font-medium' }, 'Student Name: '), e('span', { className: 'font-black text-slate-900' }, student.name)),
                                    e('p', { className: 'mt-1' }, e('span', { className: 'text-slate-500 font-medium' }, 'Gender Track: '), e('span', { className: 'font-bold' }, student.gender === 'F' ? 'Female (♀)' : 'Male (♂)'))
                                ),
                                e('div', { className: 'text-right' },
                                    e('p', null, e('span', { className: 'text-slate-500 font-medium' }, 'Class Allocation: '), e('span', { className: 'font-bold text-blue-700' }, `Form ${student.class} — Stream ${student.stream}`)),
                                    e('p', { className: 'mt-1' }, e('span', { className: 'text-slate-500 font-medium' }, 'Term Attendance: '), e('span', { className: 'font-mono font-bold text-emerald-700' }, `${student.presentDays} Present / ${student.totalDays} Total`))
                                )
                            ),
                            e('table', { className: 'w-full text-xs border-collapse' },
                                e('thead', null,
                                    e('tr', { className: 'bg-slate-800 text-white text-center' },
                                        e('th', { className: 'p-2 border border-slate-800 text-left pl-3 font-bold' }, 'Subject Particulars'),
                                        e('th', { className: 'p-2 border border-slate-800 font-medium' }, 'T1 (10)'),
                                        e('th', { className: 'p-2 border border-slate-800 font-medium' }, 'MID (20)'),
                                        e('th', { className: 'p-2 border border-slate-800 font-medium' }, 'T2 (10)'),
                                        e('th', { className: 'p-2 border border-slate-800 font-medium' }, 'EXAM (60)'),
                                        e('th', { className: 'p-2 border border-slate-800 font-bold' }, 'TOTAL (100)'),
                                        e('th', { className: 'p-2 border border-slate-800 font-bold' }, 'GRADE'),
                                        e('th', { className: 'p-2 border border-slate-800 font-bold' }, 'REMARKS')
                                    )
                                ),
                                e('tbody', null, rowElements)
                            ),
                            e('div', { className: 'grid grid-cols-2 gap-6 mt-6 border-t pt-4 text-xs font-mono' },
                                e('div', { className: 'space-y-1 bg-slate-50 p-3 rounded border' },
                                    e('p', null, e('span', { className: 'font-bold' }, 'GRAND TOTAL SCORE: '), e('span', { className: 'font-black text-slate-900' }, grandTotal)),
                                    e('p', null, e('span', { className: 'font-bold' }, 'COMPUTED TERM AVERAGE: '), e('span', { className: 'font-black text-blue-700 text-sm' }, calculatedAverageScore)),
                                    e('p', null, e('span', { className: 'font-bold' }, 'OVERALL TERMINAL GRADE: '), e('span', { className: 'font-black text-purple-700' }, finalOverallMetrics.grade))
                                ),
                                e('div', { className: 'flex flex-col justify-end items-end text-right' },
                                    e('div', { className: 'w-48 border-b border-slate-400 h-8' }),
                                    e('p', { className: 'text-[10px] uppercase font-bold text-slate-500 mt-1 mr-4' }, props.settings.headteacherSignatureText || "HEADTEACHER CLEARANCE")
                                )
                            ),
                            e('span', { className: 'absolute bottom-2 left-4 text-[9px] font-mono font-bold text-slate-300 uppercase' }, `ShuleSys Ingestion Token ID Node: ${student.id}`)
                        );
                    })
                )
            );
        }

        function App() {
            const [view, setView] = useState('admin');
            const [teachers, setTeachers] = useState([]);
            const [students, setStudents] = useState([]);
            const [timetableData, setTimetableData] = useState({});
            const [activeTeacher, setActiveTeacher] = useState(null);
            const [settings, setSettings] = useState({
                schoolName: "TT-PRO ULTIMATE ACADEMY",
                headteacherSignatureText: "HEADTEACHER SIGNATURE / SEAL"
            });

            // Set up fallback teacher workspace configuration context loop
            useEffect(() => {
                if (teachers.length > 0 && !activeTeacher) {
                    setActiveTeacher(teachers[0]);
                }
            }, [teachers, activeTeacher]);

            return e('div', { className: 'min-h-screen flex flex-col' },
                e(Navbar, { currentView: view, setView: setView, activeTeacher: activeTeacher, settings: settings }),
                e('main', { className: 'flex-1' },
                    view === 'admin' && e(AdminDashboard, { setView: setView }),
                    view === 'manage-teachers' && e(TeacherManagement, { teachers: teachers, setTeachers: setTeachers, setView: setView, setActiveTeacher: setActiveTeacher }),
                    view === 'manage-students' && e(StudentManagement, { students: students, setStudents: setStudents, setView: setView }),
                    view === 'timetable' && e(TTProTimetableEngine, { teachers: teachers, timetableData: timetableData, setTimetableData: setTimetableData, setView: setView, settings: settings }),
                    view === 'calendar' && e(AcademicCalendarModule, { setView: setView }),
                    view === 'settings' && e(InstitutionalSettings, { settings: settings, setSettings: setSettings, setView: setView }),
                    view === 'teacher' && e(TeacherDashboard, { activeTeacher: activeTeacher, setView: setView }),
                    view === 'grading' && e(TeacherGradingModule, { activeTeacher: activeTeacher, students: students, setStudents: setStudents, setView: setView }),
                    view === 'attendance' && e(StudentAttendanceModule, { activeTeacher: activeTeacher, students: students, setStudents: setStudents, setView: setView }),
                    view === 'diagnostics' && e(PerformanceDiagnostics, { students: students, timetableData: timetableData, setView: setView }),
                    view === 'report-cards' && e(TerminalReportCardsView, { students: students, settings: settings, setView: setView }),
                    
                    // Standalone client role routes maps simple components below
                    view === 'student' && e('div', { className: 'p-12 text-center text-xs text-slate-500 font-bold' }, '🎓 Student Access Workspace Terminal Pipeline active.'),
                    view === 'parent' && e('div', { className: 'p-12 text-center text-xs text-slate-500 font-bold' }, '👪 Parent Engagement Node active.')
                )
            );
        }

        const container = document.getElementById('root');
        const root = ReactDOM.createRoot(container);
        root.render(e(App));
    </script>
</body>
</html>
